<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>블로그 초안 생성</title>
<style>
:root {
  --bg:#0a0c10;--bg2:#111318;--bg3:#181c24;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --text:#e8eaf0;--text2:#8892a4;--text3:#4a5568;
  --blue:#3b82f6;--green:#10b981;--red:#ef4444;--amber:#f59e0b;
  --radius:10px;--radius-sm:6px;
  --font:'Pretendard','Apple SD Gothic Neo',-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;min-height:100vh}
.topbar{height:52px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px}
.topbar h1{font-size:15px;font-weight:700;flex:1}
.topbar a{color:var(--text2);font-size:12px;text-decoration:none}
.wrap{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px;height:calc(100vh - 52px)}
.panel{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;min-height:0}
.panel-head{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.panel-head .label{font-size:12px;color:var(--text2);font-weight:600;flex:1}
button{background:var(--bg3);border:1px solid var(--border2);color:var(--text);padding:6px 12px;border-radius:var(--radius-sm);cursor:pointer;font-size:12px;font-family:var(--font)}
button:hover{border-color:var(--blue)}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
button.on{color:var(--blue);border-color:var(--blue)}
textarea{flex:1;background:var(--bg);color:var(--text);border:none;padding:14px;font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.6;resize:none;outline:none}
.meta{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:6px;font-size:13px}
.meta .title{font-size:16px;font-weight:700}
.meta .tags{color:var(--blue);font-size:12px;word-break:break-all}
.meta .stat{color:var(--text2);font-size:12px}
.warn{color:var(--amber);font-size:12px}
.err{color:var(--red);font-size:12px}
.preview{flex:1;overflow-y:auto;background:#fff;color:#222;padding:24px;border-radius:0 0 var(--radius) var(--radius);font-size:15px;line-height:1.8}
.preview p{margin:0 0 12px}
.preview ul{margin:0 0 12px 20px}
.preview blockquote{border-left:4px solid #03c75a;background:#f5f7f5;padding:10px 14px;margin:0 0 12px}
.preview hr{border:none;border-top:1px solid #ddd;margin:20px 0}
.preview a{color:#03c75a}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:8px 16px;border-radius:var(--radius-sm);font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (max-width:860px){
  .wrap{grid-template-columns:1fr;height:auto;padding:12px}
  textarea{min-height:360px}
  .preview{min-height:400px}
}
</style>
</head>
<body>
<div class="topbar">
  <h1>네이버 블로그 초안 생성</h1>
  <a href="/">← 대시보드</a>
</div>
<div class="wrap">
  <div class="panel">
    <div class="panel-head">
      <span class="label">입력 (JSON)</span>
      <button id="t-info" class="on" onclick="loadTemplate('info')">정보성 글</button>
      <button id="t-bc" onclick="loadTemplate('brandconnect')">브랜드커넥트</button>
      <button class="primary" onclick="generate()">초안 생성</button>
    </div>
    <textarea id="input" spellcheck="false"></textarea>
  </div>
  <div class="panel">
    <div class="panel-head">
      <span class="label">미리보기</span>
      <button onclick="copyTitle()">제목 복사</button>
      <button onclick="copyBody()">본문 복사</button>
      <button onclick="copyTags()">태그 복사</button>
    </div>
    <div class="meta" id="meta"><span class="stat">왼쪽 내용을 채우고 '초안 생성'을 누르세요. 본문 복사 후 스마트에디터에 붙여넣으면 서식이 유지됩니다.</span></div>
    <div class="preview" id="preview"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const TEMPLATES = {
  info: {
    type: "info",
    keyword: "메인 검색 키워드",
    title: "",
    intro: "도입 문단. 독자가 왜 이 글을 읽어야 하는지 2~3문장으로.\n\n빈 줄로 문단을 나눕니다.",
    sections: [
      { heading: "소제목 1", body: "본문 내용", bullets: ["핵심 포인트"], image_hint: "넣을 사진 설명" },
      { heading: "소제목 2", body: "본문 내용", bullets: [] }
    ],
    summary: ["요약 1", "요약 2"],
    faqs: [{ q: "자주 묻는 질문", a: "답변" }],
    tags: ["태그1", "태그2"],
    closing: "도움이 되셨다면 공감과 이웃추가 부탁드립니다."
  },
  brandconnect: {
    type: "brandconnect",
    keyword: "메인 검색 키워드",
    title: "",
    product: {
      name: "상품명",
      brand: "브랜드",
      link: "https://naver.me/브랜드커넥트_링크",
      price: "00,000원",
      specs: { "무게": "", "크기": "" },
      pros: ["좋았던 점"],
      cons: ["아쉬운 점"],
      recommend_for: ["추천 대상"],
      image_hint: "제품 전체 사진"
    },
    sections: [
      { heading: "직접 써본 후기", body: "사용 기간, 사용 환경, 느낀 점", image_hint: "사용 중 사진" }
    ],
    summary: [],
    faqs: [],
    tags: ["태그1", "태그2"],
    closing: ""
  }
};
const DRAFT_KEY = "blogDraftInput";
let draft = null;

function loadTemplate(type) {
  document.getElementById("t-info").classList.toggle("on", type === "info");
  document.getElementById("t-bc").classList.toggle("on", type === "brandconnect");
  document.getElementById("input").value = JSON.stringify(TEMPLATES[type], null, 2);
}

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

async function generate() {
  const raw = document.getElementById("input").value;
  const meta = document.getElementById("meta");
  let body;
  try { body = JSON.parse(raw); } catch (e) { meta.innerHTML = `<span class="err">JSON 형식 오류: ${esc(e.message)}</span>`; return; }
  try { localStorage.setItem(DRAFT_KEY, raw); } catch (e) {}
  if (!body.title) delete body.title;
  const res = await fetch("/api/blog/draft", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await res.json();
  if (!res.ok) {
    const msg = typeof data.detail === "string" ? data.detail : data.detail.map(d => `${d.loc.slice(1).join(".")}: ${d.msg}`).join("<br>");
    meta.innerHTML = `<span class="err">${msg}</span>`;
    return;
  }
  draft = data;
  meta.innerHTML = `
    <div class="title">${esc(data.title)}</div>
    <div class="tags">${data.tags.map(t => "#" + esc(t)).join(" ")}</div>
    <div class="stat">본문 ${data.char_count.toLocaleString()}자 (공백 제외) · 태그 ${data.tags.length}개</div>
    ${data.warnings.map(w => `<div class="warn">⚠ ${esc(w)}</div>`).join("")}`;
  document.getElementById("preview").innerHTML = data.html;
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1500);
}

async function copyText(s, label) {
  if (!draft) return toast("먼저 초안을 생성하세요");
  await navigator.clipboard.writeText(s);
  toast(label + " 복사됨");
}
function copyTitle() { copyText(draft?.title, "제목"); }
function copyTags() { copyText(draft?.tags.join(","), "태그"); }

async function copyBody() {
  if (!draft) return toast("먼저 초안을 생성하세요");
  try {
    await navigator.clipboard.write([new ClipboardItem({
      "text/html": new Blob([draft.html], { type: "text/html" }),
      "text/plain": new Blob([draft.text], { type: "text/plain" })
    })]);
  } catch (e) {
    await navigator.clipboard.writeText(draft.text);
  }
  toast("본문 복사됨 — 스마트에디터에 붙여넣으세요");
}

let saved = null;
try { saved = localStorage.getItem(DRAFT_KEY); } catch (e) {}
if (saved) document.getElementById("input").value = saved; else loadTemplate("info");
</script>
</body>
</html>
