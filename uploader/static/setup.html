<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>올원업로드 · 최초 설정</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23e1306c'/><path d='M16 7l7 8h-4v9h-6v-9H9z' fill='white'/></svg>">
<style>
:root{--bg:#0a0c10;--bg2:#111318;--border:rgba(255,255,255,.09);--text:#e8eaf0;--text2:#8892a4;--blue:#3b82f6;--red:#ef4444;
  --font:'Pretendard','Apple SD Gothic Neo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;display:grid;place-items:center;padding:24px}
.box{width:100%;max-width:380px;text-align:center}
.mark{width:52px;height:52px;border-radius:16px;margin:0 auto 20px;background:linear-gradient(135deg,#ff0033,#e1306c 45%,#1877f2);display:grid;place-items:center;font-size:24px;color:#fff}
h1{font-size:21px;letter-spacing:-.02em;margin-bottom:8px}
p.sub{color:var(--text2);font-size:13px;line-height:1.65;margin-bottom:26px}
form{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:22px}
label{display:block;text-align:left;font-size:12px;color:var(--text2);margin-bottom:7px}
input{width:100%;background:var(--bg);border:1px solid rgba(255,255,255,.16);border-radius:9px;color:var(--text);
  padding:12px 13px;font-size:14px;font-family:inherit;outline:none;transition:.15s}
input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.14)}
button{width:100%;margin-top:14px;padding:13px;border:none;border-radius:9px;background:var(--blue);color:#fff;
  font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;transition:.15s}
button:hover{background:#2f74e0}
button:disabled{opacity:.5;cursor:not-allowed}
.err{margin-top:14px;font-size:12.5px;color:#fca5a5;background:rgba(239,68,68,.09);border:1px solid rgba(239,68,68,.25);
  border-radius:9px;padding:10px 12px;line-height:1.5;display:none;text-align:left}
.foot{margin-top:18px;font-size:11.5px;color:#5a6478;line-height:1.6}
</style>
</head>
<body>
<div class="box">
  <div class="mark">↑</div>
  <h1>처음 오셨네요</h1>
  <p class="sub">이 업로더는 연결된 채널에 영상을 올릴 수 있습니다.<br>
    먼저 로그인 비밀번호를 정해주세요. 다음부터는 이 비밀번호로 들어옵니다.</p>
  <form id="f">
    <label for="pw">비밀번호 (8자 이상)</label>
    <input type="password" id="pw" autocomplete="new-password" autofocus placeholder="••••••••">
    <label for="pw2" style="margin-top:14px">한 번 더 입력</label>
    <input type="password" id="pw2" autocomplete="new-password" placeholder="••••••••">
    <button type="submit" id="btn">비밀번호 정하고 시작하기</button>
    <div class="err" id="err"></div>
  </form>
  <p class="foot" id="foot">잊어버리면 서버의 <code>data/uploader.db</code> 를 지워야 초기화됩니다.</p>
</div>
<script>
const form = document.getElementById('f'), err = document.getElementById('err'), btn = document.getElementById('btn');
function fail(msg){ err.textContent = msg; err.style.display = 'block'; btn.disabled = false; }

fetch('/api/setup-state').then(r => r.json()).then(s => {
  if (!s.needs_setup) { location.href = '/'; return; }
  if (!s.can_setup_here) {
    document.getElementById('foot').innerHTML =
      '이 서버는 원격에 있습니다. 보안을 위해 최초 비밀번호는 서버가 설치된 컴퓨터에서만 정할 수 있습니다.<br>' +
      '원격 서버라면 환경변수 <b>APP_PASSWORD</b> 를 설정한 뒤 재시작하세요.';
  }
}).catch(() => {});

form.onsubmit = async e => {
  e.preventDefault();
  btn.disabled = true; err.style.display = 'none';
  const pw = document.getElementById('pw').value, pw2 = document.getElementById('pw2').value;
  if (pw.length < 8) return fail('비밀번호는 8자 이상으로 정하세요.');
  if (pw !== pw2) return fail('두 번 입력한 비밀번호가 다릅니다.');
  try {
    const res = await fetch('/api/password', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({new_password: pw}),
    });
    if (res.ok) { location.href = '/'; return; }
    const data = await res.json().catch(() => ({}));
    fail(data.detail || '설정에 실패했습니다.');
  } catch (_) {
    fail('서버에 연결할 수 없습니다.');
  }
};
</script>
</body>
</html>
