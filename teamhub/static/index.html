<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TeamHub">
<title>TeamHub · 사내 캘린더 & 업무지시</title>
<style>
:root{
  --bg:#f4f6fb;--panel:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;
  --primary:#2563eb;--primary-weak:#dbeafe;--danger:#dc2626;--ok:#16a34a;--warn:#d97706;
  --radius:10px;--shadow:0 1px 3px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.04);
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--text);font-size:14px}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
/* ---------- layout */
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 20px;height:56px}
.logo{font-weight:800;font-size:18px;color:var(--primary);white-space:nowrap}
nav{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;padding:8px 10px;border-radius:8px;color:var(--muted);font-weight:600;white-space:nowrap;flex:0 0 auto}
nav button.active{background:var(--primary-weak);color:var(--primary)}
.hdr-right{display:flex;align-items:center;gap:10px;position:relative}
.bell{position:relative;background:none;border:0;font-size:20px;padding:6px}
.badge{position:absolute;top:0;right:0;background:var(--danger);color:#fff;font-size:10px;border-radius:10px;padding:1px 5px;font-weight:700}
.user-chip{background:none;border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-weight:600}
.dropdown{position:absolute;right:0;top:46px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);min-width:200px;z-index:30}
.dropdown button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 14px}
.dropdown button:hover{background:var(--bg)}
.notif-panel{width:340px;max-height:420px;overflow:auto}
.notif-item{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.notif-item.unread{background:#eff6ff}
.notif-item small{color:var(--muted)}
main{max-width:1200px;margin:0 auto;padding:20px}
.card{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card h3{margin:0 0 12px;font-size:15px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{white-space:nowrap;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;font-weight:600}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.danger{color:var(--danger);border-color:#fecaca}
.btn.sm{padding:4px 10px;font-size:12px}
.muted{color:var(--muted)}
/* ---------- login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
#login .card{width:100%;max-width:360px;padding:32px}
#login h1{margin:0 0 4px;color:var(--primary)}
/* ---------- forms */
label{display:block;font-weight:600;font-size:13px;margin:12px 0 4px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#fff}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--primary-weak);border-color:var(--primary)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.err{color:var(--danger);font-size:13px;min-height:18px;margin-top:8px}
/* ---------- dashboard */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;cursor:pointer}
.stat b{display:block;font-size:26px;margin-top:4px}
.stat.red b{color:var(--danger)}
.dash-grid{display:grid;grid-template-columns:1fr 1.3fr;gap:16px}
.list-item{padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;cursor:pointer}
.list-item:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.empty{color:var(--muted);text-align:center;padding:24px 0}
/* ---------- tags */
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;white-space:nowrap}
.p-urgent{background:#fee2e2;color:#b91c1c}.p-high{background:#ffedd5;color:#c2410c}
.p-normal{background:#e0e7ff;color:#4338ca}.p-low{background:#f3f4f6;color:#4b5563}
.s-todo{background:#f3f4f6;color:#374151}.s-doing{background:#dbeafe;color:#1d4ed8}
.s-done{background:#dcfce7;color:#15803d}.s-hold{background:#fef3c7;color:#b45309}
.overdue{color:var(--danger);font-weight:700}
/* ---------- calendar */
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.cal-head h2{margin:0 8px;font-size:20px;min-width:140px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal .dow{padding:8px;text-align:center;font-weight:700;font-size:12px;color:var(--muted);border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fafafa}
.cal .dow:first-child{color:var(--danger)}.cal .dow:last-child{color:var(--primary)}
.day{min-height:110px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;cursor:pointer;overflow:hidden;background:#fff}
.day:hover{background:#f9fafb}
.day.other{background:#fafafa}.day.other .dnum{color:#c0c4cc}
.dnum{font-size:12px;font-weight:700;margin-bottom:2px;display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;border-radius:50%}
.day.today .dnum{background:var(--primary);color:#fff}
.day.sun .dnum{color:var(--danger)}.day.sat .dnum{color:var(--primary)}
.day.today.sun .dnum,.day.today.sat .dnum{color:#fff}
.ev{font-size:11px;padding:2px 5px;border-radius:4px;margin-bottom:2px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.task{background:#fff!important;color:var(--text);border:1px dashed #9ca3af}
.ev.task.done{text-decoration:line-through;color:var(--muted)}
.more{font-size:11px;color:var(--muted);padding-left:4px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
/* ---------- tasks */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{background:none;border:0;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.active{color:var(--primary);border-bottom-color:var(--primary)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:700;background:#fafafa}
tbody tr{cursor:pointer}tbody tr:hover{background:#f9fafb}
td.title{font-weight:600}
/* ---------- modal */
.modal-bg{position:fixed;inset:0;background:rgba(17,24,39,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow:auto}
.modal{background:var(--panel);border-radius:14px;width:100%;max-width:560px;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.modal h2{margin:0 0 6px;font-size:18px}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.assignee-box{border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.assignee-box .people{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:2px 6px}
.assignee-box label{display:flex;align-items:center;gap:6px;font-weight:400;margin:0;padding:5px 6px;border-radius:6px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.assignee-box label:hover{background:var(--bg)}
.assignee-box label:has(input:checked){background:var(--primary-weak)}
.dept-grp + .dept-grp{border-top:1px solid var(--line);margin-top:4px}
.assignee-box input{width:auto}
.dept-head{font-size:11px;font-weight:700;color:var(--muted);padding:6px 6px 2px}
.detail-meta{display:grid;grid-template-columns:90px 1fr;gap:6px 10px;margin:14px 0;font-size:13px}
.detail-meta dt{color:var(--muted)}.detail-meta dd{margin:0}
.desc{white-space:pre-wrap;background:var(--bg);border-radius:8px;padding:12px;margin:10px 0}
.status-btns{display:flex;gap:6px;flex-wrap:wrap}
.status-btns button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 12px;font-size:12px;font-weight:600}
.status-btns button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.comment{padding:8px 0;border-bottom:1px solid var(--line)}
.comment .who{font-weight:700;font-size:12px}.comment .when{color:var(--muted);font-size:11px;margin-left:6px}
.comment .body{white-space:pre-wrap;margin-top:3px}
.colors{display:flex;gap:8px}
.colors input{display:none}
.colors span{display:inline-block;width:26px;height:26px;border-radius:50%;cursor:pointer;border:3px solid transparent}
.colors input:checked+span{border-color:#111827}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:8px;z-index:100;font-weight:600}
/* ---------- quotes */
.modal.wide{max-width:980px}
.qitems{width:100%;border-collapse:collapse;margin-top:6px}
.qitems th{padding:6px 4px;font-size:11px}
.qitems td{padding:3px 2px;border-bottom:1px solid var(--line)}
.qitems input{padding:6px;font-size:13px}
.qitems .num{text-align:right}
.qitems td.calc{text-align:right;font-variant-numeric:tabular-nums;padding-right:6px;white-space:nowrap;font-size:13px}
.qtotal{display:flex;gap:18px;justify-content:flex-end;margin-top:10px;font-size:14px;flex-wrap:wrap}
.qtotal b{font-size:16px}
.q-draft{background:#f3f4f6;color:#374151}.q-sent{background:#dbeafe;color:#1d4ed8}
.q-won{background:#dcfce7;color:#15803d}.q-lost{background:#fee2e2;color:#b91c1c}
td.money{text-align:right;font-variant-numeric:tabular-nums}
.qscroll{overflow-x:auto}
.sbox{position:fixed;z-index:80;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);max-height:300px;overflow:auto;min-width:320px}
.sbox div{padding:7px 10px;cursor:pointer;font-size:13px;border-bottom:1px solid #f3f4f6}
.sbox div:hover,.sbox div.on{background:var(--primary-weak)}
.sbox small{color:var(--muted)}
.sbox .none{color:var(--muted);cursor:default}
.code{display:inline-block;font-size:10px;font-weight:700;color:#15803d;background:#dcfce7;border-radius:4px;padding:1px 5px;margin-top:2px}
.code.miss{color:#b45309;background:#fef3c7}
.code button{border:0;background:none;color:inherit;font-size:10px;padding:0 0 0 4px;cursor:pointer}
.ec-box{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:12px}
.sh-ordered{background:#f3f4f6;color:#374151}.sh-shipped{background:#dbeafe;color:#1d4ed8}
.sh-customs{background:#fef3c7;color:#b45309}.sh-arrived{background:#dcfce7;color:#15803d}
.ev.ship{background:#ecfeff!important;color:#0e7490;border:1px solid #67e8f9}
.ev.ship.done{text-decoration:line-through;color:var(--muted)}
.dday{font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;background:#f3f4f6}
.dday.late{background:#fee2e2;color:#b91c1c}.dday.today{background:#dbeafe;color:#1d4ed8}
.stats4{grid-template-columns:repeat(4,1fr)}
.mlist{display:none}
.mrow{display:block;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.mrow:active{background:var(--bg)}
.mrow .l1{display:flex;align-items:center;gap:8px}
.mrow .l1 b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.mrow .l1 .amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.mrow .l2{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.viz{--series-1:#2a78d6;--series-2:#eb6834;--grid:#ececea;--axis:#6b7280;--ink:#1f2937;--ink-2:#52514e;--surface:#fff}
.viz-wrap{position:relative}
.viz-wrap svg{display:block;width:100%;overflow:visible}
.viz-legend{display:flex;gap:16px;font-size:12px;color:var(--ink-2);margin:4px 0 8px;flex-wrap:wrap}
.viz-legend i{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.viz-tip{position:absolute;pointer-events:none;background:#111827;color:#fff;font-size:12px;padding:8px 10px;border-radius:8px;white-space:nowrap;z-index:5;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.viz-tip .sw{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.an-table td,.an-table th{padding:6px 6px;font-size:12px;white-space:nowrap}
.an-table td.num,.an-table th.num{text-align:right;font-variant-numeric:tabular-nums}
.an-table tr.sel{background:var(--primary-weak)}
.an-table tr[data-p] td{vertical-align:top}
.an-table td:first-child,.an-table th:first-child{position:sticky;left:0;background:#fff;z-index:1;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.an-table tr.sel td:first-child{background:var(--primary-weak)}
.up{color:#15803d;font-weight:700}.down{color:#b91c1c;font-weight:700}
/* ---------- responsive */
@media (max-width:860px){
  body{font-size:13px}
  /* iPhone 은 16px 미만 입력칸을 누르면 화면을 확대해 버림 → 입력칸은 16px */
  input,select,textarea{font-size:16px;padding:7px 9px}
  header{padding:0 12px;gap:8px;height:50px}
  .logo{font-size:16px}
  .card{padding:12px;border-radius:12px}
  .card h3{font-size:15px}
  .btn{padding:6px 10px;font-size:13px}
  .btn.sm{padding:4px 8px;font-size:12px}
  .row{gap:8px}
  .stats,.stats4{grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  .stats4{grid-template-columns:repeat(2,1fr)}
  .stat{padding:10px 12px;border-radius:10px}
  .stat span{font-size:12px}
  .stat b{font-size:19px;margin-top:2px;word-break:keep-all}
  .tabs{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch}
  .tabs button{white-space:nowrap;padding:8px 10px;font-size:13px}
  .list-item{padding:8px 0;gap:8px}
  h2{font-size:18px}
  .modal-bg{padding:0;align-items:stretch}
  .modal{border-radius:0;min-height:100%;padding:16px 14px 90px;max-width:none}
  .modal.wide{max-width:none}
  .modal .actions{position:sticky;bottom:0;background:var(--panel);padding:10px 0;margin-top:12px;border-top:1px solid var(--line);flex-wrap:wrap}
  label{margin:10px 0 3px}
  .mlist{display:block}
  .dtable{display:none}
  .qitems input{font-size:16px;padding:6px}
  .viz-legend{font-size:11px}
  nav{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);justify-content:space-around;padding:6px;z-index:20}
  nav{overflow-x:auto;justify-content:flex-start}
  nav button{flex:0 0 auto;font-size:12px;padding:8px 10px;white-space:nowrap}
  main{padding:12px 12px 80px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .dash-grid{grid-template-columns:1fr}
  .day{min-height:64px;padding:2px}
  .cal-head h2{min-width:0;font-size:16px;margin:0 2px;white-space:nowrap}
  .cal-head{flex-wrap:wrap;gap:6px}
  .toast{bottom:80px}
  .ev{font-size:10px;padding:1px 3px}
  .hide-m{display:none}
  .notif-panel{width:290px}
  .grid2{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<section id="login" class="hidden">
  <form class="card" id="loginForm">
    <h1>TeamHub</h1>
    <div class="muted">사내 캘린더 & 업무지시 시스템</div>
    <label>아이디</label>
    <input id="lgUser" autocomplete="username" required>
    <label>비밀번호</label>
    <input id="lgPass" type="password" autocomplete="current-password" required>
    <div class="err" id="lgErr"></div>
    <div class="muted" style="font-size:12px">아이디/비밀번호 발급·변경은 관리자에게 요청하세요.</div>
    <button class="btn primary" style="width:100%;margin-top:8px">로그인</button>
  </form>
</section>

<!-- ============ APP ============ -->
<section id="app" class="hidden">
  <header>
    <div class="logo">TeamHub</div>
    <nav id="nav">
      <button data-view="dashboard">🏠 홈</button>
      <button data-view="calendar">📅 캘린더</button>
      <button data-view="tasks">📋 업무</button>
      <button data-view="quotes">🧾 견적서</button>
      <button data-view="statements">📄 거래명세서</button>
      <button data-view="shipments">🚢 입고예정</button>
      <button data-view="mailin">📥 메일 일정</button>
      <button data-view="analytics">📊 매출분석</button>
      <button data-view="inventory">📦 재고</button>
      <button data-view="profit" class="profit-only">💰 이익분석</button>
      <button data-view="users" class="admin-only">👥 직원관리</button>
    </nav>
    <div class="hdr-right">
      <button class="bell" id="bellBtn" title="알림">🔔<span class="badge hidden" id="bellBadge">0</span></button>
      <button class="user-chip" id="userBtn"></button>
      <div class="dropdown notif-panel hidden" id="notifPanel"></div>
      <div class="dropdown hidden" id="userMenu">
        <button id="pushBtn">🔔 알림 · 앱 설치</button>
        <button id="pwBtn" class="admin-only">🔑 비밀번호 변경</button>
        <button id="logoutBtn">🚪 로그아웃</button>
      </div>
    </div>
  </header>
  <main id="main"></main>
</section>

<div id="modalRoot"></div>

<script>
// ===================================================== helpers
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayStr = () => ymd(new Date());

const PRIORITY = {urgent: '긴급', high: '높음', normal: '보통', low: '낮음'};
const STATUS = {todo: '대기', doing: '진행중', done: '완료', hold: '보류'};
const SCOPE = {company: '전사 공개', dept: '부서 공개', private: '나만 보기'};
const COLORS = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#6b7280'];

const state = {token: localStorage.getItem('th_token'), me: null, users: [], view: 'dashboard',
               calDate: new Date(), taskBox: 'received', taskStatus: ''};

async function api(path, opts = {}) {
  const res = await fetch(path, {
    method: opts.method || 'GET',
    headers: {'Content-Type': 'application/json', Authorization: 'Bearer ' + (state.token || '')},
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (res.status === 401 && path !== '/api/login') { logoutLocal(); throw new Error('로그인이 필요합니다.'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const d = data.detail;
    throw new Error(typeof d === 'string' ? d : Array.isArray(d) ? '입력값을 확인하세요.' : '요청에 실패했습니다.');
  }
  return data;
}

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}

function openModal(html, onMount) {
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal">${html}</div>`;
  bg.addEventListener('mousedown', e => { if (e.target === bg) bg.remove(); });
  $('#modalRoot').appendChild(bg);
  const close = () => bg.remove();
  $$('[data-close]', bg).forEach(b => b.onclick = close);
  onMount && onMount(bg, close);
  return close;
}

const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone;
let installPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; });

function openFromHash() {   // 알림을 눌러 들어오면 #task=번호 → 그 업무 열기
  const m = location.hash.match(/task=(\d+)/);
  if (m && state.me) { history.replaceState(null, '', location.pathname); openTask(+m[1]); }
}
window.addEventListener('hashchange', openFromHash);

async function pushInit() {
  if (!('serviceWorker' in navigator)) return;
  try { await navigator.serviceWorker.register('/sw.js'); } catch { return; }
  navigator.serviceWorker.addEventListener('message', e => {
    if (e.data && e.data.type === 'open') { const u = new URL(e.data.url); location.hash = u.hash; refreshNotifs(); }
  });
  // 이미 켠 기기는 서버에 구독을 다시 알려 둔다 (브라우저가 구독을 바꾸는 경우 대비)
  const sub = await pushSubscription();
  if (sub) api('/api/push/subscribe', {method: 'POST', body: sub.toJSON()}).catch(() => {});
}

async function pushSubscription() {
  if (!pushSupported() || Notification.permission !== 'granted') return null;
  const reg = await navigator.serviceWorker.getRegistration('/');
  return reg ? reg.pushManager.getSubscription() : null;
}

async function pushEnable() {
  if (!pushSupported()) throw new Error(isIOS() && !isStandalone()
    ? '아이폰은 먼저 "홈 화면에 추가"로 앱을 설치한 뒤, 설치된 TeamHub 앱에서 알림을 켜야 합니다.'
    : '이 브라우저는 알림을 지원하지 않습니다. 크롬이나 엣지를 쓰세요.');
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') throw new Error('알림이 차단되어 있습니다. 주소창 왼쪽 자물쇠(🔒) → 알림 → 허용으로 바꾼 뒤 다시 누르세요.');
  const reg = await navigator.serviceWorker.register('/sw.js');
  await navigator.serviceWorker.ready;
  const {key} = await api('/api/push/key');
  const raw = Uint8Array.from(atob(key.replace(/-/g, '+').replace(/_/g, '/')), ch => ch.charCodeAt(0));
  let sub = await reg.pushManager.getSubscription();
  if (!sub) {
    try { sub = await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: raw}); }
    catch (e) { throw new Error('브라우저가 알림 등록을 거부했습니다. 시크릿(InPrivate) 창이 아닌 일반 창에서, 크롬이나 엣지로 다시 해 보세요. (' + e.message + ')'); }
  }
  await api('/api/push/subscribe', {method: 'POST', body: sub.toJSON()});
}

async function pushDisable() {
  const sub = await pushSubscription();
  if (sub) { await api('/api/push/unsubscribe', {method: 'POST', body: {endpoint: sub.endpoint}}).catch(() => {}); await sub.unsubscribe(); }
}

const MK = {ship: ['🚢', '입고'], event: ['📅', '일정'], task: ['📋', '마감']};
const WD = ['일', '월', '화', '수', '목', '금', '토'];
const mdw = d => { const x = new Date(d + 'T00:00'); return `${x.getMonth() + 1}/${x.getDate()}(${WD[x.getDay()]})`; };
function candChip(c, attr) {   // 날짜 후보 버튼: 바뀐 일정·이미 등록된 입고예정은 '변경'으로 표시
  const when = `${mdw(c.date)}${c.time ? ' ' + c.time : ''}`;
  const prev = c.prev_date && c.prev_date !== c.date ? ` <s style="opacity:.7">${mdw(c.prev_date)}</s>→` : '';
  if (c.kind === 'ship' && c.ship_id) {
    const same = c.ship_eta === c.date;
    return `<button class="btn sm ${same ? '' : 'primary'}" ${attr} title="${esc(c.context)}">🚢 ${same ? '등록됨' : '입고예정 날짜 변경'}: ${esc(c.ship_item)} ${same ? mdw(c.date) : `<s style="opacity:.7">${mdw(c.ship_eta)}</s>→${when}`}</button>`;
  }
  const what = c.kind === 'ship' && /^(etd|선적|출항)/i.test(c.label || '') ? '출발' : MK[c.kind][1];
  return `<button class="btn sm ${c.kind === 'ship' ? 'primary' : ''}" ${attr} title="${esc(c.context)}">${MK[c.kind][0]} ${c.label ? esc(c.label) + ' ' : ''}${prev}${when} ${what}${c.prev_date ? ' 변경' : ''}</button>`;
}

function useCandidate(m, c, onSaved) {

  const title = c.title || m.subject;
  if (c.kind === 'ship' && c.ship_id) {   // 이미 등록된 입고예정 → 날짜만 바꿔서 열기
    openShipment(c.ship_id, null, {eta: c.date, ...(c.bl_no ? {bl_no: c.bl_no} : {}), onSaved});
  } else if (c.kind === 'ship') {
    const qty = (m.subject + ' ' + c.context).match(/(\d[\d,.]*)\s*(kg|kgs)\b/i);
    openShipment(null, c.date, {item: c.item || m.subject.replace(/\b(shipping|shipment|arrival|notice|advice|도착|안내|입고|선적)\b/gi, '').replace(/\s{2,}/g, ' ').trim().slice(0, 80),
      supplier: c.supplier || m.from_name || '', bl_no: c.bl_no || '', qty: c.qty || (qty ? numVal(qty[1]) : ''), unit: c.unit || 'kg', note: desc, onSaved});
  } else if (c.kind === 'event') {
    openEvent(null, c.date, {title, description: desc, time: c.time, allDay: !c.time, onSaved});
  } else {
    openTaskForm(null, {title, description: desc, due: c.date, onSaved});
  }
}

      const fd = new FormData(); fd.append('file', f); fd.append('password', $('#miPw', bg).value);

async function renderCalendar() {
  const cur = state.calDate;
  const y = cur.getFullYear(), m = cur.getMonth();
  const first = new Date(y, m, 1);
  const start = new Date(y, m, 1 - first.getDay());
  const weeks = Math.ceil((first.getDay() + new Date(y, m + 1, 0).getDate()) / 7);
  const end = new Date(start); end.setDate(start.getDate() + weeks * 7 - 1);
  const data = await api(`/api/events?start=${ymd(start)}&end=${ymd(end)}`);

  const byDay = {};
  const push = (k, item) => (byDay[k] ||= []).push(item);
  for (const e of data.events) {
    const s = new Date(e.start.slice(0, 10) + 'T00:00'), en = new Date(e.end.slice(0, 10) + 'T00:00');
    for (let d = new Date(Math.max(s, start)); d <= en && d <= end; d.setDate(d.getDate() + 1)) push(ymd(d), {type: 'ev', e});
  }
  for (const t of data.tasks) push(t.due_date, {type: 'task', t});
  for (const sh of data.shipments || []) push(sh.eta, {type: 'ship', sh});

  const today = todayStr();
  let cells = ['일', '월', '화', '수', '목', '금', '토'].map(d => `<div class="dow">${d}</div>`).join('');
  for (let i = 0; i < weeks * 7; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const k = ymd(d), items = byDay[k] || [];
    const max = window.innerWidth < 860 ? 2 : 4;
    const cls = ['day', d.getMonth() !== m && 'other', k === today && 'today', d.getDay() === 0 && 'sun', d.getDay() === 6 && 'sat'].filter(Boolean).join(' ');
    cells += `<div class="${cls}" data-day="${k}"><span class="dnum">${d.getDate()}</span>
      ${items.slice(0, max).map(it => it.type === 'ship'
        ? `<div class="ev ship ${it.sh.status === 'arrived' ? 'done' : ''}" data-ship="${it.sh.id}" title="${esc(it.sh.item)} ${esc(it.sh.supplier)}">🚢 ${esc(it.sh.item)}</div>`
        : it.type === 'ev'
        ? `<div class="ev" data-ev="${it.e.id}" style="background:${esc(it.e.color)}" title="${esc(it.e.title)}">${it.e.all_day ? '' : esc(it.e.start.slice(11, 16)) + ' '}${esc(it.e.title)}</div>`
        : `<div class="ev task ${it.t.status === 'done' ? 'done' : ''}" data-task="${it.t.id}" title="${esc(it.t.title)} (${esc(it.t.assignee_name)})">☑ ${esc(it.t.title)}</div>`).join('')}
      ${items.length > max ? `<div class="more">+${items.length - max}개 더보기</div>` : ''}</div>`;
  }

  $('#main').innerHTML = `<div class="card">
    <div class="cal-head">
      <button class="btn sm" id="cPrev">◀</button><h2>${y}년 ${m + 1}월</h2><button class="btn sm" id="cNext">▶</button>
      <button class="btn sm" id="cToday">오늘</button><span class="spacer"></span>
      <button class="btn primary" id="cNew">+ 일정 등록</button>
    </div>
    <div class="cal">${cells}</div>
    <div class="legend"><span>■ 색상 블록: 일정</span><span>☑ 점선: 업무 마감일 (내가 받은/지시한 업무)</span><span>🚢 입고 예정일</span><span>날짜를 누르면 해당 날짜의 일정을 보고 등록할 수 있습니다.</span></div>
  </div>`;
  $('#cPrev').onclick = () => { state.calDate = new Date(y, m - 1, 1); renderCalendar(); };
  $('#cNext').onclick = () => { state.calDate = new Date(y, m + 1, 1); renderCalendar(); };
  $('#cToday').onclick = () => { state.calDate = new Date(); renderCalendar(); };
  $('#cNew').onclick = () => openEvent(null, today);
  $$('.day').forEach(el => el.onclick = e => {
    const evEl = e.target.closest('[data-ev]'), tEl = e.target.closest('[data-task]'), shEl = e.target.closest('[data-ship]');
    if (shEl) return openShipment(+shEl.dataset.ship);
    if (evEl) return openEvent(data.events.find(x => x.id == evEl.dataset.ev));
    if (tEl) return openTask(+tEl.dataset.task);
    openDay(el.dataset.day, byDay[el.dataset.day] || []);
  });
}

function openDay(day, items) {
  openModal(`<h2>${esc(day)}</h2>
    ${items.length ? items.map(it => it.type === 'ship'
      ? `<div class="list-item" data-ship="${it.sh.id}">🚢 <div style="flex:1"><b>${esc(it.sh.item)}</b><br><small class="muted">입고 예정 · ${esc(it.sh.supplier)} · ${fmtQty(it.sh.qty)} ${esc(it.sh.unit)}</small></div>${shTag(it.sh.status)}</div>`
      : it.type === 'ev'
      ? `<div class="list-item" data-ev="${it.e.id}"><span class="dot" style="background:${esc(it.e.color)}"></span>
           <div style="flex:1"><b>${esc(it.e.title)}</b><br><small class="muted">${it.e.all_day ? '종일' : esc(fmtDT(it.e.start)) + ' ~ ' + esc(fmtDT(it.e.end))} · ${esc(it.e.creator_name)}</small></div></div>`
      : `<div class="list-item" data-task="${it.t.id}">☑ <div style="flex:1"><b>${esc(it.t.title)}</b><br><small class="muted">업무 마감 · 담당 ${esc(it.t.assignee_name)}</small></div>${sTag(it.t.status)}</div>`).join('')
      : '<div class="empty">등록된 일정이 없습니다.</div>'}
    <div class="actions"><button class="btn" data-close>닫기</button><button class="btn primary" id="dayNew">+ 이 날짜에 일정 등록</button></div>`,
    (bg, close) => {
      $('#dayNew', bg).onclick = () => { close(); openEvent(null, day); };
      $$('[data-ev]', bg).forEach(el => el.onclick = () => { close(); openEvent(items.find(i => i.type === 'ev' && i.e.id == el.dataset.ev).e); });
      $$('[data-task]', bg).forEach(el => el.onclick = () => { close(); openTask(+el.dataset.task); });
      $$('[data-ship]', bg).forEach(el => el.onclick = () => { close(); openShipment(+el.dataset.ship); });
    });
}

function openEvent(ev, day, pre = {}) {
  const canEdit = !ev || ev.created_by === state.me.id || state.me.role === 'admin';
  const isAll = ev ? !!ev.all_day : !!pre.allDay;
  const sd = ev ? ev.start.slice(0, 10) : day, ed = ev ? ev.end.slice(0, 10) : day;
  const st = ev && !ev.all_day ? ev.start.slice(11, 16) : (pre.time || '09:00'),
        et = ev && !ev.all_day ? ev.end.slice(11, 16) : (pre.time ? `${pad(Math.min(23, +pre.time.slice(0, 2) + 1))}:${pre.time.slice(3, 5)}` : '10:00');
  const color = ev ? ev.color : COLORS[0];
  const dis = canEdit ? '' : 'disabled';
  openModal(`<h2>${ev ? (canEdit ? '일정 수정' : '일정 보기') : '새 일정'}</h2>
    ${ev ? `<div class="muted">작성자: ${esc(ev.creator_name)} · ${SCOPE[ev.scope]}</div>` : ''}
    <form id="evForm">
      <label>제목</label><input name="title" value="${esc(ev ? ev.title : pre.title)}" required ${dis}>
      <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" name="all_day" style="width:auto" ${isAll ? 'checked' : ''} ${dis}> 종일</label>
      <div class="grid2">
        <div><label>시작일</label><input type="date" name="sd" value="${sd}" required ${dis}></div>
        <div class="tm"><label>시작 시간</label><input type="time" name="st" value="${st}" ${dis}></div>
        <div><label>종료일</label><input type="date" name="ed" value="${ed}" required ${dis}></div>
        <div class="tm"><label>종료 시간</label><input type="time" name="et" value="${et}" ${dis}></div>
      </div>
      <label>공개 범위</label>
      <select name="scope" ${dis}>${Object.entries(SCOPE).map(([k, v]) => `<option value="${k}" ${(ev?.scope || 'company') === k ? 'selected' : ''}>${v}${k === 'dept' ? ` (${esc(ev ? ev.dept : state.me.dept) || '부서 없음'})` : ''}</option>`).join('')}</select>
      <label>색상</label>
      <div class="colors">${COLORS.map(c => `<label style="margin:0"><input type="radio" name="color" value="${c}" ${c === color ? 'checked' : ''} ${dis}><span style="background:${c}"></span></label>`).join('')}</div>
      <label>메모</label><textarea name="description" ${dis}>${esc(ev ? ev.description : pre.description)}</textarea>
      <div class="err"></div>
      <div class="actions">
        ${ev && canEdit ? '<button type="button" class="btn danger" id="evDel">삭제</button><span class="spacer"></span>' : ''}
        <button type="button" class="btn" data-close>${canEdit ? '취소' : '닫기'}</button>
        ${canEdit ? '<button class="btn primary">저장</button>' : ''}
      </div>
    </form>`, (bg, close) => {
    const f = $('form', bg);
    const syncTm = () => $$('.tm', bg).forEach(el => el.style.visibility = f.all_day.checked ? 'hidden' : 'visible');
    f.all_day.onchange = syncTm; syncTm();
    f.onsubmit = async e => {
      e.preventDefault();
      const allDay = f.all_day.checked;
      const body = {
        title: f.title.value, description: f.description.value, all_day: allDay, scope: f.scope.value,
        color: f.color.value,
        start: allDay ? f.sd.value : `${f.sd.value}T${f.st.value || '00:00'}`,
        end: allDay ? f.ed.value : `${f.ed.value}T${f.et.value || '23:59'}`,
      };
      try {
        await api(ev ? `/api/events/${ev.id}` : '/api/events', {method: ev ? 'PUT' : 'POST', body});
        close(); toast('저장되었습니다.'); if (pre.onSaved) await pre.onSaved(); go(state.view);
      } catch (err) { $('.err', bg).textContent = err.message; }
    };
    const del = $('#evDel', bg);
    if (del) del.onclick = async () => {
      if (!confirm('이 일정을 삭제할까요?')) return;
      await api(`/api/events/${ev.id}`, {method: 'DELETE'});
      close(); toast('삭제되었습니다.'); go(state.view);
    };
  });
}

    <div class="tabs">

    </div>
    ${tasks.length ? `<div class="mlist">${tasks.map(t => `<div class="mrow" data-task="${t.id}" data-search="${esc((t.title + ' ' + t.assigner_name + ' ' + t.assignee_name).toLowerCase())}">
        <div class="l1">${pTag(t.priority)}<b>${esc(t.title)}</b>${sTag(t.status)}</div>
        <div class="l2">${showAssigner ? `지시 ${esc(t.assigner_name)}` : ''}${showAssigner && showAssignee ? ' · ' : ''}${showAssignee ? `담당 ${esc(t.assignee_name)}` : ''} · 마감 ${dueHtml(t)}${t.comment_count ? ` · 💬${t.comment_count}` : ''}</div></div>`).join('')}</div>
      <table class="dtable"><thead><tr>
        <th>우선순위</th><th>제목</th>${showAssigner ? '<th class="hide-m">지시자</th>' : ''}${showAssignee ? '<th class="hide-m">담당자</th>' : ''}
        <th>마감일</th><th>상태</th></tr></thead><tbody>
      ${tasks.map(t => `<tr data-task="${t.id}" data-search="${esc((t.title + ' ' + t.assigner_name + ' ' + t.assignee_name).toLowerCase())}">
        <td>${pTag(t.priority)}</td>
        <td class="title">${esc(t.title)}${t.comment_count ? ` <small class="muted">💬${t.comment_count}</small>` : ''}</td>
        ${showAssigner ? `<td class="hide-m">${esc(t.assigner_name)}</td>` : ''}
        ${showAssignee ? `<td class="hide-m">${esc(t.assignee_name)} <small class="muted">${esc(t.assignee_dept)}</small></td>` : ''}
        <td>${dueHtml(t)}</td><td>${sTag(t.status)}</td></tr>`).join('')}
      </tbody></table>` : '<div class="empty">해당하는 업무가 없습니다.</div>'}
  </div>`;
  $$('.tabs button').forEach(b => {
    b.classList.toggle('active', b.dataset.box === state.taskBox);
    b.onclick = () => { state.taskBox = b.dataset.box; renderTasks(); };
  });

  $('#tSearch').oninput = e => {

    $$('tbody tr, .mrow').forEach(tr => tr.classList.toggle('hidden', !tr.dataset.search.includes(v)));

function assigneePicker(selected = []) {
  const groups = {};
  state.users.filter(u => u.active).forEach(u => (groups[u.dept || '부서 미지정'] ||= []).push(u));
  return `<div class="row" style="margin-bottom:6px;flex-wrap:nowrap"><input id="aFilter" placeholder="이름/부서 검색">
      <button type="button" class="btn sm" id="aAll">전 직원 선택</button><span class="muted" id="aCount" style="white-space:nowrap">0명 선택</span></div>
    <div class="assignee-box">` +
    Object.entries(groups).map(([dept, us]) => `<div class="dept-grp"><div class="dept-head">${esc(dept)} <span style="font-weight:400">(${us.length})</span>
        <a href="#" data-alldept style="font-weight:400;margin-left:6px">부서 전체선택</a></div>
      <div class="people">${us.map(u => `<label data-s="${esc((u.name + ' ' + u.dept).toLowerCase())}" title="${esc(u.name + ' ' + u.position)}"><input type="checkbox" name="assignee" value="${u.id}" ${selected.includes(u.id) ? 'checked' : ''}>
        ${esc(u.name)} <small class="muted">${esc(u.position)}${u.id === state.me.id ? ' (나)' : ''}</small></label>`).join('')}</div></div>`).join('') + '</div>';
}

function openTaskForm(task, pre = {}) {
  const edit = !!task;
  openModal(`<h2>${edit ? '업무 수정' : '새 업무 지시'}</h2>
    <form>
      <label>업무 제목</label><input name="title" value="${esc(task ? task.title : pre.title)}" required>
      <label>업무 내용</label><textarea name="description" placeholder="구체적인 지시 사항, 산출물, 참고 자료 등">${esc(task ? task.description : pre.description)}</textarea>
      <div class="grid2">
        <div><label>우선순위</label><select name="priority">${Object.entries(PRIORITY).map(([k, v]) => `<option value="${k}" ${(task?.priority || 'normal') === k ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
        <div><label>마감일</label><input type="date" name="due" value="${esc(task?.due_date || pre.due || '')}"></div>
      </div>
      ${edit ? '' : `<label>담당자 (여러 명 선택 시 각자에게 개별 업무로 지시됩니다)</label>${assigneePicker()}`}
      <div class="err"></div>
      <div class="actions"><button type="button" class="btn" data-close>취소</button><button class="btn primary">${edit ? '저장' : '지시하기'}</button></div>
    </form>`, (bg, close) => {
    const f = $('form', bg);
    const filter = $('#aFilter', bg);
    if (filter) filter.oninput = () => {
      const v = filter.value.toLowerCase();
      $$('.assignee-box label', bg).forEach(l => l.classList.toggle('hidden', !l.dataset.s.includes(v)));
    };
    const countSel = () => { const n = $$('input[name=assignee]:checked', bg).length; if ($('#aCount', bg)) $('#aCount', bg).textContent = `${n}명 선택`; };
    $$('[data-alldept]', bg).forEach(a => a.onclick = e => {
      e.preventDefault();
      const boxes = $$('input', a.closest('.dept-grp'));
      const on = boxes.some(b => !b.checked);
      boxes.forEach(b => b.checked = on);
      countSel();
    });
    const allBtn = $('#aAll', bg);
    if (allBtn) allBtn.onclick = () => {
      const boxes = $$('input[name=assignee]', bg);
      const on = boxes.some(b => !b.checked);
      boxes.forEach(b => b.checked = on);
      allBtn.textContent = on ? '전체 해제' : '전 직원 선택';
      countSel();
    };
    bg.addEventListener('change', e => { if (e.target.name === 'assignee') countSel(); });
    countSel();
    f.onsubmit = async e => {
      e.preventDefault();
      try {
        if (edit) {
          await api(`/api/tasks/${task.id}`, {method: 'PATCH', body: {title: f.title.value, description: f.description.value, priority: f.priority.value, due_date: f.due.value}});
          close(); toast('수정되었습니다.'); openTask(task.id);
        } else {
          const ids = $$('input[name=assignee]:checked', bg).map(i => +i.value);
          if (!ids.length) { $('.err', bg).textContent = '담당자를 선택하세요.'; return; }
          await api('/api/tasks', {method: 'POST', body: {title: f.title.value, description: f.description.value, priority: f.priority.value, due_date: f.due.value || null, assignee_ids: ids}});
          close(); toast(`${ids.length}명에게 업무를 지시했습니다.`);
          if (pre.onSaved) await pre.onSaved();
        }
        go(state.view);
      } catch (err) { $('.err', bg).textContent = err.message; }
    };
  });
}

const VAT = {separate: '부가세 별도', included: '부가세 포함', none: '면세/영세'};
const TSTATUS = {draft: '작성중', sent: '발행', won: '출고완료'};
const DOC = {
  quote: {label: '견적서', icon: '🧾', no: '견적번호', date: '견적일', status: QSTATUS},
  statement: {label: '거래명세서', icon: '📄', no: '명세서번호', date: '거래일자', status: TSTATUS},
};
const qTag = (s, type = 'quote') => `<span class="tag q-${s}">${DOC[type].status[s] || QSTATUS[s]}</span>`;
const won = n => Math.round(Number(n) || 0).toLocaleString('ko-KR');
const numVal = v => Number(String(v).replace(/,/g, '')) || 0;

function koreanAmount(n) {
  n = Math.round(n);
  if (!n) return '영';
  const d = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'], u = ['', '십', '백', '천'], big = ['', '만', '억', '조'];
  let out = '', i = 0;
  while (n > 0) {
    const chunk = n % 10000;
    if (chunk) {
      let c = '', x = chunk;
      for (let j = 0; j < 4 && x > 0; j++, x = Math.floor(x / 10)) if (x % 10) c = d[x % 10] + u[j] + c;
      out = c + big[i] + out;
    }
    n = Math.floor(n / 10000); i++;
  }
  return out;
}

function calcLine(qty, price, mode) {
  const amount = Math.round(qty * price);
  if (mode === 'separate') return [amount, Math.floor(amount * 0.1)];
  if (mode === 'included') { const sup = Math.round(amount / 1.1); return [sup, amount - sup]; }
  return [amount, 0];
}

      <div class="qscroll"><table class="qitems"><thead><tr>${isSt ? '' : '<th>Cas no.</th>'}<th>품명</th><th>규격</th><th>단위</th><th>수량</th><th>단가</th>${isSt ? '' : '<th>Origin</th>'}<th style="text-align:right">공급가액</th><th style="text-align:right">세액</th>${isSt ? '<th class="hide-m">비고</th>' : ''}<th></th></tr></thead>
        <tbody>${(q.items.length ? q.items : [{}]).map(row).join('')}</tbody></table></div>
      <button type="button" class="btn sm" id="qAdd" style="margin-top:6px">+ 행 추가</button>
      <div class="qtotal"><span>공급가액 <b id="tSup">0</b></span><span>세액 <b id="tVat">0</b></span><span>합계 <b id="tSum" style="color:var(--primary)">0</b>원</span></div>
      <label>${isSt ? '비고 / 특이사항' : '기타사항 (출력 시 NOTE 의 기타사항)'}</label><textarea name="note" style="min-height:60px">${esc(q.note)}</textarea>
      <datalist id="custList">${sug.customers.map(c => `<option value="${esc(c.customer_name)}">`).join('')}</datalist>
      <datalist id="itemList">${sug.items.map(i => `<option value="${esc(i.name)}">${esc([i.spec, won(i.unit_price) + '원'].filter(Boolean).join(' / '))}</option>`).join('')}</datalist>
      ${linkedTask ? `<label style="display:flex;gap:6px;align-items:center;font-weight:400"><input type="checkbox" name="complete_task" style="width:auto" ${quote ? '' : 'checked'}> 저장하면서 연결된 업무를 <b>완료</b> 처리 (지시자에게 알림·메일)</label>` : ''}
      <div class="err"></div>
      <div class="actions"><button type="button" class="btn" data-close>취소</button><button type="button" class="btn" id="qSavePrint">저장 후 인쇄</button><button class="btn primary">저장</button></div>
    </form>`, (bg, close) => {
    bg.firstElementChild.classList.add('wide');
    const f = $('form', bg), tbody = $('.qitems tbody', bg);
    const recalc = () => {
      let ts = 0, tv = 0;
      $$('tr', tbody).forEach(tr => {
        const [sup, vat] = calcLine(numVal($('[name=qty]', tr).value), numVal($('[name=price]', tr).value), f.vat_mode.value);
        $('.sup', tr).textContent = won(sup); $('.vat', tr).textContent = won(vat); ts += sup; tv += vat;
      });
      $('#tSup', bg).textContent = won(ts); $('#tVat', bg).textContent = won(tv); $('#tSum', bg).textContent = won(ts + tv);
    };
    tbody.addEventListener('input', e => {
      if (e.target.name === 'name') {
        const hit = sug.items.find(i => i.name === e.target.value);
        const tr = e.target.closest('tr');
        if (hit) {
          if (!$('[name=spec]', tr).value) $('[name=spec]', tr).value = hit.spec;
          if (!$('[name=unit]', tr).value) $('[name=unit]', tr).value = hit.unit;
          if (!$('[name=price]', tr).value) $('[name=price]', tr).value = won(hit.unit_price);
          if (!$('[name=qty]', tr).value) $('[name=qty]', tr).value = 1;
          const cas = $('[name=cas_no]', tr), org = $('[name=origin]', tr);
          if (cas && !cas.value && hit.cas_no) cas.value = hit.cas_no;
          if (org && !org.value && hit.origin) org.value = hit.origin;
        }
      }
      recalc();
    });
    tbody.addEventListener('focusout', e => { if (e.target.name === 'price' && e.target.value) e.target.value = won(numVal(e.target.value)); });
    tbody.addEventListener('click', e => { if (e.target.closest('[data-del]')) { e.target.closest('tr').remove(); if (!$('tr', tbody)) tbody.insertAdjacentHTML('beforeend', row()); recalc(); } });
    $('#qAdd', bg).onclick = () => { tbody.insertAdjacentHTML('beforeend', row()); recalc(); };
    f.vat_mode.onchange = recalc;
    f.customer_name.onchange = () => {
      const c = sug.customers.find(x => x.customer_name === f.customer_name.value);
      if (c) ['customer_contact', 'customer_phone', 'customer_email', 'customer_biz_no', 'customer_ceo', 'customer_address', 'customer_fax'].forEach(k => { if (f[k] && !f[k].value) f[k].value = c[k] || ''; });
    };
    if (useEc) {
      tbody.addEventListener('focusin', e => {
        if (e.target.name !== 'name' || e.target.dataset.sb) return;
        e.target.dataset.sb = 1;
        attachSearch(e.target, v => searchList(ec.products, v, p => [p.code, p.name, p.spec]), p =>
          `<b>${esc(p.name)}</b> <small>${esc(p.spec)}</small><br><small>${esc(p.code)}${p.unit ? ' · ' + esc(p.unit) : ''}${p.price ? ' · ' + won(p.price) + '원' : ''}</small>`,
          p => {
            const tr = e.target.closest('tr');
            e.target.value = p.name; $('[name=prod_cd]', tr).value = p.code; $('.pc', tr).innerHTML = prodCode(p.code);
            $('[name=spec]', tr).value = p.spec; if (p.unit) $('[name=unit]', tr).value = p.unit;
            if (p.price && !numVal($('[name=price]', tr).value)) $('[name=price]', tr).value = won(p.price);
            if (!$('[name=qty]', tr).value) $('[name=qty]', tr).value = 1;
            recalc(); $('[name=qty]', tr).focus(); $('[name=qty]', tr).select();
          });
        e.target.dispatchEvent(new Event('focus'));
      });
    }
    tbody.addEventListener('click', e => {
      if (!e.target.closest('[data-unlink]')) return;
      const tr = e.target.closest('tr'); $('[name=prod_cd]', tr).value = ''; $('.pc', tr).innerHTML = prodCode('');
    });
    if (ec.customers.length) {
      const pickCust = c => {
        f.customer_name.value = c.name; f.cust_cd.value = c.code; f.customer_name.dispatchEvent(new Event('change'));
        if (f.customer_address && !f.customer_address.value && c.memo) f.customer_address.value = c.memo;
        drawCustChip();
      };
      const custHtml = c => `<b>${esc(c.name)}</b> <small>${esc(c.code)}</small>${c.memo ? `<br><small>${esc(c.memo)}</small>` : ''}`;
      attachSearch(f.customer_name, v => searchList(ec.customers, v, c => [c.code, c.name, c.memo]), custHtml, pickCust);
      // 직접 입력한 이름이 이카운트 거래처 하나와 정확히 같으면 자동 연결
      f.customer_name.addEventListener('blur', () => setTimeout(() => {
        if (f.cust_cd.value) return;
        const hits = ec.customers.filter(c => normText(c.name) === normText(f.customer_name.value));
        if (hits.length === 1) { f.cust_cd.value = hits[0].code; drawCustChip(); }
      }, 200));
    }
    function drawCustChip() {
      const box = $('#custChip', bg); if (!box) return;
      const c = ec.customers.find(x => x.code === f.cust_cd.value);
      box.innerHTML = f.cust_cd.value
        ? `<span class="code">이카운트: ${esc(c ? c.name : '')} ${esc(f.cust_cd.value)}<button type="button" id="custUnlink" title="연결 해제">✕</button></span>`
        : '<span class="code miss">이카운트 거래처 미지정 — 이름 일부(예: 삼성 2공장)로 검색해서 선택하세요</span>';
      const u = $('#custUnlink', bg); if (u) u.onclick = () => { f.cust_cd.value = ''; drawCustChip(); f.customer_name.focus(); };
    }
    drawCustChip();
    recalc();
    const save = async (andPrint) => {
      $('.err', bg).textContent = '';
      if (!f.reportValidity()) return;
      const items = $$('tr', tbody).map(tr => ({prod_cd: $('[name=prod_cd]', tr).value, cas_no: $('[name=cas_no]', tr)?.value || '', origin: $('[name=origin]', tr)?.value || '', name: $('[name=name]', tr).value, spec: $('[name=spec]', tr).value, unit: $('[name=unit]', tr).value,
        qty: numVal($('[name=qty]', tr).value), unit_price: numVal($('[name=price]', tr).value), note: $('[name=inote]', tr).value})).filter(i => i.name.trim());
      const body = {items, doc_type: dt, source_id: quote ? null : (q.source_id || null), task_id: linkedTask ? linkedTask.id : null, complete_task: !!(f.complete_task && f.complete_task.checked)};
      ['customer_name', 'cust_cd', 'title', 'customer_contact', 'customer_phone', 'customer_email', 'customer_biz_no', 'customer_ceo', 'customer_address', 'customer_fax', 'transport',
       'quote_date', 'valid_until', 'delivery', 'payment_terms', 'vat_mode', 'status', 'note'].forEach(k => body[k] = f[k] ? f[k].value : (q[k] || ''));
      try {
        const r = await api(quote ? `/api/quotes/${quote.id}` : '/api/quotes', {method: quote ? 'PUT' : 'POST', body});
        close(); toast(`${D.label} ${r.quote_no} 저장됨`);
        if (andPrint) printQuote(r.id);
        go(state.view);
        if (quote && r.ecount && (r.ecount.quotation || r.ecount.sale)) promptResend(r.id, r.ecount);
      } catch (err) { $('.err', bg).textContent = err.message; }
    };
    f.onsubmit = e => { e.preventDefault(); save(false); };
    $('#qSavePrint', bg).onclick = () => save(true);
  });
}

      ${q.items.map(i => `<tr style="cursor:default"><td>${esc(i.name)}</td><td>${esc(i.spec)}</td><td class="money">${i.qty.toLocaleString('ko-KR')} ${esc(i.unit)}</td><td class="money">${won(i.unit_price)}</td><td class="money">${won(i.supply)}</td><td class="money">${won(i.vat)}</td></tr>`).join('')}
    </tbody></table></div>

    <dl class="detail-meta">
      <dt>담당자</dt><dd>${esc(q.customer_contact || '-')} ${esc(q.customer_phone)} ${esc(q.customer_email)}</dd>

    </dl>
    ${q.note ? `<div class="desc">${esc(q.note)}</div>` : ''}
    ${ecEnabled ? `<div class="ec-box"><div class="row"><b>🔗 이카운트</b><span class="muted">거래처 ${q.cust_cd ? esc((ec.customers.find(c => c.code === q.cust_cd) || {}).name || '') + ' ' + esc(q.cust_cd) : '<span class="code miss">미지정</span>'} · 품목 ${q.items.filter(i => i.prod_cd).length}/${q.items.length}개 연결</span></div>
      <div class="row" style="margin-top:8px">
        ${q.ecount_quote_slip ? `<span class="tag s-done">견적서 전송됨 ${esc(q.ecount_quote_slip)}</span>` : ''}
        ${q.ecount_sale_slip ? `<span class="tag s-done">판매 전송됨 ${esc(q.ecount_sale_slip)}</span>` : ''}
        ${q.ecount_old_slips ? `<span class="tag p-urgent" title="이카운트에서 삭제해야 할 예전 전표">삭제할 예전 전표: ${esc(q.ecount_old_slips)}</span>` : ''}
        ${canEdit ? `${isSt ? '' : `<button class="btn sm" id="ecQ">${q.ecount_quote_slip ? '견적서 다시 등록' : '견적서로 전송'}</button>`}<button class="btn sm primary" id="ecS">${q.ecount_sale_slip ? '판매 다시 등록' : isSt ? '이카운트 판매로 전송' : '판매로 전송'}</button>` : ''}

async function printQuote(id) {
  const w = window.open('', '_blank');
  if (w) w.document.write('<p style="font-family:sans-serif">불러오는 중…</p>');
  const peek = await api(`/api/quotes/${id}`);
  if (peek.doc_type === 'statement') return printStatement(w, peek);
  if (!w) { toast('팝업이 차단되었습니다. 브라우저에서 팝업을 허용해 주세요.'); return; }
  const q = peek, co = await api('/api/company');
  // 이카운트 견적서 양식: 일자/수신/참조/TEL·FAX/유효기간 + 공급자정보, Cas no.·품목명·수량·단가·Origin, 총합계, NOTE
  const units = [...new Set(q.items.map(i => (i.unit || '').trim()).filter(Boolean))];
  const unit = units.length === 1 ? units[0] : '';
  const qtyFmt = n => Number(n || 0).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
  const [y, mo, d] = (q.quote_date || '').split('-');
  const rows = q.items.map(i => `<tr><td class="c">${esc(i.cas_no || '')}</td>
      <td>${esc(i.name)}${i.spec ? ' ' + esc(i.spec) : ''}${!unit && i.unit ? ` <small>(${esc(i.unit)})</small>` : ''}</td>
      <td class="r">${qtyFmt(i.qty)}</td><td class="r">${won(i.unit_price)}</td><td class="c">${esc(i.origin || '')}</td></tr>`);
  const blanks = Math.max(0, 14 - q.items.length);
  const vatLine = {separate: 'VAT별도', included: 'VAT포함', none: 'VAT면세(영세)'}[q.vat_mode] || 'VAT별도';
  const etc = [q.note, q.payment_terms ? '결제조건: ' + q.payment_terms : ''].filter(Boolean).join(' / ');
  w.document.open();
  w.document.write(`<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>견적서 ${esc(q.quote_no)} - ${esc(q.customer_name)}</title>
  <style>
    @page{size:A4;margin:10mm 14mm}
    body{font-family:Arial,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:#111;font-size:12px;margin:0;padding:16px}
    .sheet{max-width:745px;margin:0 auto;padding:0 2px;box-sizing:border-box}
    h1{text-align:center;font-size:28px;letter-spacing:14px;margin:0 0 24px;text-decoration:underline;text-underline-offset:6px}
    .top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
    .info{width:44%;border-collapse:collapse}
    .info th{text-align:left;width:76px;font-weight:bold;padding:7px 2px;border-bottom:1px solid #ddd;white-space:nowrap}
    .info td{padding:7px 2px;border-bottom:1px solid #ddd}
    .sup{width:56%;border-collapse:collapse;border:1px solid #111}
    .sup caption{border:1px solid #111;border-bottom:0;padding:9px;font-weight:bold;caption-side:top}
    .sup th{width:84px;text-align:center;font-weight:bold;padding:5px 4px;border-right:1px solid #ddd;white-space:nowrap}
    .sup td{padding:5px 6px;line-height:1.3}
    .sp{letter-spacing:12px}
    .rule{border-top:2px solid #bbb;margin:34px 0 6px}
    table.items{width:100%;border-collapse:collapse}
    .items th,.items td{border:1px solid #999;padding:3px 5px;height:24px}
    .items th{background:#f2f2f2;font-weight:normal}
    .items td{font-size:11.5px}
    .items .sum td{background:#f2f2f2;font-size:13px}
    .c{text-align:center}.r{text-align:right;font-variant-numeric:tabular-nums}
    .note{border:1.5px solid #111;margin-top:6px;padding:6px 8px;min-height:150px;font-size:12px;box-sizing:border-box}
    .note b{font-weight:normal;font-size:13px;letter-spacing:1px}
    .note div{line-height:1.45}
    .noprint{text-align:center;margin:16px}
    @media print{.noprint{display:none}body{padding:0}}
  </style></head><body><div class="sheet">
  <h1>견 적 서</h1>
  <div class="top">
    <table class="info">
      <tr><th><span class="sp">일</span>자</th><td>${y ? `${y}년 ${mo}월 ${d}일` : ''}</td></tr>
      <tr><th><span class="sp">수</span>신</th><td>${esc(q.customer_name)}</td></tr>
      <tr><th><span class="sp">참</span>조</th><td>${esc(q.customer_contact || '')}</td></tr>
      <tr><th>TEL / FAX</th><td>${esc(q.customer_phone || '')} / ${esc(q.customer_fax || '')}</td></tr>
      <tr><th>유효기간</th><td>${esc(q.valid_until || '')}</td></tr>
    </table>
    <table class="sup"><caption>공급자정보</caption>
      <tr><th>사업자등록번호</th><td>${esc(co.biz_no || '')}</td></tr>
      <tr><th><span class="sp">상</span>호</th><td>${esc(co.company_name || '')}</td></tr>
      <tr><th>대표자</th><td>${esc(co.ceo || '')}</td></tr>
      <tr><th>TEL / FAX</th><td>${esc(co.phone || '')} / ${esc(co.fax || '')}</td></tr>
      <tr><th><span class="sp">주</span>소</th><td>${esc(co.address || '')}</td></tr>
    </table>
  </div>
  <div class="rule"></div>
  <table class="items">
    <tr><th style="width:96px">Cas no.</th><th>품목명</th><th style="width:96px">수량${unit ? `(${esc(unit.toUpperCase())})` : ''}</th><th style="width:100px">단가(₩${unit ? '/' + esc(unit) : ''})</th><th style="width:100px">Origin</th></tr>
    ${rows.join('')}
    <tr class="sum"><td colspan="3" class="c">총합계</td><td class="r" id="sumCell"></td><td></td></tr>
    ${'<tr><td></td><td></td><td></td><td></td><td></td></tr>'.repeat(blanks)}
  </table>
  <div class="note"><b>NOTE</b><br><br>
    <div>* ${vatLine}</div>
    <div>* Transportation: ${esc(q.transport || '')}</div>
    <div>* Leadtime: ${esc(q.delivery || '')}</div>
    <div>* 기타사항: ${esc(etc)}</div>
    <div>* 검토 후 조속한 회신 바랍니다.</div>
    ${co.quote_footer ? `<div style="white-space:pre-wrap">${esc(co.quote_footer)}</div>` : ''}
  </div>
  <div class="noprint">
    <label style="font-size:13px"><input type="checkbox" id="showSum"> 총합계에 공급가액 합계(₩ ${won(q.supply_total)}) 표시</label><br><br>
    <button onclick="print()" style="font-size:15px;padding:10px 24px">🖨 인쇄 / PDF로 저장</button>
    <p style="color:#666;font-size:12px">PDF로 받으려면 인쇄 창에서 대상(프린터)을 "PDF로 저장"으로 선택하세요.</p></div>
  </div>
  <script>document.getElementById('showSum').onchange=function(){document.getElementById('sumCell').textContent=this.checked?'${won(q.supply_total)}':''}<\/script>
  </body></html>`);
  w.document.close();
  setTimeout(() => w.print(), 400);
}


// 거래명세서 인쇄: 이카운트 거래명세서 양식과 같은 배치 (A4 상단 1부 + 절취선)
async function printStatement(w, q) {
  if (!w) { toast('팝업이 차단되었습니다. 브라우저에서 팝업을 허용해 주세요.'); return; }
  const co = await api('/api/company');
  const md = d => d ? `${d.slice(5, 7)}/${d.slice(8, 10)}` : '';
  const units = [...new Set(q.items.map(i => (i.unit || '').trim()).filter(Boolean))];
  const unit = units.length === 1 ? units[0] : '';
  const isKg = /^kg$/i.test(unit);
  const qtyFmt = n => isKg ? Number(n).toFixed(2) : Number(n).toLocaleString('ko-KR', {maximumFractionDigits: 2});
  const totalQty = q.items.reduce((a, i) => a + Number(i.qty || 0), 0);
  // 일련번호: 이카운트 판매 전표번호가 있으면 그것, 없으면 명세서번호(T20261002-001 → 20261002 - 1)
  const m = /^T(\d{8})-0*(\d+)$/.exec(q.quote_no || '');
  const serial = q.ecount_sale_slip ? q.ecount_sale_slip.replace(/-/, ' - ') : (m ? `${m[1]} - ${m[2]}` : q.quote_no);
  const pages = [];
  for (let i = 0; i < Math.max(q.items.length, 1); i += 10) pages.push(q.items.slice(i, i + 10));
  const sheet = (items, last) => {
    const rows = items.map(i => `<tr><td class="c">${md(q.quote_date)}</td>
        <td class="nm">${esc(i.name)}${i.spec ? ' ' + esc(i.spec) : ''}${!unit && i.unit ? ` <small>(${esc(i.unit)})</small>` : ''}</td>
        <td class="r">${qtyFmt(i.qty)}</td><td class="r">${won(i.unit_price)}</td><td class="r">${won(i.supply)}</td><td class="r">${won(i.vat)}</td></tr>`);
    while (rows.length < 10) rows.push('<tr><td></td><td></td><td></td><td></td><td></td><td></td></tr>');
    return `<div class="form">
      <div class="top">
        <div class="left">
          <div class="title">거래명세서</div>
          <div class="to">
            <div class="cname">${esc(q.customer_name)}<span class="gwi">貴 中</span></div>
            ${q.customer_address ? `<div>${esc(q.customer_address)}</div>` : ''}
            ${q.customer_phone ? `<div>☎ ${esc(q.customer_phone)}</div>` : ''}
          </div>
        </div>
        <table class="sup">
          <tr><th class="vh" rowspan="4">공<br><br>급<br><br>자</th><th>일련번호</th><td>${esc(serial)}</td><th class="sm">TEL</th><td>${esc(co.phone || '')}</td></tr>
          <tr><th>사업자등록<br>번호</th><td>${esc(co.biz_no || '')}</td><th class="sm">성명</th><td class="stampbox">${esc(co.ceo || '')}${co.stamp ? `<img class="stamp" src="${co.stamp}">` : ''}</td></tr>
          <tr><th>상호</th><td colspan="3">${esc(co.company_name || '')}</td></tr>
          <tr><th>주소</th><td colspan="3" class="addr">${esc(co.address || '')}</td></tr>
        </table>
      </div>
      <div class="amount"><span>금 액 : ${koreanAmount(q.grand_total)}원 정</span><span>(₩ ${won(q.grand_total)})</span></div>
      <table class="items">
        <tr><th style="width:44px">월/일</th><th>품명 및 규격</th><th style="width:84px">수량${unit ? `(${esc(unit)})` : ''}</th><th style="width:80px">단가(원화)</th><th style="width:118px">공급가액</th><th style="width:114px">부가세</th></tr>
        ${rows.join('')}
      </table>
      ${last ? `<table class="sum"><tr><th>수량</th><td>${isKg ? totalQty.toFixed(1) : qtyFmt(totalQty)}</td><th>공급가액</th><td>${won(q.supply_total)}</td><th>VAT</th><td>${won(q.vat_total)}</td><th>합계</th><td>${won(q.grand_total)}</td><th>인수</th><td>인</td></tr></table>
        ${q.note ? `<div class="note">비고: ${esc(q.note)}</div>` : ''}` : '<div class="note">(다음 장에 계속)</div>'}
      <div class="cut"></div>
    </div>`;
  };
  w.document.open();
  w.document.write(`<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>거래명세서 ${esc(q.quote_no)} - ${esc(q.customer_name)}</title>
  <style>
    @page{size:A4;margin:10mm}
    body{font-family:"Malgun Gothic","Apple SD Gothic Neo","Nanum Gothic",sans-serif;color:#111;font-size:12px;margin:0;padding:16px}
    .form{max-width:745px;margin:0 auto;box-sizing:border-box;padding:0 2px}
    .form + .form{page-break-before:always;margin-top:20px}
    table{border-collapse:collapse;width:100%}
    td,th{border:1px solid #888;padding:3px 6px}
    th{background:#f2f2f2;font-weight:bold;text-align:center;white-space:nowrap}
    .top{display:flex;gap:22px;align-items:stretch}
    .left{flex:0 0 46%;display:flex;flex-direction:column;justify-content:space-between}
    .title{font-size:28px;text-align:center;margin:12px 0 10px;letter-spacing:1px}
    .to{border:1px solid #111;text-align:center;padding:4px 6px;line-height:1.6;font-size:12.5px}
    .cname{font-weight:bold}.gwi{margin-left:2px;font-weight:bold}
    .sup{flex:1;min-width:0;border:1.5px solid #111}.sup td{font-size:11.5px}
    .sup th{font-size:12px}.sup th.sm{width:46px}
    .sup .vh{width:20px;line-height:1.2;padding:2px}
    .sup .addr{line-height:1.3}
    .stampbox{position:relative;height:30px}
    .stamp{position:absolute;left:20px;top:50%;transform:translateY(-50%);height:62px;opacity:.85;pointer-events:none}
    .amount{display:flex;justify-content:space-between;border:2.5px solid #111;padding:6px 30px;font-size:17px;font-weight:bold;margin:8px 0 26px}
    .items{table-layout:fixed}.items td{height:22px;font-size:12px;overflow-wrap:anywhere}
    .items .nm{font-size:11.5px;line-height:1.2}
    .c{text-align:center}.r{text-align:right;font-variant-numeric:tabular-nums}
    .sum{margin-top:6px;border:1.5px solid #111}.sum th{width:52px}.sum td{text-align:right;font-variant-numeric:tabular-nums}
    .note{font-size:11px;margin-top:4px;color:#333;white-space:pre-wrap}
    .cut{border-top:1px dashed #888;margin-top:14px}
    .noprint{text-align:center;margin:18px}
    @media print{.noprint{display:none}body{padding:0}}
  </style></head><body>
  ${pages.map((items, i) => sheet(items, i === pages.length - 1)).join('')}
  <div class="noprint"><button onclick="print()" style="font-size:15px;padding:10px 24px">🖨 인쇄 / PDF로 저장</button>
    <p style="color:#666;font-size:12px">PDF로 받으려면 인쇄 창에서 대상(프린터)을 "PDF로 저장"으로 선택하세요.</p></div>
  </body></html>`);
  w.document.close();
  setTimeout(() => w.print(), 400);
}

function openStatementImport(dt = 'statement') {
  const isSt = dt === 'statement', D = DOC[dt];
  openModal(`<h2>📥 이카운트 ${isSt ? '거래명세서(판매)' : '견적서'} 가져오기</h2>
    <div class="desc" style="font-size:13px">이카운트는 지난 ${isSt ? '판매' : '견적서'}를 조회하는 API를 제공하지 않아, <b>엑셀 파일</b>로 가져옵니다.<br>
      1. 이카운트 → 영업관리 → <b>${isSt ? '판매조회</b> (또는 판매현황)' : '견적서조회</b>'} 화면에서 <b>기간을 1년 단위</b>로 정해 조회 (예: 2026/01/01 ~ 2026/12/31)<br>
      2. 화면의 <b>[Excel]</b> 버튼으로 내려받기 (거래처명·일자-No.·품목·수량·단가·공급가액·부가세 열이 보이게)<br>
      3. 아래에 그 파일을 올리면 미리보기 후 가져옵니다. 이미 가져온 전표(같은 일자-No.)는 건너뜁니다. 여러 해는 해마다 따로 올리세요.</div>
    <div class="row" style="margin-bottom:8px"><label style="margin:0">연도</label>
      <select id="impYear" style="width:auto"><option value="">자동 (엑셀 조회기간 기준)</option>
        ${Array.from({length: 12}, (_, i) => new Date().getFullYear() - i).map(y => `<option value="${y}">${y}년으로 지정</option>`).join('')}</select>
      <span class="muted" style="font-size:12px">엑셀 날짜에 연도가 없으면(예: 11/16-1) 이 연도로 넣습니다</span></div>
    <input type="file" id="impFile" accept=".xlsx,.csv">
    <label style="display:flex;gap:6px;align-items:center;font-weight:400"><input type="checkbox" id="impOver" style="width:auto"> 이미 가져온 문서도 이 파일 내용으로 덮어쓰기 (금액이 잘못 들어간 경우)</label>
    <div id="impRes" style="margin-top:12px"></div>
    <div class="err" id="impErr"></div>
    <div class="actions"><button class="btn danger" id="impClear">가져온 ${D.label} 모두 지우기</button><span class="spacer"></span><button class="btn" data-close>닫기</button><button class="btn primary hidden" id="impGo">가져오기</button></div>`, (bg, close) => {
    bg.firstElementChild.classList.add('wide');
    const send = async (dry) => {
      const file = $('#impFile', bg).files[0]; if (!file) return;
      const fd = new FormData(); fd.append('file', file);
      const yr = $('#impYear', bg).value;
      const res = await fetch(`/api/docs/import?doc_type=${dt}&dry_run=${dry}&overwrite=${$('#impOver', bg).checked}${yr ? '&year=' + yr : ''}`, {method: 'POST', headers: {Authorization: 'Bearer ' + state.token}, body: fd});
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || '가져오기 실패');
      return data;
    };
    $('#impOver', bg).onchange = $('#impYear', bg).onchange = () => $('#impFile', bg).dispatchEvent(new Event('change'));
    $('#impClear', bg).onclick = async () => {
      if (!confirm(`엑셀로 가져온 ${D.label}를 모두 지울까요? (직접 작성한 ${D.label}와, 가져온 뒤 비고를 고친 것은 지우지 않습니다)`)) return;
      const r = await api(`/api/docs/imported?doc_type=${dt}`, {method: 'DELETE'});
      toast(`${r.deleted}건을 지웠습니다.`); renderQuotes(); $('#impFile', bg).dispatchEvent(new Event('change'));
    };
    $('#impFile', bg).onchange = async () => {
      $('#impErr', bg).textContent = ''; $('#impRes', bg).innerHTML = '<span class="muted">읽는 중…</span>'; $('#impGo', bg).classList.add('hidden');
      try {
        const r = await send(true);
        const over = $('#impOver', bg).checked;
        const fresh = over ? r.slips : r.slips - r.skipped;
        $('#impRes', bg).innerHTML = `${r.period.length ? `<div style="margin-bottom:6px">${r.columns.includes('year_fixed') ? '<span class="tag s-done">연도 고정</span> ' : '<span class="tag s-hold">연도 추정</span> '}기간 <b>${esc(r.period[0])} ~ ${esc(r.period[1])}</b> · 연도별 ${Object.entries(r.years).sort().map(([y, n]) => `<b>${y}년</b> ${n}건`).join(', ')}</div>` : ''}<b>전표 ${r.slips}건 (품목 ${r.lines}줄)</b> 확인 · ${over ? '가져오기/덮어쓰기' : '새로 가져올 것'} <b>${fresh}건</b>${!over && r.skipped ? ` · 이미 있음 ${r.skipped}건` : ''}
          <div class="qscroll"><table style="margin-top:8px"><thead><tr><th>일자</th><th>전표</th><th>거래처</th><th style="text-align:right">품목</th><th style="text-align:right">합계</th><th></th></tr></thead><tbody>
          ${r.preview.map(g => !g ? '<tr style="cursor:default"><td colspan="6" class="muted" style="text-align:center">⋯</td></tr>' : `<tr style="cursor:default"><td>${esc(g.date)}</td><td>${esc(g.slip || '-')}</td><td>${esc(g.customer)}<br><small class="muted">${esc(g.title || '')}</small></td><td class="money">${g.lines}</td><td class="money">${won(g.total)}</td><td>${g.duplicate ? '<span class="tag s-todo">이미 있음</span>' : ''}</td></tr>`).join('')}
          </tbody></table></div>
          ${r.vat_assumed ? '<div class="tag s-hold" style="margin-top:6px">파일에 금액 열이 없어 공급가액 = 수량 × 단가, 부가세 10%로 계산합니다</div>' : ''}
          <div class="muted" style="font-size:12px;margin-top:6px">인식한 열: ${esc(r.columns.join(', '))}</div>`;
        if (fresh > 0) { $('#impGo', bg).classList.remove('hidden'); $('#impGo', bg).textContent = `${fresh}건 가져오기`; }
      } catch (err) { $('#impRes', bg).innerHTML = ''; $('#impErr', bg).textContent = err.message; }
    };
    $('#impGo', bg).onclick = async e => {
      e.target.disabled = true; e.target.textContent = '가져오는 중…';
      try { const r = await send(false); close(); toast(`${D.label} ${r.created}건 가져옴${r.updated ? `, ${r.updated}건 덮어씀` : ''}`); renderQuotes(); }
      catch (err) { $('#impErr', bg).textContent = err.message; e.target.disabled = false; }
    };
  });
}

// ===================================================== 입고 예정
const SHIP = {ordered: '발주', shipped: '선적', customs: '통관', arrived: '입고완료'};
const shTag = st => `<span class="tag sh-${st}">${SHIP[st]}</span>`;
const fmtQty = n => Number(n || 0).toLocaleString('ko-KR', {maximumFractionDigits: 2});
function dday(eta, status) {
  if (status === 'arrived') return '';
  const diff = Math.round((new Date(eta + 'T00:00') - new Date(todayStr() + 'T00:00')) / 86400000);
  if (diff === 0) return '<span class="dday today">오늘</span>';
  return diff < 0 ? `<span class="dday late">${-diff}일 지남</span>` : `<span class="dday">D-${diff}</span>`;
}
function shipBlock(title, list, emptyMsg) {
  if (!list.length) return emptyMsg ? `<div class="muted" style="padding:8px 0">${title}: ${emptyMsg}</div>` : '';
  return `<div class="dept-head" style="padding:10px 0 2px">${title} (${list.length})</div>` + list.map(sh => `<div class="list-item" data-ship="${sh.id}">
      ${shTag(sh.status)}<div style="flex:1"><b>${esc(sh.item)}</b> <small class="muted">${esc(sh.spec)}</small><br>
      <small class="muted">${esc(sh.supplier)}${sh.customer ? ' → ' + esc(sh.customer) : ''} · ${fmtQty(sh.qty)} ${esc(sh.unit)}${sh.bl_no ? ' · B/L ' + esc(sh.bl_no) : ''}</small></div>
      <div style="text-align:right"><small>${esc(sh.eta)}</small><br>${dday(sh.eta, sh.status)}</div></div>`).join('');
}


// ---- UNI-PASS 통관 진행 (입항 → 반입 → 수입신고 수리 → 반출)
function csTag(sh) {
  if (!sh.bl_no && !sh.hbl_no) return '';
  const md = v => v ? `${+v.slice(5, 7)}/${+v.slice(8, 10)}` : '';
  if (sh.cs_out_at) return `<span class="tag s-done" title="UNI-PASS">🚚 반출 ${md(sh.cs_out_at)}</span>`;
  if (sh.cs_cleared_at) return `<span class="tag s-done" title="UNI-PASS">✅ 통관 ${md(sh.cs_cleared_at)}</span>`;
  if (sh.cs_in_at) return `<span class="tag s-doing" title="${esc(sh.cs_shed)}">📦 반입 ${md(sh.cs_in_at)}</span>`;
  if (sh.cs_arrived) return `<span class="tag s-doing">🛳 입항 ${md(sh.cs_arrived)}</span>`;
  if (sh.cs_error) return '<span class="tag s-todo" title="UNI-PASS 에서 아직 못 찾음">UNI-PASS 대기</span>';
  return '';
}
function csPanel(sh) {
  const ev = (() => { try { return JSON.parse(sh.cs_events || '[]'); } catch { return []; } })();
  const step = (on, label, v) => `<div style="flex:1;min-width:90px;text-align:center;padding:6px;border-radius:8px;background:${on ? 'var(--primary-weak)' : 'var(--bg)'};${on ? 'color:var(--primary);font-weight:700' : 'color:var(--muted)'}">${label}<br><small>${esc(v || '-')}</small></div>`;
  return `<div class="row"><b>🛃 UNI-PASS 통관 진행</b><span class="spacer"></span><button type="button" class="btn sm" id="csRefresh">🔄 UNI-PASS 조회</button></div>
    ${sh.cs_checked_at ? `<div class="muted" style="font-size:12px">마지막 확인 ${esc(sh.cs_checked_at.slice(0, 16))}${sh.cs_status ? ' · ' + esc(sh.cs_status) : ''}${sh.cs_cargo_no ? ' · 화물관리번호 ' + esc(sh.cs_cargo_no) : ''}</div>` : '<div class="muted" style="font-size:12px">아직 조회하지 않았습니다. 진행 중인 건은 낮 시간에 2시간마다 자동으로 확인합니다.</div>'}
    ${sh.cs_error ? `<div class="muted" style="font-size:12px;color:#b45309">${esc(sh.cs_error)}</div>` : ''}
    <div class="row" style="gap:6px;margin-top:8px;flex-wrap:nowrap;overflow-x:auto">${step(sh.cs_arrived, '🛳 입항', sh.cs_arrived)}${step(sh.cs_in_at, '📦 반입', sh.cs_in_at ? sh.cs_in_at.slice(5) + (sh.cs_shed ? ' ' + sh.cs_shed : '') : '')}${step(sh.cs_cleared_at, '✅ 수입신고 수리', sh.cs_cleared_at && sh.cs_cleared_at.slice(5))}${step(sh.cs_out_at, '🚚 반출', sh.cs_out_at && sh.cs_out_at.slice(5))}</div>
    ${ev.length ? `<details style="margin-top:6px"><summary class="muted" style="cursor:pointer;font-size:12px">처리 이력 ${ev.length}건</summary>
      <table class="an-table" style="margin-top:4px"><tbody>${ev.slice().reverse().map(e => `<tr><td>${esc(e.at)}</td><td>${esc(e.kind)}</td><td>${esc(e.shed || '')}${e.memo ? ' · ' + esc(e.memo) : ''}</td></tr>`).join('')}</tbody></table></details>` : ''}`;
}
async function openUnipassSettings() {

    <div style="font-size:13px;line-height:1.8">관세청 UNI-PASS 의 <b>화물통관진행정보조회</b> 인증키를 넣으면, 입고예정에 적은 <b>M B/L·H B/L</b> 로 입항·반입·통관 수리·반출을 자동으로 확인하고 알림을 보냅니다.<br>

    <label>인증키 ${st.has_key ? `<small class="muted">(등록됨 · 끝자리 ${esc(st.key_tail)})</small>` : ''}</label>

    <label>시험 조회 (선택)</label>
    <div class="row" style="flex-wrap:nowrap"><input id="upM" placeholder="M B/L"><input id="upH" placeholder="H B/L"><button class="btn" id="upTest">조회</button></div>
    <pre id="upOut" style="white-space:pre-wrap;font-size:12px;background:var(--bg);padding:8px;border-radius:8px;display:none"></pre>

  const v = sh ? {...sh, ...pre} : {eta: day || todayStr(), status: 'ordered', unit: 'kg', ...pre};
  const canDel = sh && (sh.created_by === state.me.id || state.me.role === 'admin');
  openModal(`<h2>${sh ? '입고 예정' : '새 입고 예정'}</h2>

        <div><label>예상 입고일 (ETA) *</label><input type="date" name="eta" value="${esc(v.eta)}" required></div>

        <div><label>H B/L (하우스)</label><input name="hbl_no" value="${esc(v.hbl_no)}" placeholder="포워더 B/L 번호"></div>
        <div><label>입고 창고</label><input name="warehouse" value="${esc(v.warehouse)}"></div>
      </div>
      <label>진행 상태</label>
      <div class="status-btns">${Object.entries(SHIP).map(([k, l]) => `<button type="button" data-st="${k}" class="${v.status === k ? 'on' : ''}">${l}</button>`).join('')}</div>
      <input type="hidden" name="status" value="${esc(v.status)}">
      <label>메모</label><textarea name="note" style="min-height:60px" placeholder="예: 선적 서류 메일 확인, 통관 대행사 ○○">${esc(v.note)}</textarea>

      try { await api(`/api/shipments/${sh.id}/unipass`, {method: 'POST'}); const all = await api('/api/shipments?view=all'); const n = all.find(x => x.id === sh.id); $('#csBox', bg).innerHTML = csPanel(n); csBind(); }
      catch (err) { toast(err.message); b.disabled = false; b.textContent = '🔄 UNI-PASS 조회'; }
    }; };
    csBind();
    const f = $('form', bg);
    $$('[data-st]', bg).forEach(b => b.onclick = () => { f.status.value = b.dataset.st; $$('[data-st]', bg).forEach(x => x.classList.toggle('on', x === b)); });

      body.qty = numVal(f.qty.value);

// ===================================================== 재고 (나스 재고 엑셀)
const kg = n => n == null ? '-' : Number(n).toLocaleString('ko-KR', {maximumFractionDigits: 2});
function expTag(d, today) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d || '')) return d ? `<small class="muted">${esc(d)}</small>` : '';
  const days = Math.round((new Date(d) - new Date(today)) / 864e5);
  if (days < 0) return `<span class="dday late">기한 지남 ${esc(d)}</span>`;
  if (days <= 180) return `<span class="dday" style="background:#fef3c7;color:#b45309">${days}일 남음 ${esc(d)}</span>`;
  return `<small class="muted">${esc(d)}</small>`;
}
const isDead = l => /폐기|불용/.test(l.kind + ' ' + l.location);

function invMetaLine(meta) {
  if (!meta || !meta.filename) return '<span class="muted">아직 올린 재고 엑셀이 없습니다.</span>';
  const stale = meta.file_date && (new Date(todayStr()) - new Date(meta.file_date)) / 864e5 > 3;
  return `<span class="muted" style="font-size:12px">${meta.file_date ? `재고 기준일 <b style="${stale ? 'color:#b91c1c' : ''}">${esc(meta.file_date)}</b>${stale ? ' (오래됨 — 자동 업로드 확인)' : ''} · ` : ''}파일 <b>${esc(meta.filename)}</b> · 올림 ${esc((meta.uploaded_at || '').slice(0, 16))} · ${esc(meta.by || '')}</span>`;
}

function openInvUpload(after) {

    const send = async dry => {
      const fd = new FormData(); fd.append('file', $('#invFile', bg).files[0]);

  });

async function openInvSettings() {
  const s = await api('/api/inventory/settings');
  const host = location.origin;
  // 사무실 PC에서 도는 PowerShell 스크립트. -Install 로 실행하면 작업 스케줄러에 매일 등록까지 한다.
  const script = (key, time, invDir, ledDir) => `param([switch]$Install)
# TeamHub 자동 업로드: 폴더마다 파일 이름의 날짜가 가장 최근인 엑셀을 올립니다
# (예: 재고 2026.10.01.xlsx → 다음 날 재고 2026.10.02.xlsx 가 생기면 그 파일. 날짜가 없으면 수정한 시각 기준)
$jobs = @(
  @{ Name = "재고";       Dir = "${(invDir || '').replace(/"/g, '')}"; Url = "${host}/api/inventory/upload"; Ext = @('.xlsx', '.xlsm') },
  @{ Name = "매입매출장"; Dir = "${(ledDir || '').replace(/"/g, '')}"; Url = "${host}/api/ledger/upload";    Ext = @('.xls', '.xlsx', '.xlsm') }
)
$key = "${key || '(키 만들기 필요)'}"
$log = "C:\\TeamHub\\log.txt"
function Say($msg) { Write-Host $msg; Add-Content -LiteralPath $log -Value ("{0}  {1}" -f (Get-Date -Format "yyyy-MM-dd HH:mm"), $msg) -Encoding UTF8 }
if ($Install) {
  schtasks.exe /Create /F /TN "TeamHub Inventory" /SC DAILY /ST ${time || '18:00'} /TR "powershell.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File C:\\TeamHub\\teamhub_inventory.ps1" | Out-Null
  if ($LASTEXITCODE -eq 0) { Say "작업 스케줄러 등록 완료: 매일 ${time || '18:00'}" } else { Say "작업 스케줄러 등록 실패" }
  try { $t = Get-ScheduledTask -TaskName "TeamHub Inventory"; $t.Settings.StartWhenAvailable = $true; Set-ScheduledTask -InputObject $t | Out-Null } catch {}
}
function Get-FileDate($name) {
  if ($name -match '(20\\d{2})[.\\-_ ]?(\\d{1,2})[.\\-_ ]?(\\d{1,2})(?!\\d)') { return '{0}{1:D2}{2:D2}' -f [int]$Matches[1], [int]$Matches[2], [int]$Matches[3] }
  if ($name -match '(?<!\\d)(\\d{2})(\\d{2})(\\d{2})(?!\\d)') { return '20{0}{1}{2}' -f $Matches[1], $Matches[2], $Matches[3] }
  return '00000000'
}
foreach ($job in $jobs) {
  if (-not $job.Dir) { continue }
  if (-not (Test-Path -LiteralPath $job.Dir)) { Say "[$($job.Name)] 폴더를 찾을 수 없습니다: $($job.Dir)  (이 PC에 나스 드라이브가 연결되어 있는지 확인)"; continue }
  # 하위 폴더(예: 월별 폴더)까지 찾음
  $files = Get-ChildItem -LiteralPath $job.Dir -File -Recurse -Depth 2 -ErrorAction SilentlyContinue |
           Where-Object { $job.Ext -contains $_.Extension.ToLower() -and $_.Name -notlike '~$*' } |
           Sort-Object @{ Expression = { Get-FileDate $_.BaseName }; Descending = $true }, @{ Expression = 'LastWriteTime'; Descending = $true } |
           Select-Object -First 5
  if (-not $files) { Say "[$($job.Name)] 엑셀 파일을 찾지 못했습니다: $($job.Dir)"; continue }
  $done = $false
  foreach ($f in $files) {   # 맞는 시트가 없는 파일이면 다음 파일로
    $tmp = Join-Path $env:TEMP ("teamhub_upload" + $f.Extension)   # curl 은 한글 경로를 못 읽는 경우가 있어 임시 복사
    Copy-Item -LiteralPath $f.FullName $tmp -Force
    $out = curl.exe -s -X POST -w "|%{http_code}" -H "X-Upload-Key: $key" -H "X-File-Name: $([uri]::EscapeDataString($f.Name))" -F "file=@$tmp" $job.Url
    $code = ("$out" -split '\\|')[-1]
    if ($code -eq '200') { Say "[$($job.Name)] 올림 성공: $($f.Name)"; $done = $true; break }
    Say "[$($job.Name)] 실패($code): $($f.Name)  $out"
  }
}`;
  // 더블클릭 설치 파일(.cmd): 아래 PowerShell 부분을 C:\TeamHub 에 저장하고 -Install 로 실행
  const installer = (key, time) => ['@echo off', 'if not exist C:\\TeamHub mkdir C:\\TeamHub', 'set "SELF=%~f0"',
    `powershell -NoProfile -ExecutionPolicy Bypass -Command "$s=[IO.File]::ReadAllText($env:SELF,[Text.Encoding]::UTF8); $i=$s.IndexOf('#'+'PS-START'); [IO.File]::WriteAllText('C:\\TeamHub\\teamhub_inventory.ps1', $s.Substring($i), (New-Object Text.UTF8Encoding $true))"`,
    'powershell -NoProfile -ExecutionPolicy Bypass -File C:\\TeamHub\\teamhub_inventory.ps1 -Install',
    'echo.', 'pause', 'exit /b', '#PS-START'].join('\r\n') + '\r\n' + script(key, time, $('#invDir').value, $('#ledDir').value).replace(/\n/g, '\r\n') + '\r\n';
  const download = (name, text, bom) => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([(bom ? '\ufeff' : '') + text], {type: 'application/octet-stream'}));

  openModal(`<h2>⚙ 자동 업로드 (재고 · 매입매출장)</h2>
    <div class="muted" style="font-size:13px">나스(Z: 드라이브)가 연결된 <b>사무실 PC</b>에서 이 화면을 열고 아래 순서대로 하세요.</div>

      <div class="muted" style="font-size:12px;margin-top:4px">${s.upload_key ? '이미 있습니다. 그대로 두고 ②로 가세요. (새로 만들면 예전에 설치한 PC는 다시 설치해야 합니다)' : '버튼을 한 번 누르세요.'}</div>
    </div>
    <div class="ec-box">
      <b>② 올릴 폴더 (나스)</b>
      <label style="margin-top:6px">📦 재고리스트 폴더</label><input id="invDir" value="${esc(s.inv_dir || '')}">
