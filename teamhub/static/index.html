        <div><label>판매처 (받을 고객, 있으면)</label><input name="customer" value="${esc(v.customer)}"></div>
        <div><label>수량</label><div class="row" style="flex-wrap:nowrap"><input name="qty" inputmode="decimal" value="${v.qty ?? ''}"><input name="unit" value="${esc(v.unit)}" style="max-width:80px" placeholder="kg"></div></div>
        <div><label>예상 입고일 (ETA) *</label><input type="date" name="eta" value="${esc(v.eta)}" required></div>
        <div><label>M B/L (마스터)</label><input name="bl_no" value="${esc(v.bl_no)}" placeholder="선사 B/L 번호"></div>
        <div><label>H B/L (하우스)</label><input name="hbl_no" value="${esc(v.hbl_no)}" placeholder="포워더 B/L 번호"></div>
        <div><label>입고 창고</label><input name="warehouse" value="${esc(v.warehouse)}"></div>
      </div>
      <label>진행 상태</label>
      <div class="status-btns">${Object.entries(SHIP).map(([k, l]) => `<button type="button" data-st="${k}" class="${v.status === k ? 'on' : ''}">${l}</button>`).join('')}</div>
      <input type="hidden" name="status" value="${esc(v.status)}">
      <label>메모</label><textarea name="note" style="min-height:60px" placeholder="예: 선적 서류 메일 확인, 통관 대행사 ○○">${esc(v.note)}</textarea>
      <div class="err"></div>
      <div class="actions">${canDel ? '<button type="button" class="btn danger" id="shDel">삭제</button><span class="spacer"></span>' : ''}
        <button type="button" class="btn" data-close>취소</button><button class="btn primary">저장</button></div>
    </form>`, (bg, close) => {
    if ($('#shUnarr', bg)) $('#shUnarr', bg).onclick = async () => {
      const back = sh.cs_cleared_at || sh.cs_in_at || sh.cs_arrived ? 'customs' : (sh.bl_no || sh.hbl_no) ? 'shipped' : 'ordered';
      await api(`/api/shipments/${sh.id}/status`, {method: 'PATCH', body: {status: back}});
      close(); toast('입고완료를 취소했습니다. 다시 진행 중 목록에 보입니다.');
      pre.onSaved && pre.onSaved(); go(state.view);
    };
    if ($('#shClr', bg)) $('#shClr', bg).onclick = async () => {
      await api(`/api/shipments/${sh.id}/cleared`, {method: 'POST', body: {cleared: !sh.cs_cleared_at}});
      close(); toast(sh.cs_cleared_at ? '통관완료를 취소했습니다.' : '통관완료로 표시했습니다. 진행중·홈에서 빠집니다.');
      pre.onSaved && pre.onSaved(); go(state.view);
    };
    const csBind = () => { const b = $('#csRefresh', bg); if (b) b.onclick = async () => {
      b.disabled = true; b.textContent = '조회 중…';
      try { await api(`/api/shipments/${sh.id}/unipass`, {method: 'POST'}); const all = await api('/api/shipments?view=all'); const n = all.find(x => x.id === sh.id); $('#csBox', bg).innerHTML = csPanel(n); csBind(); }
      catch (err) { toast(err.message); b.disabled = false; b.textContent = '🔄 UNI-PASS 조회'; }
    }; };
    csBind();
    const f = $('form', bg);
    $$('[data-st]', bg).forEach(b => b.onclick = () => { f.status.value = b.dataset.st; $$('[data-st]', bg).forEach(x => x.classList.toggle('on', x === b)); });
    f.onsubmit = async e => {
      e.preventDefault();
      const body = {};
      ['item', 'spec', 'supplier', 'customer', 'unit', 'eta', 'status', 'bl_no', 'hbl_no', 'warehouse', 'note'].forEach(k => body[k] = f[k].value);
      body.qty = numVal(f.qty.value);
      try {
        await api(sh ? `/api/shipments/${sh.id}` : '/api/shipments', {method: sh ? 'PUT' : 'POST', body});
        close(); toast('저장되었습니다.'); if (pre.onSaved) await pre.onSaved(); go(state.view);
      } catch (err) { $('.err', bg).textContent = err.message; }
    };
    const del = $('#shDel', bg);
    if (del) del.onclick = async () => {
      if (!confirm('이 입고 예정을 삭제할까요?')) return;
      await api(`/api/shipments/${sh.id}`, {method: 'DELETE'}); close(); toast('삭제되었습니다.'); go(state.view);
    };
  });
}

// ===================================================== 재고 (나스 재고 엑셀)
const kg = n => n == null ? '-' : Number(n).toLocaleString('ko-KR', {maximumFractionDigits: 2});
function expTag(d, today) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d || '')) return d ? `<small class="muted">${esc(d)}</small>` : '';
  const days = Math.round((new Date(d) - new Date(today)) / 864e5);
  if (days < 0) return `<span class="dday late">기한 지남 ${esc(d)}</span>`;
  if (days <= 180) return `<span class="dday" style="background:#fef3c7;color:#b45309">${days}일 남음 ${esc(d)}</span>`;
  return `<small class="muted">${esc(d)}</small>`;
}
const isDead = l => /폐기|불용/.test(l.kind + ' ' + l.location);

function invMetaLine(meta) {
  if (!meta || !meta.filename) return '<span class="muted">아직 올린 재고 엑셀이 없습니다.</span>';
  const stale = meta.file_date && (new Date(todayStr()) - new Date(meta.file_date)) / 864e5 > 3;
  return `<span class="muted" style="font-size:12px">${meta.file_date ? `재고 기준일 <b style="${stale ? 'color:#b91c1c' : ''}">${esc(meta.file_date)}</b>${stale ? ' (오래됨 — 자동 업로드 확인)' : ''} · ` : ''}파일 <b>${esc(meta.filename)}</b> · 올림 ${esc((meta.uploaded_at || '').slice(0, 16))} · ${esc(meta.by || '')}</span>`;
}

function openInvUpload(after) {
  openModal(`<h2>📦 재고 엑셀 올리기</h2>
    <div class="muted" style="font-size:13px">나스 <b>창고관리</b> 폴더의 재고 엑셀(xlsx)을 올리면 재고·원가·출고 기록을 새로 읽습니다. 올릴 때마다 전체가 이 파일 내용으로 바뀝니다.</div>
    <label>엑셀 파일</label><input type="file" id="invFile" accept=".xlsx,.xlsm">
    <div id="invPrev" class="muted" style="margin-top:8px"></div><div class="err"></div>
    <div class="actions"><button class="btn" data-close>닫기</button><button class="btn primary" id="invGo" disabled>올리기</button></div>`, (bg, close) => {
    const send = async dry => {
      const fd = new FormData(); fd.append('file', $('#invFile', bg).files[0]);
      const res = await fetch(`/api/inventory/upload?dry_run=${dry}`, {method: 'POST', headers: {Authorization: 'Bearer ' + state.token}, body: fd});
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || '업로드 실패');
      return data;
    };
    $('#invFile', bg).onchange = async () => {
      $('.err', bg).textContent = ''; $('#invGo', bg).disabled = true; $('#invPrev', bg).textContent = '읽는 중…';
      try {
        const r = await send(true);
        $('#invPrev', bg).innerHTML = `시트 <b>${r.sheets.map(esc).join(', ')}</b> · 로트 <b>${r.lots}</b>개 · 출고 기록 <b>${r.ships}</b>건을 찾았습니다.`;
        $('#invGo', bg).disabled = false;
      } catch (err) { $('#invPrev', bg).textContent = ''; $('.err', bg).textContent = err.message; }
    };
    $('#invGo', bg).onclick = async () => {
      try { const r = await send(false); close(); toast(`로트 ${r.lots}개, 출고 ${r.ships}건을 반영했습니다.`); after && after(); }
      catch (err) { $('.err', bg).textContent = err.message; }
    };
  });
}

async function openInvSettings() {
  const s = await api('/api/inventory/settings');
  const host = location.origin;
  // 사무실 PC에서 도는 PowerShell 스크립트. -Install 로 실행하면 작업 스케줄러에 매일 등록까지 한다.
  const script = (key, time, invDir, ledDir, inbDir, bankDir, costDir) => `param([switch]$Install)
# TeamHub 자동 업로드: 폴더마다 파일 이름의 날짜가 가장 최근인 엑셀을 올립니다
# (예: 재고 2026.10.01.xlsx → 다음 날 재고 2026.10.02.xlsx 가 생기면 그 파일. 날짜가 없으면 수정한 시각 기준)
$jobs = @(
  @{ Name = "재고";       Dir = "${(invDir || '').replace(/"/g, '')}"; Url = "${host}/api/inventory/upload"; Ext = @('.xlsx', '.xlsm'); Like = '*'; Depth = 2 },
  @{ Name = "매입매출장"; Dir = "${(ledDir || '').replace(/"/g, '')}"; Url = "${host}/api/ledger/upload";    Ext = @('.xls', '.xlsx', '.xlsm'); Like = '*'; Depth = 2; All = $true },
  @{ Name = "인바운딩";   Dir = "${(inbDir || '').replace(/"/g, '')}"; Url = "${host}/api/inbound/upload";   Ext = @('.xlsx', '.xlsm'); Like = '*Inbound*'; Depth = 0 },
  @{ Name = "은행입금";   Dir = "${(bankDir || '').replace(/"/g, '')}"; Url = "${host}/api/bank/upload";      Ext = @('.xls', '.xlsx', '.csv'); Like = '*'; Depth = 1 },
  @{ Name = "원가계산서"; Dir = "${(costDir || '').replace(/"/g, '')}"; Url = "${host}/api/costs/upload";     Ext = @('.xls', '.xlsx'); Like = '*'; Depth = 2; All = $true }
)
$key = "${key || '(키 만들기 필요)'}"
$log = "C:\\TeamHub\\log.txt"
function Say($msg) { Write-Host $msg; Add-Content -LiteralPath $log -Value ("{0}  {1}" -f (Get-Date -Format "yyyy-MM-dd HH:mm"), $msg) -Encoding UTF8 }
if ($Install) {
  schtasks.exe /Create /F /TN "TeamHub Inventory" /SC DAILY /ST ${time || '18:00'} /TR "powershell.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File C:\\TeamHub\\teamhub_inventory.ps1" | Out-Null
  if ($LASTEXITCODE -eq 0) { Say "작업 스케줄러 등록 완료: 매일 ${time || '18:00'}" } else { Say "작업 스케줄러 등록 실패" }
  try { $t = Get-ScheduledTask -TaskName "TeamHub Inventory"; $t.Settings.StartWhenAvailable = $true; Set-ScheduledTask -InputObject $t | Out-Null } catch {}
}
function Get-FileDate($name) {
  if ($name -match '(20\\d{2})[.\\-_ ]?(\\d{1,2})[.\\-_ ]?(\\d{1,2})(?!\\d)') { return '{0}{1:D2}{2:D2}' -f [int]$Matches[1], [int]$Matches[2], [int]$Matches[3] }
  if ($name -match '(?<!\\d)(\\d{2})(\\d{2})(\\d{2})(?!\\d)') { return '20{0}{1}{2}' -f $Matches[1], $Matches[2], $Matches[3] }
  return '00000000'
}
foreach ($job in $jobs) {
  if (-not $job.Dir) { continue }
  if (-not (Test-Path -LiteralPath $job.Dir)) { Say "[$($job.Name)] 폴더를 찾을 수 없습니다: $($job.Dir)  (이 PC에 나스 드라이브가 연결되어 있는지 확인)"; continue }
  # 하위 폴더(예: 월별 폴더)까지 찾음
  if (Test-Path -LiteralPath $job.Dir -PathType Leaf) {   # 폴더 대신 파일 경로를 직접 넣은 경우 그 파일만
    $files = @(Get-Item -LiteralPath $job.Dir)
  } else {
  $files = Get-ChildItem -LiteralPath $job.Dir -File -Recurse -Depth $job.Depth -ErrorAction SilentlyContinue |
           Where-Object { $job.Ext -contains $_.Extension.ToLower() -and $_.Name -notlike '~$*' -and $_.Name -like $job.Like } |
           Sort-Object @{ Expression = { Get-FileDate $_.BaseName }; Descending = $true }, @{ Expression = 'LastWriteTime'; Descending = $true } |
           Select-Object -First 5
  }
  if (-not $files) { Say "[$($job.Name)] 엑셀 파일을 찾지 못했습니다: $($job.Dir)"; continue }
  $done = $false
  foreach ($f in $files) {   # 맞는 시트가 없는 파일이면 다음 파일로
    $tmp = Join-Path $env:TEMP ("teamhub_upload" + $f.Extension)   # curl 은 한글 경로를 못 읽는 경우가 있어 임시 복사
    Copy-Item -LiteralPath $f.FullName $tmp -Force
    $out = curl.exe -s -X POST -w "|%{http_code}" -H "X-Upload-Key: $key" -H "X-File-Name: $([uri]::EscapeDataString($f.Name))" -F "file=@$tmp" $job.Url
    $code = ("$out" -split '\\|')[-1]
    if ($code -eq '200') { Say "[$($job.Name)] 올림 성공: $($f.Name)"; $done = $true; if (-not $job.All) { break } else { continue } }
    Say "[$($job.Name)] 실패($code): $($f.Name)  $out"
  }
}`;
  // 더블클릭 설치 파일(.cmd): 아래 PowerShell 부분을 C:\TeamHub 에 저장하고 -Install 로 실행

      <div class="muted" style="font-size:12px;margin-top:4px">${s.upload_key ? '이미 있습니다. 그대로 두고 ②로 가세요. (새로 만들면 예전에 설치한 PC는 다시 설치해야 합니다)' : '버튼을 한 번 누르세요.'}</div>

      await save({new_key: true}); toast('키를 만들었습니다. 이제 ② 폴더 확인 → ③ 설치 파일을 받으세요.');
    };
    const key = () => { const k = $('#upKey', bg).value; if (!k) toast('먼저 ① 키 만들기를 누르세요.'); return k; };
    const DIRK = {invDir: 'inv_dir', ledDir: 'ledger_dir', inbDir: 'inbound_dir', bankDir: 'bank_dir', costDir: 'cost_dir'};
    Object.keys(DIRK).forEach(id => $('#' + id, bg).onchange = e => save({[DIRK[id]]: e.target.value}));
    $('#dlInstall', bg).onclick = () => { const k = key(); if (k) download('TeamHub_install.cmd', installer(k, $('#upTime', bg).value || '18:00'), false); };
    $('#dlScript', bg).onclick = () => { const k = key(); if (k) download('teamhub_inventory.ps1', script(k, $('#upTime', bg).value, $('#invDir', bg).value, $('#ledDir', bg).value, $('#inbDir', bg).value, $('#bankDir', bg).value, $('#costDir', bg).value).replace(/\n/g, '\r\n'), true); };
  });
}

    <div class="tabs"><button data-t="stock">재고 있음</button><button data-t="soon">소비기한 임박</button><button data-t="dead">불용·폐기</button><button data-t="all">전체 로트</button><button data-t="fc" class="active">📈 판매 예상</button></div>
    <div class="muted" style="font-size:13px;margin-bottom:8px">올해(${d.year}) 남은 기간(약 ${Math.round((1 - d.elapsed) * 12)}개월)에 나갈 양을 작년·올해 판매량으로 예상해 <b>지금 재고 + 입고 예정</b>과 비교합니다.
      판매량은 매입매출장(재고에서 나간 줄)과 재고 엑셀 출고 기록 중 큰 쪽을 씁니다.</div>
    <div class="stats stats4">
      <div class="stat" data-f="need"><span class="muted">🔴 부족 (발주 필요 · 인바운딩에 없음)</span><b style="color:#b91c1c">${cnt('short')}개</b></div>
      <div class="stat" data-f="inc"><span class="muted">🚢 모자라지만 인바운딩에 있음</span><b style="color:#1d4ed8">${cnt('incoming')}개</b>${d.rows.some(r => r.level === 'incoming' && r.late) ? `<small style="color:#b45309">⚠ 입고 전 재고 소진 ${d.rows.filter(r => r.level === 'incoming' && r.late).length}개</small>` : ''}</div>
      <div class="stat" data-f="all"><span class="muted">🟢 충분</span><b>${cnt('ok')}개</b></div>
      <div class="stat" data-f="checked"><span class="muted">✔ 확인 표시한 품목</span><b>${d.rows.filter(r => r.checked).length}개</b></div>
    </div>
    <div class="row" style="margin-bottom:8px"><select id="fcF" style="width:auto"><option value="need">🔴 부족 (발주 필요)</option><option value="inc">🚢 인바운딩에 있음</option><option value="all">전체</option><option value="checked">확인 표시한 것</option></select>
      <input id="fcQ" placeholder="품목 검색" value="${esc(iv.q || '')}" style="max-width:220px"><span class="muted">${rows.length}개 · 단위 kg</span></div>
    <div class="qscroll" style="max-height:600px;overflow:auto"><table class="an-table"><thead><tr><th>품목</th><th>상태</th><th class="num">작년 판매</th><th class="num">올해 누계</th><th class="num">올해 예상</th><th class="num">남은 예상 출고</th><th class="num">현재 재고</th><th class="num">입고 예정</th><th>예정일 (대략)</th><th class="num">부족량</th><th class="num">재고 몇 달치</th><th>확인</th></tr></thead><tbody>
      ${rows.map((r, i) => `<tr><td title="${esc(r.basis)}">${esc(r.item)}</td><td><span class="tag ${LV[r.level][1]}">${LV[r.level][0]}</span></td>
        <td class="num">${kg(r.last)}</td><td class="num">${kg(r.ytd)}</td><td class="num" title="${esc(r.basis)}">${kg(r.forecast)}</td><td class="num"><b>${kg(r.remain)}</b></td>
        <td class="num">${kg(r.stock)}</td><td class="num">${r.incoming_list.length ? `<a href="#" data-inc="${i}">${r.incoming ? kg(r.incoming) : '?'}</a><br><small class="muted">${Object.entries(r.incoming_list.reduce((a, x) => (a[x.stage] = (a[x.stage] || 0) + 1, a), {})).map(([k, n]) => k + (n > 1 ? n : '')).join('·')}</small>` : '-'}</td>
        <td style="white-space:nowrap">${r.incoming_eta ? `<b>${r.incoming_guess ? '~' : ''}${md(r.incoming_eta)}</b>${r.incoming_guess ? ' <small class="muted" title="ETA 가 비어 있어 ETD·주문일 등으로 추정">추정</small>' : ''}${r.incoming_eta < today ? ' <small class="down" title="예정일이 지났는데 아직 입고완료가 아님 — 인바운딩 확인">지남</small>' : ''}` : '-'}${r.runout ? `<br><small class="${r.late ? 'down' : 'muted'}" title="남은 예상 출고가 고르게 나간다고 볼 때">${r.late ? '⚠ ' : ''}재고 소진 ~${md(r.runout)}</small>` : ''}</td>
        <td class="num ${r.level === 'short' ? 'down' : ''}">${r.level === 'short' ? kg(r.short) : r.short_after ? `<small class="muted" title="인바운딩 수량까지 받아도 모자라는 양">입고 후 ${kg(r.short_after)} 더</small>` : '-'}</td><td class="num">${r.cover_months == null ? '-' : r.cover_months.toFixed(1)}</td>
        <td><label style="display:flex;gap:4px;align-items:center;margin:0;white-space:nowrap" title="${r.checked ? esc(r.checked.by + ' ' + r.checked.at + (r.checked.memo ? ' · ' + r.checked.memo : '')) : '발주했거나 확인했으면 체크'}"><input type="checkbox" data-chk="${esc(r.item)}" ${r.checked ? 'checked' : ''} style="width:auto">${r.checked ? `<small class="muted">${esc(r.checked.by)}</small>` : ''}</label></td></tr>
        ${r.incoming_list.length ? `<tr class="hidden" data-incl="${i}"><td colspan="12" style="background:var(--bg);padding:6px 10px"><table class="an-table" style="margin:0"><thead><tr><th>입고예정 품명</th><th>단계</th><th>예정일</th><th class="num">수량</th><th>공급사</th><th>거래처</th></tr></thead><tbody>
          ${r.incoming_list.map(x => `<tr data-ship="${x.id}" style="cursor:pointer"><td>${esc(x.name)}</td><td>${esc(x.stage)}</td><td>${esc(x.eta)}</td><td class="num">${fmtQty(x.qty)} ${esc(x.unit)}</td><td>${esc(x.supplier)}</td><td>${esc(x.client)}</td></tr>`).join('')}</tbody></table></td></tr>` : ''}`).join('') || '<tr><td colspan="12" class="empty">해당하는 품목이 없습니다.</td></tr>'}
    </tbody></table></div>
    <div class="muted" style="font-size:12px;margin-top:8px;line-height:1.7">· 올해 예상 = 작년 판매량 × (올해 누계 ÷ 작년 같은 기간), 작년 자료가 없으면 올해 추세로 연간 환산. 품목에 마우스를 올리면 계산 근거가 보입니다.
      <br>· 🔴 부족 = 남은 예상 출고가 지금 재고보다 많은데 인바운딩·입고예정에도 없는 품목(발주 필요). 인바운딩에 있으면 🚢 입고 예정으로 따로 보여 줍니다.
      <br>· 예정일 = 가장 빠른 입고 예정일(ETA, 없으면 ETD·출고일·주문일로 추정 '~'). 재고 소진 = 남은 기간 고르게 나간다고 볼 때 지금 재고가 바닥나는 때 — 입고 예정일보다 빠르면 ⚠. 수량을 누르면 건별 내역이 보입니다. 불용·폐기 로트는 재고에서 뺍니다. 작년 매입매출장을 올리면 더 정확해집니다.</div>
    ${admin && d.unmatched.length ? `<details style="margin-top:12px"><summary style="cursor:pointer;font-size:13px"><b>🔗 재고 품목과 이름이 안 맞는 판매 품명 ${d.unmatched.length}개</b> <small class="muted">(재고에서 나갔는데 이름이 달라 계산에서 빠진 것 — 연결하면 반영됩니다)</small></summary>
      <table class="an-table" style="margin-top:6px"><thead><tr><th>매입매출장 품명</th><th class="num">올해·작년 수량</th><th>재고 품목 연결</th></tr></thead><tbody>
      ${d.unmatched.map(u => `<tr><td>${esc(u.name)}</td><td class="num">${kg(u.qty)}</td><td><select data-link="${esc(u.name)}" style="width:auto;max-width:320px"><option value="">— 고르기 —</option><option value="__none__">재고 품목 아님 (목록에서 숨김)</option>${d.items.map(it => `<option value="${esc(it)}">${esc(it)}</option>`).join('')}</select></td></tr>`).join('')}
      </tbody></table></details>` : ''}
  </div>`;
  $$('.tabs button').forEach(b => b.onclick = () => { iv.tab = b.dataset.t; renderInventory(); });
  $$('[data-f]').forEach(b => b.onclick = () => { iv.fcFilter = b.dataset.f; renderInventory(); });
  $$('[data-inc]').forEach(a => a.onclick = e => { e.preventDefault(); $(`tr[data-incl="${a.dataset.inc}"]`).classList.toggle('hidden'); });
  $$('[data-incl] [data-ship]').forEach(tr => tr.onclick = () => openShipment(+tr.dataset.ship));
  $('#fcF').value = f; $('#fcF').onchange = e => { iv.fcFilter = e.target.value; renderInventory(); };
  let timer;
  $('#fcQ').oninput = e => { clearTimeout(timer); timer = setTimeout(() => { iv.q = e.target.value; renderInventory().then(() => { const i = $('#fcQ'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }); }, 300); };
  $$('[data-chk]').forEach(cb => cb.onchange = async () => {
    const memo = cb.checked ? (prompt('메모 (선택: 예 "10/5 200kg 발주")', '') || '') : '';
    await api('/api/inventory/forecast/check', {method: 'PUT', body: {item: cb.dataset.chk, checked: cb.checked, memo}});
    renderInventory();
  });
  $$('[data-link]').forEach(sel => sel.onchange = async () => {
    if (!sel.value) return;
    await api('/api/inventory/item-links', {method: 'PUT', body: {name: sel.dataset.link, item: sel.value === '__none__' ? '' : sel.value}});
    toast('연결했습니다.'); renderInventory();
  });
}

async function renderInventory() {
  const iv = state.inv ||= {tab: 'stock', q: ''};
  if (iv.tab === 'fc') return renderForecast(iv);
  const d = await api('/api/inventory');
  const today = d.today, soon = l => l.expiry && /^\d{4}/.test(l.expiry) && (new Date(l.expiry) - new Date(today)) / 864e5 <= 180;
  const admin = state.me.role === 'admin';
  const tools = admin ? `<button class="btn" id="invSet">⚙ 자동 업로드</button><button class="btn primary" id="invUp">엑셀 올리기</button>` : '';
  if (!d.lots.length) {
    $('#main').innerHTML = `<div class="card"><div class="row"><h3 style="margin:0">📦 재고</h3><span class="spacer"></span>${tools}</div>
      <div class="empty">${admin ? '나스 창고관리 폴더의 재고 엑셀을 올려 주세요. ⚙ 자동 업로드를 설정하면 매일 자동으로 들어옵니다.' : '아직 재고 엑셀이 올라오지 않았습니다.'}</div></div>`;
    if (admin) { $('#invUp').onclick = () => openInvUpload(renderInventory); $('#invSet').onclick = openInvSettings; }
    return;
  }
  const has = l => (l.stock_qty || 0) > 0.001;
  const filt = {stock: l => has(l) && !isDead(l), soon: l => has(l) && soon(l), dead: l => has(l) && isDead(l), all: () => true}[iv.tab];
  const ql = iv.q.toLowerCase();
  const match = l => !ql || [l.item, l.cas, l.lot_no, l.origin, l.location, l.bat_no].some(v => (v || '').toLowerCase().includes(ql));
  const groups = {};
  d.lots.filter(l => filt(l) && match(l)).forEach(l => (groups[l.item] ||= []).push(l));
  const rows = Object.entries(groups).map(([item, lots]) => {
    const stockLots = lots.filter(has);
    const exps = stockLots.map(l => l.expiry).filter(e => /^\d{4}-/.test(e || '')).sort();
    return {item, lots, qty: sum(stockLots.map(l => l.stock_qty || 0)), amt: sum(stockLots.map(l => l.stock_amt || 0)),
            exp: exps[0] || '', last: lots.map(l => l.last_ship || '').sort().pop() || '',
            loc: [...new Set(stockLots.map(l => l.location).filter(Boolean))].join(', ')};
  }).sort((a, b) => a.item.localeCompare(b.item));
  const live = d.lots.filter(l => has(l) && !isDead(l));
  const cnt = {stock: live.length, soon: d.lots.filter(l => has(l) && soon(l)).length, dead: d.lots.filter(l => has(l) && isDead(l)).length, all: d.lots.length};
  $('#main').innerHTML = `<div class="card">
    <div class="row" style="margin-bottom:4px"><h3 style="margin:0">📦 재고</h3><span class="spacer"></span>${tools}</div>
    <div style="margin-bottom:10px">${invMetaLine(d.meta)}</div>
    <div class="stats stats4">
      <div class="stat" style="cursor:default"><span class="muted">재고 있는 품목</span><b>${new Set(live.map(l => l.item)).size}개</b></div>
      <div class="stat" style="cursor:default"><span class="muted">재고 로트</span><b>${live.length}개</b></div>
      ${d.can_cost ? `<div class="stat" style="cursor:default"><span class="muted">재고금액 (원가)</span><b>${krw(sum(live.map(l => l.stock_amt || 0)))}원</b></div>` : ''}
      <div class="stat" data-goto="soon"><span class="muted">소비기한 6개월 이내</span><b style="color:#b45309">${cnt.soon}개</b></div>
    </div>
    <div class="tabs"><button data-t="stock">재고 있음 (${cnt.stock})</button><button data-t="soon">소비기한 임박 (${cnt.soon})</button><button data-t="dead">불용·폐기 (${cnt.dead})</button><button data-t="all">전체 로트 (${cnt.all})</button><button data-t="fc">📈 판매 예상</button></div>
    <div class="row" style="margin-bottom:10px"><input id="invQ" placeholder="품목 / CAS / 재고번호 / Origin / 위치" value="${esc(iv.q)}" style="max-width:300px"><span class="muted">${rows.length}품목</span></div>
    ${rows.length ? `<div class="mlist">${rows.map(r => `<div class="mrow" data-item="${esc(r.item)}">
        <div class="l1"><b>${esc(r.item)}</b><span class="amt">${kg(r.qty)} kg</span></div>
        <div class="l2"><span>로트 ${r.lots.length}</span>${r.loc ? `<span>${esc(r.loc)}</span>` : ''}${d.can_cost && r.amt ? `<span>${krw(r.amt)}원</span>` : ''}${r.exp ? expTag(r.exp, today) : ''}</div></div>`).join('')}</div>
      <div class="qscroll dtable"><table><thead><tr><th>품목</th><th style="text-align:right">재고량(kg)</th>${d.can_cost ? '<th style="text-align:right">재고금액</th>' : ''}<th style="white-space:nowrap">로트</th><th>위치</th><th style="white-space:nowrap">가장 빠른 소비기한</th><th style="white-space:nowrap">최근 출고</th></tr></thead><tbody>
      ${rows.map(r => `<tr data-item="${esc(r.item)}"><td class="title">${esc(r.item)}</td><td class="money">${kg(r.qty)}</td>${d.can_cost ? `<td class="money">${r.amt ? won(r.amt) : '-'}</td>` : ''}
        <td>${r.lots.length}</td><td><small>${esc(r.loc)}</small></td><td style="white-space:nowrap">${expTag(r.exp, today)}</td><td style="white-space:nowrap"><small>${esc(r.last)}</small></td></tr>`).join('')}
      </tbody></table></div>` : '<div class="empty">해당하는 재고가 없습니다.</div>'}
  </div>`;
  $$('.tabs button').forEach(b => { b.classList.toggle('active', b.dataset.t === iv.tab); b.onclick = () => { iv.tab = b.dataset.t; renderInventory(); }; });
  $$('[data-goto]').forEach(b => b.onclick = () => { iv.tab = b.dataset.goto; renderInventory(); });
  if (admin) { $('#invUp').onclick = () => openInvUpload(renderInventory); $('#invSet').onclick = openInvSettings; }
  let timer;
  $('#invQ').oninput = e => { clearTimeout(timer); timer = setTimeout(() => { iv.q = e.target.value; renderInventory().then(() => { const i = $('#invQ'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }); }, 300); };
  $$('[data-item]').forEach(el => el.onclick = () => openInvItem(groups[el.dataset.item], d.can_cost, today));
}

function openInvItem(lots, canCost, today) {
  const l0 = lots[0];
  openModal(`<h2>${esc(l0.item)}</h2>
    <div class="muted">${[l0.cas && 'CAS ' + l0.cas, l0.fema && 'FEMA ' + l0.fema].filter(Boolean).map(esc).join(' · ')}</div>
    ${lots.map(l => `<div class="ec-box">
      <div class="row"><b>${esc(l.lot_no || '(재고번호 없음)')}</b>${l.kind ? `<span class="tag p-low">${esc(l.kind)}</span>` : ''}<span class="spacer"></span><b>${kg(l.stock_qty)} kg</b></div>
      <div class="muted" style="font-size:12px;line-height:1.7">
        ${[l.location && '위치 ' + l.location, l.info, l.origin && 'Origin ' + l.origin, l.packing && 'Packing ' + l.packing, l.bat_no && 'Bat ' + l.bat_no,
           l.customs_date && '통관 ' + l.customs_date, l.import_qty != null && '수입 ' + kg(l.import_qty) + 'kg', l.transport].filter(Boolean).map(esc).join(' · ')}
        <br>소비기한 ${expTag(l.expiry, today) || '-'}
        ${canCost ? `<br>원가 <b>${l.cost_krw ? won(l.cost_krw) + '원/kg' : '-'}</b>${l.cost_est === 1 ? ' (외화×환율로 계산)' : l.cost_est === 2 ? ' <span class="tag p-high">원가 없음 → 같은 품목 최근 원가 참고</span>' : ''}${l.cost_fx ? ` · 외화 ${l.cost_fx}${l.rate ? ' × ' + l.rate : ''}` : ''}${l.stock_amt ? ` · 재고금액 ${won(l.stock_amt)}원` : ''}` : ''}
        ${l.order_note ? `<br>발주: ${esc(l.order_note)}` : ''}
      </div>
      ${l.ship_count ? `<a href="#" data-lot="${l.id}" style="font-size:13px">출고 기록 ${l.ship_count}건 보기</a><div class="lot-ships"></div>` : '<div class="muted" style="font-size:12px">출고 기록 없음</div>'}
    </div>`).join('')}
    <div class="actions"><button class="btn primary" data-close>닫기</button></div>`, bg => {
    bg.firstElementChild.classList.add('wide');
    $$('[data-lot]', bg).forEach(a => a.onclick = async e => {
      e.preventDefault();
      const box = a.nextElementSibling;
      if (box.innerHTML) { box.innerHTML = ''; return; }
      const r = await api(`/api/inventory/lot/${a.dataset.lot}`);
      box.innerHTML = `<div class="qscroll"><table class="an-table" style="margin-top:6px"><thead><tr><th>출고일</th><th>거래처</th><th class="num">출고량</th></tr></thead><tbody>

// ===================================================== 💰 이익 분석 (재고 엑셀 출고 기록 × 원가)
function openLedgerUpload(after) {
  const y0 = new Date().getFullYear();
  openModal(`<h2>💰 매입매출장(일계장) 올리기</h2>
    <div class="muted" style="font-size:13px;line-height:1.6">일계장 엑셀(xls/xlsx)의 <b>매입매출장</b> 시트를 읽습니다. <b>이알씨·켐코스는 따로</b> 보관되고, 같은 회사·같은 연도는 <b>파일 이름 날짜가 가장 최근인 것</b>으로 바뀝니다.
      <br>여러 파일을 한꺼번에 골라도 됩니다 (Ctrl+A) — 회사마다 가장 최근 파일만 남습니다.</div>
    <label>엑셀 파일</label><input type="file" id="ldFile" accept=".xls,.xlsx,.xlsm" multiple>
    <label>연도 <small class="muted">(시트 제목의 "2026년도"를 자동으로 읽음)</small></label>
    <select id="ldYear"><option value="0">자동</option>${[0, 1, 2, 3, 4, 5].map(k => `<option>${y0 - k}</option>`).join('')}</select>
    <div id="ldPrev" class="muted" style="margin-top:8px;max-height:40vh;overflow:auto"></div><div class="err"></div>
    <div class="actions"><button class="btn" data-close>닫기</button><button class="btn primary" id="ldGo" disabled>올리기</button></div>`, (bg, close) => {
    const fdate = f => { const m = f.name.match(/(20\d{2})[.\-_ ]?(\d{1,2})[.\-_ ]?(\d{1,2})(?!\d)/); return m ? `${m[1]}${m[2].padStart(2, '0')}${m[3].padStart(2, '0')}` : '0'; };
    const files = () => [...$('#ldFile', bg).files].sort((x, y) => fdate(x).localeCompare(fdate(y)));   // 옛날 것부터 → 최신이 마지막에 남음
    const send = async (file, dry) => {
      const fd = new FormData(); fd.append('file', file);
      const res = await fetch(`/api/ledger/upload?dry_run=${dry}&year=${$('#ldYear', bg).value}`, {method: 'POST', headers: {Authorization: 'Bearer ' + state.token}, body: fd});
      const data = await res.json();
      if (!res.ok) throw new Error(`${file.name}: ${data.detail || '업로드 실패'}`);
      return data;
    };
    $('#ldFile', bg).onchange = $('#ldYear', bg).onchange = async () => {
      const fs = files(); if (!fs.length) return;
      $('.err', bg).textContent = ''; $('#ldGo', bg).disabled = true; $('#ldPrev', bg).textContent = '읽는 중…';
      const lines = [];
      for (const f of fs) {
        try { const r = await send(f, true); lines.push(`${esc(f.name)} — <b>${esc(r.company || '회사 ?')}</b> ${r.year}년 ${r.rows}줄 (마지막 ${esc(r.last)}) · 매출 ${krw(r.sales)}원`); }
        catch (err) { lines.push(`<span class="down">${esc(err.message)}</span>`); }
      }
      $('#ldPrev', bg).innerHTML = lines.join('<br>');
      $('#ldGo', bg).disabled = false;
    };
    $('#ldGo', bg).onclick = async () => {
      $('#ldGo', bg).disabled = true;
      const done = [], skipped = [];
      for (const f of files()) {
        try { const r = await send(f, false); (r.skipped ? skipped : done).push(`${r.company || ''} ${f.name}`); }
        catch (err) { $('.err', bg).textContent = err.message; }
      }
      close(); toast(`반영 ${done.length}개${skipped.length ? `, 더 옛날 파일이라 건너뜀 ${skipped.length}개` : ''}`); after && after();
    };
  });
}

      <br>⚙ 자동 업로드에서 은행 거래내역 폴더를 정하면 그 폴더에 저장한 최신 파일이 매일 자동으로 올라갑니다.</div>

      ${open[m.month] ? `<tr><td colspan="${co.length + 5}" style="background:#fafafa;white-space:normal"><table style="width:auto;min-width:70%"><thead><tr><th>거래처</th><th class="num">일계장</th><th class="num">거래명세서</th><th class="num">차이</th><th class="num">줄 수 (일계장/명세서)</th></tr></thead><tbody>
        ${m.diffs.map(x => `<tr data-cc="${esc(x.name)}" data-cmo="${m.month}" style="cursor:pointer"><td>${esc(x.name)}${x.excluded ? ' <span class="tag">관계사</span>' : ''}</td><td class="num">${won(x.ledger)}</td><td class="num">${won(x.statements)}</td>
          <td class="num ${x.diff ? 'down' : ''}">${x.diff > 0 ? '+' : ''}${won(x.diff)}</td><td class="num">${x.ledger_lines} / ${x.st_lines}</td></tr>`).join('') || '<tr><td colspan="5" class="empty">거래처별로 다 맞습니다. 👍</td></tr>'}
        </tbody></table></td></tr>` : ''}`; }).join('')}
    <tr><td><b>합계</b></td>${co.map(c => `<td class="num"><b>${man(sum(d.months.map(m => m.by_company[c] || 0)))}</b></td>`).join('')}<td class="num"><b>${man(sum(d.months.map(m => m.ledger)))}</b></td><td class="num"><b>${man(sum(d.months.map(m => m.statements)))}</b></td>
      <td class="num"><b>${man(sum(d.months.map(m => m.ledger - m.statements)))}</b></td><td></td></tr>
    </tbody></table></div>
    <div class="muted" style="font-size:12px;margin-top:4px">단위: 만원 · 차이 = 일계장 − 거래명세서 (+ 면 거래명세서에 없는 매출) · 월을 누르면 거래처별, 거래처를 누르면 줄 단위로 비교합니다.</div>`;
  $$('[data-cm]', box).forEach(tr => tr.onclick = () => { open[tr.dataset.cm] = !open[tr.dataset.cm]; drawLedgerCheck(year); });
  $$('[data-cc]', box).forEach(tr => tr.onclick = async () => {
    const r = await api(`/api/ledger/check?year=${year}&month=${tr.dataset.cmo}&customer=${encodeURIComponent(tr.dataset.cc)}`);

    openModal(`<h2>${esc(tr.dataset.cc)} <small class="muted">${year}년 ${tr.dataset.cmo}월</small></h2>
      <div class="grid2" style="align-items:start">
        <div><b>일계장</b> <small class="muted">${L.ledger.length}줄 · ${won(sum(L.ledger.map(x => x.sales)))}원</small>
          <div class="qscroll" style="max-height:55vh;overflow:auto"><table class="an-table"><thead><tr><th>날짜</th><th>품목</th><th class="num">수량</th><th class="num">매출</th></tr></thead><tbody>
          ${L.ledger.map(x => `<tr><td>${esc(x.date.slice(5))}<br><small class="muted">${esc(x.company)}</small></td><td>${esc(x.item)}</td><td class="num">${kg(x.qty)}</td><td class="num">${won(x.sales)}</td></tr>`).join('') || '<tr><td colspan="4" class="empty">없음</td></tr>'}</tbody></table></div></div>
        <div><b>거래명세서</b> <small class="muted">${L.statements.length}줄 · ${won(sum(L.statements.map(x => x.sales)))}원</small>
          <div class="qscroll" style="max-height:55vh;overflow:auto"><table class="an-table"><thead><tr><th>날짜</th><th>품목</th><th class="num">수량</th><th class="num">공급가액</th></tr></thead><tbody>
          ${L.statements.map(x => `<tr data-open-doc="${x.id}" style="cursor:pointer"><td>${esc(x.date.slice(5))}<br><small class="muted">${esc(x.no)}</small></td><td>${esc(x.item)}</td><td class="num">${kg(x.qty)}</td><td class="num">${won(x.sales)}</td></tr>`).join('') || '<tr><td colspan="4" class="empty">없음</td></tr>'}</tbody></table></div></div>
      </div>
      <div class="actions"><span class="spacer"></span><button class="btn primary" data-close>닫기</button></div>`, (bg, close) => {
      bg.firstElementChild.classList.add('wide');

    });

}

// ---- 🧮 원가 체크: 일계장 매입단가 ↔ 수입 통관 원가계산서 수입단가(단가+통관비, 원/kg)
async function drawCostCheck(year) {
  const box = $('#pfCheck'); if (!box) return;
  const cc = state.cc ||= {tol: 1, miss: false};
  const d = await api(`/api/costs/check?year=${year}&tol=${cc.tol}`);
  box.classList.remove('muted');
  const pct = v => `${v > 0 ? '+' : ''}${v.toFixed(1)}%`;
  box.innerHTML = `<div class="row" style="margin-bottom:6px;gap:8px"><span class="muted" style="font-size:13px">원가계산서 <b>${d.sheets}</b>개 · 품목 ${d.items}개${d.first ? ` · 통관 ${esc(d.first)} ~ ${esc(d.last)}` : ''}</span>
      <span class="spacer"></span><span class="muted" style="font-size:12px">차이</span><select id="ccTol" style="width:auto">${[0.5, 1, 3, 5, 10].map(v => `<option value="${v}" ${v === cc.tol ? 'selected' : ''}>${v}% 이상</option>`).join('')}</select>
      <button class="btn sm primary" id="ccMake">✏ 원가계산서 만들기</button><label class="btn sm" style="margin:0">🧮 원가계산서 올리기<input type="file" id="ccUp" accept=".xls,.xlsx" multiple hidden></label></div>
    <div class="muted" style="font-size:12px;margin-bottom:8px;line-height:1.6">일계장 줄마다 품목·매입처(공급사)·통관일로 원가계산서를 찾아 <b>매입단가 ↔ 수입단가(단가+통관비, 원/kg)</b>를 비교합니다.
      매입처에 날짜(예: LYS 260915)가 있으면 그 통관 건, 없으면 같은 공급사의 판매일 전 1년 안 가장 최근 통관 건과 비교합니다(<i>추정</i>). 관계사 넘김은 뺍니다.
      <br>맞음 <b>${d.ok}</b>줄 · <span class="${d.n_diff ? 'down' : ''}">다름 <b>${d.n_diff}</b>줄</span> · 원가계산서 없음 ${d.n_missing}줄</div>
    <div class="qscroll" style="max-height:520px;overflow:auto"><table class="an-table"><thead><tr><th>날짜</th><th>품목</th><th>매출처</th><th>매입처</th><th class="num">수량</th><th class="num">일계장 매입단가</th><th class="num">원가계산서</th><th class="num">차이</th><th class="num">금액 차이</th><th>원가계산서</th></tr></thead><tbody>
      ${d.diff.map(x => `<tr><td>${esc(x.date.slice(5))}<br><small class="muted">${esc(x.company)}</small></td><td>${esc(x.item)}</td><td>${esc(x.customer)}</td><td>${esc(x.supplier)}</td><td class="num">${kg(x.qty)}</td>
        <td class="num">${won(x.buy_price)}</td><td class="num">${won(x.landed)}</td><td class="num ${Math.abs(x.pct) >= 3 ? 'down' : ''}"><b>${pct(x.pct)}</b></td><td class="num">${won(x.amount)}</td>
        <td><small>${esc(x.cost_supplier)} ${esc(x.customs_date)} 통관${x.exact ? '' : ' <i class="muted">추정</i>'}<br><span class="muted">${esc(x.sheet)}</span></small></td></tr>`).join('')
        || `<tr><td colspan="10" class="empty">${d.sheets ? '원가계산서와 다른 매입단가가 없습니다. 👍' : '아직 올린 원가계산서가 없습니다. 🧮 원가계산서 올리기로 원가계산 폴더의 파일을 한꺼번에(Ctrl+A) 올려 주세요.'}</td></tr>`}
    </tbody></table></div>
    ${d.n_missing ? `<details style="margin-top:10px" ${cc.miss ? 'open' : ''} id="ccMiss"><summary style="cursor:pointer;font-size:13px">원가계산서를 못 찾은 줄 ${d.n_missing}개 <small class="muted">(매입 금액 큰 순)</small></summary>
      <div class="qscroll" style="max-height:400px;overflow:auto"><table class="an-table"><thead><tr><th>날짜</th><th>품목</th><th>매출처</th><th>매입처</th><th class="num">수량</th><th class="num">매입단가</th></tr></thead><tbody>
      ${d.missing.slice().sort((a, b) => b.buy_price * b.qty - a.buy_price * a.qty).slice(0, 300).map(x => `<tr><td>${esc(x.date.slice(5))}</td><td>${esc(x.item)}</td><td>${esc(x.customer)}</td><td>${esc(x.supplier)}</td><td class="num">${kg(x.qty)}</td><td class="num">${won(x.buy_price)}</td></tr>`).join('')}
      </tbody></table></div></details>` : ''}`;
  $('#ccTol').onchange = e => { cc.tol = +e.target.value; drawCostCheck(year); };
  $('#ccMake').onclick = () => openCostMake(() => drawCostCheck(year));
  if ($('#ccMiss')) $('#ccMiss').ontoggle = e => { cc.miss = e.target.open; };
  $('#ccUp').onchange = async e => {
    const files = [...e.target.files]; let ok = 0; const errs = [];
    for (const [i, f] of files.entries()) {
      box.querySelector('.muted').textContent = `올리는 중… ${i + 1}/${files.length} ${f.name}`;
      const fd = new FormData(); fd.append('file', f);
      const res = await fetch('/api/costs/upload', {method: 'POST', headers: {Authorization: 'Bearer ' + state.token}, body: fd});
      if (res.ok) ok++; else errs.push((await res.json()).detail || f.name);
    }
    toast(`원가계산서 ${ok}개 반영${errs.length ? `, 못 읽음 ${errs.length}개` : ''}`);
    if (errs.length) alert('못 읽은 파일:\n' + errs.slice(0, 20).join('\n'));
    drawCostCheck(year);
  };
}

// ---- ✏ 원가계산서 만들기 (받은 원가계산서와 같은 계산: 원 단위 올림, 통관수수료는 수량 비율로 나눔)

      <td style="width:90px"><input name="unit_fx" class="num" inputmode="decimal" value="${it.unit_fx || ''}"></td><td style="width:100px"><input name="duty" class="num" inputmode="decimal" value="${it.duty || ''}" placeholder="0"></td>
      <td style="width:90px"><input name="stamp_food" class="num" inputmode="decimal" placeholder="0"></td><td style="width:90px"><input name="stamp_chem" class="num" inputmode="decimal" placeholder="0"></td>

  const feeRows = names => names.map(n => `<div class="row" style="gap:6px;margin:2px 0"><input name="fname" value="${esc(n)}" style="max-width:200px"><input name="famt" class="num" inputmode="decimal" placeholder="0" style="max-width:140px"></div>`).join('');

      계산: 단가(원/kg) = 외화 단가 × 송금환율 · 통관수수료는 수량(kg) 비율로 나눔 · 통관금액(원/kg) = (관세+통관수수료+인지대) ÷ 수량 · 모두 원 단위 올림</div>
    <div class="row" style="gap:8px;margin-bottom:6px"><label class="btn sm" style="margin:0">📎 정산서·청구서 PDF로 채우기<input type="file" id="cmPdf" accept=".pdf,.jpg,.jpeg,.png,.xls,.xlsx" multiple hidden></label>
      <span class="muted" id="cmPdfNote" style="font-size:12px">관세사 정산서·청구서·수입신고필증·세금계산서 묶음(스캔 PDF도)을 올리면 AI가 읽어 아래 칸을 채웁니다.</span></div>
    <form autocomplete="off"><div class="grid2">
      <div><label>회사</label><select name="company"><option>이알씨</option><option>켐코스</option></select></div>
      <div><label>입고예정에서 불러오기 <small class="muted">(최근 90일)</small></label><select id="cmShip"><option value="">— 고르기 —</option>${def.shipments.map((x, i) => `<option value="${i}">${esc((x.cs_cleared_at || x.eta || '').slice(0, 10))} · ${esc(x.supplier || '')} · ${esc(x.item)} ${x.qty ? fmtQty(x.qty) + (x.unit || '') : ''}</option>`).join('')}</select></div>
      <div><label>공급사 (○○社) *</label><input name="supplier" required placeholder="예: Fengle"></div>
      <div><label>운송 / INVOICE NO.</label><div class="row" style="flex-wrap:nowrap"><select name="mode" style="max-width:90px"><option>Sea</option><option>Air</option><option>Courier</option></select><input name="invoice" placeholder="INVOICE NO."></div></div>
      <div><label>송금일 · 송금환율 *</label><div class="row" style="flex-wrap:nowrap"><input type="date" name="remit_date" required><input name="remit_rate" class="num" inputmode="decimal" placeholder="1467.13" required style="max-width:110px"></div></div>
      <div><label>통화 · 송금 메모</label><div class="row" style="flex-wrap:nowrap"><select name="currency" style="max-width:90px"><option>USD</option><option>EUR</option><option>GBP</option><option>JPY</option><option>CNY</option><option>CHF</option></select><input name="remit_note" placeholder="사전 송금 ok / 사후 송금 ok"></div></div>
      <div><label>통관일 · 통관 기준환율 *</label><div class="row" style="flex-wrap:nowrap"><input type="date" name="customs_date" required><input name="customs_rate" class="num" inputmode="decimal" placeholder="1477.5" style="max-width:110px"></div></div>
      <div><label>발신 담당자</label><input name="sender" placeholder="예: 유경아"></div>
    </div>
    <label>품목</label><div class="qscroll"><table><thead><tr><th>품목</th><th>수량(kg)</th><th>단가(외화/kg)</th><th>관세(원)</th><th>식품검역인지대</th><th>화학물질인지대</th><th style="text-align:right">통관금액/kg</th><th style="text-align:right">수입단가</th><th></th></tr></thead><tbody id="cmItems">${itemRow()}</tbody></table></div>
    <button type="button" class="btn sm" id="cmAdd">+ 품목 추가</button>
    <label>통관수수료 내역 <small class="muted">(정산서·청구서 금액, 원)</small></label><div id="cmFees">${feeRows(def.fees)}</div><button type="button" class="btn sm" id="cmFeeAdd">+ 항목 추가</button>
    <div id="cmSum" style="margin-top:10px;font-size:14px"></div><div class="err"></div>
    <div class="actions"><button type="button" class="btn" data-close>닫기</button><button type="button" class="btn" id="cmSave">💾 저장만</button><button type="button" class="btn primary" id="cmGo">💾 저장 + 엑셀 받기</button></div></form>`, (bg, close) => {
    bg.firstElementChild.classList.add('wide');
    const f = $('form', bg), tb = $('#cmItems', bg);
    const body = () => ({company: f.company.value, supplier: f.supplier.value, mode: f.mode.value, invoice: f.invoice.value, currency: f.currency.value,
      remit_date: f.remit_date.value, remit_rate: numVal(f.remit_rate.value), remit_note: f.remit_note.value, customs_date: f.customs_date.value,
      customs_rate: numVal(f.customs_rate.value), sender: f.sender.value,
      items: $$('tr', tb).map(tr => ({item: $('[name=item]', tr).value, qty: numVal($('[name=qty]', tr).value), unit_fx: numVal($('[name=unit_fx]', tr).value),
        duty: numVal($('[name=duty]', tr).value), stamp_food: numVal($('[name=stamp_food]', tr).value), stamp_chem: numVal($('[name=stamp_chem]', tr).value)})).filter(i => i.item.trim() && i.qty),
      fees: $$('#cmFees .row', bg).map(r => ({name: $('[name=fname]', r).value, amount: numVal($('[name=famt]', r).value)})).filter(x => x.name.trim() && x.amount)});
    let timer;
    const calc = () => { clearTimeout(timer); timer = setTimeout(async () => {
      const b = body(); $('.err', bg).textContent = '';
      if (!b.items.length || !b.remit_rate || !b.remit_date || !b.customs_date) { $('#cmSum', bg).innerHTML = '<span class="muted">품목·수량·단가와 송금일·환율·통관일을 넣으면 계산됩니다.</span>'; return; }
      try {
        const r = await api('/api/costs/make', {method: 'POST', body: b});
        const live = $$('tr', tb).filter(tr => $('[name=item]', tr).value.trim() && numVal($('[name=qty]', tr).value));
        live.forEach((tr, i) => { const x = r.rows[i]; if (!x) return; const c = $$('.calc', tr); c[0].textContent = won(x.per_kg); c[1].innerHTML = `<b>${won(x.landed)}</b>`; });
        $('#cmSum', bg).innerHTML = `문서번호 <b>${esc(r.doc_no)}</b> · 송금 ${won(r.amount_krw)}원 · 관세 ${won(r.duty)}원 · 통관수수료 ${won(r.fee_total)}원 → <b>납품 총금액 ${won(r.total)}원</b> (부가세 포함 ${won(r.total_vat)}원)<br><small class="muted">${esc(r.filename)}</small>`;
      } catch (err) { $('.err', bg).textContent = err.message; }
    }, 300); };
    f.addEventListener('input', calc); f.addEventListener('change', calc);
    tb.addEventListener('click', e => { if (e.target.closest('[data-x]')) { e.target.closest('tr').remove(); if (!$('tr', tb)) tb.insertAdjacentHTML('beforeend', itemRow()); calc(); } });
    $('#cmAdd', bg).onclick = () => tb.insertAdjacentHTML('beforeend', itemRow());
    $('#cmFeeAdd', bg).onclick = () => $('#cmFees', bg).insertAdjacentHTML('beforeend', feeRows(['']));
    f.company.onchange = async () => { def = await api(`/api/costs/defaults?company=${encodeURIComponent(f.company.value)}`); $('#cmFees', bg).innerHTML = feeRows(def.fees); calc(); };
    $('#cmShip', bg).onchange = e => {
      const x = def.shipments[+e.target.value]; if (!x) return;
      if (x.supplier && !f.supplier.value) f.supplier.value = x.supplier;
      if (x.cs_cleared_at || x.eta) f.customs_date.value = (x.cs_cleared_at || x.eta).slice(0, 10);
      const tr = $$('tr', tb).find(t => !$('[name=item]', t).value) || (tb.insertAdjacentHTML('beforeend', itemRow()), $$('tr', tb).pop());
      $('[name=item]', tr).value = x.item; if (x.qty) $('[name=qty]', tr).value = x.qty;
      calc();
    };
    const send = async dl => {
      if (!f.reportValidity()) return;
      try {
        if (!dl) { await api('/api/costs/make?save=1', {method: 'POST', body: body()}); close(); toast('원가계산서를 저장했습니다 (원가 체크·일계장에 반영).'); after && after(); return; }
        const res = await fetch('/api/costs/make?save=1&download=1', {method: 'POST', headers: {Authorization: 'Bearer ' + state.token, 'Content-Type': 'application/json'}, body: JSON.stringify(body())});
        if (!res.ok) throw new Error((await res.json()).detail || '만들지 못했습니다.');
        const name = decodeURIComponent((res.headers.get('Content-Disposition') || '').split("''")[1] || '원가계산.xlsx');
        const a = document.createElement('a'); a.href = URL.createObjectURL(await res.blob()); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        close(); toast('저장하고 엑셀을 받았습니다.'); after && after();
      } catch (err) { $('.err', bg).textContent = err.message; }
    };
    $('#cmPdf', bg).onchange = async e => {
      const files = [...e.target.files]; if (!files.length) return;

        const norm = x => String(x || '').toLowerCase().replace(/[^a-z0-9가-힣]/g, '');
        for (const fe of d.fees || []) {
          const hit = rows.find(r => norm($('[name=fname]', r).value) === norm(fe.name) && !$('[name=famt]', r).value);

        }
        note.innerHTML = `✅ 읽었습니다${d.bl_no ? ` (B/L ${esc(d.bl_no)})` : ''} — <b>숫자를 한 번 확인하세요.</b>${d.notes ? ' ' + esc(d.notes) : ''}${!d.remit_rate ? ' <span class="down">송금 환율이 서류에 없어 신고 환율을 넣었습니다.</span>' : ''}`;
        calc();
      } catch (err) { note.textContent = ''; $('.err', bg).textContent = err.message; }
      e.target.value = '';
    };
    $('#cmSave', bg).onclick = () => send(false);
    $('#cmGo', bg).onclick = () => send(true);
  });
}

// ===================================================== 매출(납품) 분석
const krw = v => {  // 축/요약용 짧은 금액
  const a = Math.abs(v);
  if (a >= 1e8) return (v / 1e8).toFixed(a >= 1e10 ? 0 : 1).replace(/\.0$/, '') + '억';
  if (a >= 1e4) return Math.round(v / 1e4).toLocaleString('ko-KR') + '만';
  return Math.round(v).toLocaleString('ko-KR');
};
const man = v => v ? Math.round(v / 1e4).toLocaleString('ko-KR') : '-';   // 표: 만원 단위
const sum = a => a.reduce((x, y) => x + y, 0);
function deltaHtml(cur, prev) {
  if (!prev) return cur ? '<span class="muted">신규</span>' : '<span class="muted">-</span>';
  const r = (cur - prev) / prev * 100;
  return r >= 0 ? `<span class="up">▲ ${r.toFixed(1)}%</span>` : `<span class="down">▼ ${Math.abs(r).toFixed(1)}%</span>`;
}
function niceMax(v) {
  if (v <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v))), n = v / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
}

// 꺾은선 (최대 3계열) + 십자선 툴팁
function lineChart(box, labels, series) {
  const W = Math.max(box.clientWidth, 320), H = box.clientWidth < 600 ? 220 : 280, L = 56, R = 64, T = 14, B = 28, iw = W - L - R, ih = H - T - B;
  const max = niceMax(Math.max(1, ...series.flatMap(s => s.values.filter(v => v != null))));
  const x = i => L + (labels.length === 1 ? iw / 2 : i * iw / (labels.length - 1)), y = v => T + ih - v / max * ih;
  let g = '';
  for (let k = 0; k <= 4; k++) {
    const v = max * k / 4, yy = y(v);
    g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="var(--grid)"/><text x="${L - 8}" y="${yy + 4}" text-anchor="end" font-size="11" fill="var(--axis)">${krw(v)}</text>`;
  }
  const step = iw / labels.length < 34 ? 2 : 1;   // 좁은 화면에선 한 달 건너 표시
  labels.forEach((l, i) => { if (i % step === 0) g += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--axis)">${l}</text>`; });
  series.forEach(s => {
    const pts = s.values.map((v, i) => [i, v]).filter(([, v]) => v != null);   // 아직 오지 않은 달(null)은 그리지 않음
    g += `<path d="${pts.map(([i, v], k) => (k ? 'L' : 'M') + x(i) + ' ' + y(v)).join('')}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    pts.forEach(([i, v]) => g += `<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`);
    if (pts.length) {  // 끝 직접 라벨 (글자색은 본문색)
      const [li, lv] = pts[pts.length - 1];
      g += `<text x="${x(li) + 8}" y="${y(lv) + 4}" font-size="11" fill="var(--ink-2)">${esc(s.name)}</text>`;
    }
  });
  box.innerHTML = `<div class="viz-legend">${series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>
    <div class="viz-wrap"><svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="월별 납품금액">${g}
      <line class="xh" y1="${T}" y2="${T + ih}" stroke="var(--axis)" stroke-dasharray="3 3" visibility="hidden"/>
      <rect x="${L}" y="${T}" width="${iw}" height="${ih}" fill="transparent" class="hit"/></svg><div class="viz-tip" hidden></div></div>`;
  const svg = $('svg', box), tip = $('.viz-tip', box), xh = $('.xh', box);
  $('.hit', box).addEventListener('mousemove', e => {
    const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) * W / r.width;
    const i = Math.max(0, Math.min(labels.length - 1, Math.round((px - L) / (iw / Math.max(1, labels.length - 1)))));
    xh.setAttribute('x1', x(i)); xh.setAttribute('x2', x(i)); xh.setAttribute('visibility', 'visible');
    const [a, b] = series;
    tip.innerHTML = `<b>${labels[i]}${box.dataset.cum ? ' 누계' : ''}</b><br>` + series.map(s => `<span class="sw" style="background:${s.color}"></span>${esc(s.name)} ${s.values[i] == null ? '-' : won(s.values[i]) + '원'}${s.monthly && s.values[i] != null ? ` <span style="opacity:.7">(그 달 ${krw(s.monthly[i])})</span>` : ''}`).join('<br>')
      + (b && a.values[i] != null && b.values[i] != null ? `<br>${deltaHtml(a.values[i], b.values[i]).replace(/class="(up|down)"/, 'style="font-weight:700"')}` : '');
    tip.hidden = false;
    const tx = x(i) * r.width / W;
    tip.style.left = Math.min(tx + 12, r.width - tip.offsetWidth - 4) + 'px';
    tip.style.top = '30px';
  });
  $('.hit', box).addEventListener('mouseleave', () => { tip.hidden = true; xh.setAttribute('visibility', 'hidden'); });
}

// 막대 (1계열) + 막대별 툴팁
function barChart(box, labels, values, name) {
  const W = Math.max(box.clientWidth, 320), H = box.clientWidth < 600 ? 220 : 280, L = 56, R = 16, T = 14, B = 28, iw = W - L - R, ih = H - T - B;
  const max = niceMax(Math.max(1, ...values)), y = v => T + ih - v / max * ih;
  const slot = iw / labels.length, bw = Math.max(6, Math.min(56, slot - 2));
  let g = '';
  for (let k = 0; k <= 4; k++) {
    const v = max * k / 4, yy = y(v);
    g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="var(--grid)"/><text x="${L - 8}" y="${yy + 4}" text-anchor="end" font-size="11" fill="var(--axis)">${krw(v)}</text>`;
  }
  values.forEach((v, i) => {
    const cx = L + slot * i + slot / 2, x0 = cx - bw / 2, top = y(v), h = T + ih - top, rr = Math.min(4, h, bw / 2);
    if (h > 0) g += `<path d="M${x0} ${T + ih}V${top + rr}Q${x0} ${top} ${x0 + rr} ${top}H${x0 + bw - rr}Q${x0 + bw} ${top} ${x0 + bw} ${top + rr}V${T + ih}Z" fill="var(--series-1)"/>`;
    g += `<rect x="${L + slot * i}" y="${T}" width="${slot}" height="${ih}" fill="transparent" data-i="${i}"/>`;
    g += `<text x="${cx}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--axis)">${labels[i]}</text>`;
  });
  const li = values.length - 1;  // 마지막 막대만 값 라벨
  if (li >= 0) g += `<text x="${L + slot * li + slot / 2}" y="${y(values[li]) - 6}" text-anchor="middle" font-size="11" fill="var(--ink)">${krw(values[li])}</text>`;
  box.innerHTML = `<div class="viz-wrap"><svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(name)}">${g}</svg><div class="viz-tip" hidden></div></div>`;
  const svg = $('svg', box), tip = $('.viz-tip', box);
  $$('[data-i]', box).forEach(rc => {
    rc.addEventListener('mouseenter', () => {
      const i = +rc.dataset.i, r = svg.getBoundingClientRect();
      tip.innerHTML = `<b>${labels[i]}</b><br>${won(values[i])}원${i ? '<br>' + deltaHtml(values[i], values[i - 1]).replace(/class="(up|down)"/, 'style="font-weight:700"') + ' (전년 대비)' : ''}`;
      tip.hidden = false;
      tip.style.left = Math.min((L + slot * i + slot) * r.width / W, r.width - tip.offsetWidth - 4) + 'px';
      tip.style.top = '20px';
    });
    rc.addEventListener('mouseleave', () => tip.hidden = true);
  });
}

  const upto = Y === now.getFullYear() ? now.getMonth() + 1 : (Y === d.years[d.years.length - 1] && lastDataM ? lastDataM : 12);
  const cust = an.cust && d.customers.find(c => c.name === an.cust);
  const curM = cust ? cust.cur : d.monthly[Y], prevM = cust ? cust.prev : (d.monthly[P] || Array(12).fill(0));
  const ytd = sum(curM.slice(0, upto)), pytd = sum(prevM.slice(0, upto));

    ${exNote}
    <div class="stats stats4">
      <div class="stat" style="cursor:default"><span class="muted">${Y}년 ${upto < 12 ? `1~${upto}월` : '연간'} 납품</span><b>${krw(ytd)}원</b></div>
      <div class="stat" style="cursor:default"><span class="muted">${P}년 같은 기간</span><b>${krw(pytd)}원</b></div>
      <div class="stat" style="cursor:default"><span class="muted">전년 대비</span><b style="font-size:20px">${deltaHtml(ytd, pytd)}</b></div>

    </div>
    <div class="row" style="margin-bottom:4px"><b>${an.cust ? esc(an.cust) : '전체 거래처'}${an.mode === 'month' ? ' · 1월부터 누계' : ''}</b>

    <div id="anChart"></div>

          <td class="num"><b>${man(sum(c.cur))}</b></td><td class="num">${man(sum(c.prev))}</td><td class="num">${deltaHtml(sum(c.cur.slice(0, upto)), sum(c.prev.slice(0, upto)))}</td></tr>`).join('')}
      </tbody></table>`
    : `<table class="an-table"><thead><tr><th>거래처</th>${years.map(y => `<th class="num">${y}</th>`).join('')}<th class="num">전년 대비</th></tr></thead><tbody>
        ${yRows.map(r => `<tr data-c="${esc(r.name)}" class="${r.name === an.cust ? 'sel' : ''}"><td title="${esc(r.name)}">${esc(r.name)}</td>${r.vals.map(v => `<td class="num">${man(v)}</td>`).join('')}
          <td class="num">${r.vals.length > 1 ? deltaHtml(r.vals[r.vals.length - 1], r.vals[r.vals.length - 2]) : '-'}</td></tr>`).join('')}
      </tbody></table>`}

  </div>`;
  if (an.mode === 'month') {
    const cum = (arr, n) => { let t = 0; return arr.map((v, i) => i < n ? (t += v) : null); };
    $('#anChart').dataset.cum = '1';
    lineChart($('#anChart'), months, [
      {name: `${Y}년`, color: 'var(--series-1)', values: cum(curM, upto), monthly: curM},
      {name: `${P}년`, color: 'var(--series-2)', values: cum(prevM, 12), monthly: prevM}]);

  else barChart($('#anChart'), years.map(y => `${y}`), yearVals, '연도별 납품금액');

  $('#anYear').onchange = e => { an.year = +e.target.value; renderAnalytics(); };
  $('#anBasis').onchange = e => { an.basis = e.target.value; renderAnalytics(); };

  $('#anQ').oninput = e => { clearTimeout(timer); timer = setTimeout(() => { an.q = e.target.value; renderAnalytics().then(() => { const i = $('#anQ'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }); }, 300); };

      <div class="row" style="flex-wrap:nowrap"><small class="muted" style="white-space:nowrap">대표 이름</small>
        <select class="gCanon">${g.names.map(x => `<option ${x.name === g.canonical ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></div></div>`).join('')
      : '<div class="muted">추천할 이름이 없습니다.</div>'}
    <h3 style="margin:18px 0 6px">직접 합치기</h3>
    <div class="grid2"><div><label>대표 이름</label><input id="mCanon" list="allNames" placeholder="예: 녹원산업"></div>
      <div><label>합칠 이름 (쉼표로 구분)</label><input id="mAliases" list="allNames" placeholder="예: 녹원, 녹원상사"></div></div>
    <datalist id="allNames">${al.all_names.map(n => `<option value="${esc(n)}">`).join('')}</datalist>
    <h3 style="margin:18px 0 6px">합쳐진 거래처 (${al.merged.length})</h3>
    ${al.merged.length ? al.merged.map(m => `<div class="list-item" style="cursor:default"><div style="flex:1"><b>${esc(m.canonical)}</b><br><small class="muted">← ${m.aliases.map(esc).join(', ')}</small></div>
      <button class="btn sm danger" data-un="${esc(m.canonical)}">풀기</button></div>`).join('') : '<div class="muted">없음</div>'}
    <div class="err"></div>
    <div class="actions"><button class="btn" data-close>닫기</button><button class="btn primary" id="alSave">저장</button></div>`, (bg, close) => {
    bg.firstElementChild.classList.add('wide');
    const save = async () => {
      await api('/api/analytics/aliases', {method: 'PUT', body: {map}});
      close(); toast('저장했습니다.'); go(state.view);
    };
    $$('[data-un]', bg).forEach(b => b.onclick = async () => {
      Object.keys(map).forEach(k => { if (map[k] === b.dataset.un) delete map[k]; });
      await save();
    });
    $('#alSave', bg).onclick = async () => {
      $$('[data-g]', bg).forEach(box => {
        if (!$('.gOn', box).checked) return;
        const g = al.suggestions[+box.dataset.g], canon = $('.gCanon', box).value;
        g.names.forEach(x => { if (x.name !== canon) map[x.name] = canon; else delete map[x.name]; });
      });
      const mc = $('#mCanon', bg).value.trim();
      $('#mAliases', bg).value.split(',').map(x => x.trim()).filter(x => x && x !== mc).forEach(x => { if (mc) map[x] = mc; });
      try { await save(); } catch (err) { $('.err', bg).textContent = err.message; }
    };
  });
}
function bindExcludeEdit() {

  a.onclick = async e => {

}

    ${exNote}
    <div class="row" style="margin:6px 0 10px;gap:8px">
      <input id="pQ" list="pQList" placeholder="🔍 제품명 또는 거래처명 검색 (예: vanillin, 고려에프앤에프)" value="${esc(an.pq || '')}" style="flex:1;min-width:220px;font-size:15px;padding:10px 12px" autocomplete="off">
      <datalist id="pQList">${names.map(n => `<option value="${esc(n)}">`).join('')}</datalist>
      <button class="btn" id="pQClear" ${an.pq ? '' : 'style="display:none"'}>✕ 지우기</button></div>
    <div class="row" style="margin-bottom:8px;gap:6px">
      <button class="btn sm ${isProd ? 'primary' : ''}" data-pv="prod">제품별 (어느 거래처가 샀나)</button>
      <button class="btn sm ${!isProd ? 'primary' : ''}" data-pv="cust">거래처별 (무엇을 샀나)</button>
      <span class="spacer"></span><span class="muted" style="font-size:12px">정렬</span>
      <select id="pSort" style="width:auto"><option value="amount">${Y}년 금액</option><option value="qty">${Y}년 수량</option><option value="name">이름</option></select></div>
    <div id="pInfo" class="muted" style="font-size:12px;margin-bottom:6px"></div>
    <div class="qscroll" style="max-height:640px;overflow:auto"><table class="an-table"><thead><tr><th>${isProd ? '제품' : '거래처'}</th>
      ${years.map(y => `<th class="num">${y} 수량</th>`).join('')}<th class="num">${Y} 금액</th><th class="num">${P} 금액</th><th class="num">전년 대비</th><th class="num">${isProd ? '거래처' : '제품'} 수</th><th>마지막</th></tr></thead><tbody id="pBody"></tbody></table></div>
    <div class="muted" style="font-size:12px;margin-top:6px">· 검색은 띄어쓰기·기호·대소문자를 무시합니다. ${isProd ? '거래처' : '제품'} 이름으로 찾으면 그 ${isProd ? '거래처가 산 제품' : '제품을 산 거래처'}이 펼쳐져 강조됩니다.
      <br>· 품명의 포장 표시(예: "(25kg *4)_식")와 제품코드 숫자를 빼고 같은 제품끼리 묶습니다. 거래처는 매출분석의 제외·이름 합치기 설정을 따릅니다.</div>
  </div>`;
  const draw = () => {
    const list = isProd ? d.products : d.customers;
    const q = norm(an.pq), sortKey = an.psort || 'amount';
    const hit = n => q && norm(n).includes(q);
    const rows = list.filter(e => !q || hit(e.name) || e.by.some(b => hit(b.name)))
      .sort((a, b) => sortKey === 'name' ? a.name.localeCompare(b.name) : yv(b, Y, sortKey) - yv(a, Y, sortKey) || yv(b, P, sortKey) - yv(a, P, sortKey));
    // 검색 결과 합계 (거래처·제품 이름으로 찾았으면 그 줄만 더함)
    const tot = {};
    rows.forEach(e => {
      const parts = q && !hit(e.name) ? e.by.filter(b => hit(b.name)) : [e];
      parts.forEach(x => years.forEach(y => { const v = x.years[y] || {}; (tot[y] ||= {qty: 0, amount: 0}); tot[y].qty += v.qty || 0; tot[y].amount += v.amount || 0; }));
    });
    $('#pInfo').innerHTML = `거래명세서(발행·출고완료) 품목 기준 · ${rows.length}${isProd ? '개 제품' : '곳'}${q ? ` 검색됨 — 합계 ${years.slice(-3).map(y => `${y}년 ${kg((tot[y] || {}).qty || 0)} / ${man((tot[y] || {}).amount || 0)}만원`).join(' · ')}` : ''}
      · 줄을 누르면 ${isProd ? '거래처별' : '제품별'} 기록이 펼쳐집니다 · 금액 단위 만원${upto !== '12-31' ? ` · 전년 대비는 ${P}년 같은 기간(~${upto})과 비교` : ''}`;
    $('#pBody').innerHTML = rows.slice(0, 400).map((e, i) => {
      const subHit = q && !hit(e.name);
      return `<tr data-row="${i}" style="cursor:pointer"><td title="${esc(e.name)}"><b ${hit(e.name) ? 'style="background:#fef08a"' : ''}>${esc(e.name)}</b></td>
        ${years.map(y => `<td class="num">${yv(e, y, 'qty') ? kg(yv(e, y, 'qty')) : '-'}</td>`).join('')}
        <td class="num"><b>${man(yv(e, Y, 'amount'))}</b></td><td class="num">${man(yv(e, P, 'amount'))}</td>
        <td class="num">${deltaHtml(yv(e, Y, 'qty'), yv(e, P, 'qty'))}</td>
        <td class="num">${e.by.filter(b => (b.years[Y] || {}).qty || (b.years[P] || {}).qty).length}</td><td><small>${esc(e.last)}</small></td></tr>
        <tr class="${subHit || rows.length === 1 ? '' : 'hidden'}" data-sub="${i}"><td colspan="${years.length + 6}" style="background:var(--bg);padding:6px 10px">
          <table class="an-table" style="background:transparent"><thead><tr><th>${isProd ? '거래처' : '제품'}</th>${years.map(y => `<th class="num">${y} 수량</th>`).join('')}<th class="num">${Y} 금액</th><th class="num">${P} 금액</th><th class="num">${Y} 평균단가</th></tr></thead><tbody>
          ${e.by.slice().sort((a, b) => (hit(b.name) - hit(a.name)) || ((b.years[Y] || {}).amount || 0) - ((a.years[Y] || {}).amount || 0) || ((b.years[P] || {}).amount || 0) - ((a.years[P] || {}).amount || 0)).map(b => {
            const cy = b.years[Y] || {}, py = b.years[P] || {};
            return `<tr ${hit(b.name) ? 'style="background:#fef9c3"' : ''}><td>${esc(b.name)}</td>${years.map(y => `<td class="num">${(b.years[y] || {}).qty ? kg(b.years[y].qty) : '-'}</td>`).join('')}
              <td class="num">${man(cy.amount || 0)}</td><td class="num">${man(py.amount || 0)}</td><td class="num">${cy.qty ? won((cy.amount || 0) / cy.qty) : '-'}</td></tr>`; }).join('')}
          </tbody></table></td></tr>`; }).join('') || `<tr><td colspan="${years.length + 6}" class="empty">${q ? `'${esc(an.pq)}' 검색 결과가 없습니다.` : '거래명세서가 없습니다.'}</td></tr>`;
    $$('tr[data-row]').forEach(tr => tr.onclick = () => $(`tr[data-sub="${tr.dataset.row}"]`).classList.toggle('hidden'));
  };
  draw();
  $$('.tabs button').forEach(b => { b.classList.toggle('active', b.dataset.mode === an.mode); b.onclick = () => { an.mode = b.dataset.mode; renderAnalytics(); }; });
  $$('[data-pv]').forEach(b => b.onclick = () => { an.pv = b.dataset.pv; renderAnalytics(); });
  $('#pSort').value = an.psort || 'amount'; $('#pSort').onchange = e => { an.psort = e.target.value; draw(); };
  $('#anBasis').onchange = e => { an.basis = e.target.value; renderAnalytics(); };
  let timer;
  $('#pQ').oninput = e => { clearTimeout(timer); timer = setTimeout(() => { an.pq = e.target.value.trim(); $('#pQClear').style.display = an.pq ? '' : 'none'; draw(); }, 200); };
  $('#pQClear').onclick = () => { an.pq = ''; $('#pQ').value = ''; $('#pQClear').style.display = 'none'; draw(); $('#pQ').focus(); };
  bindExcludeEdit();
}

// 거래처 하나의 거래명세서 목록 (최근 것부터) → 누르면 그 명세서가 열림
async function openCustDocs(name) {
  const d = await api('/api/quotes/report?' + new URLSearchParams({doc_type: 'statement', canon_customer: name, group: 'customer', date_from: '', date_to: ''}));
  const docs = d.rows.flatMap(r => r.doc_list).sort((a, b) => (b.date + b.id).localeCompare(a.date + a.id));
  openModal(`<h2>📄 ${esc(name)} <small class="muted">거래명세서 ${docs.length}건</small></h2>
    <div class="qscroll" style="max-height:62vh;overflow:auto"><table class="an-table"><thead><tr><th>거래일자</th><th>거래처</th><th>품목</th><th class="num">합계</th><th>상태</th></tr></thead><tbody>
      ${docs.map(o => `<tr data-open-doc="${o.id}" style="cursor:pointer"><td>${esc(o.date)}</td><td>${esc(o.customer)}</td>
        <td>${esc(o.items[0] || '')}${o.items.length > 1 ? ` <small class="muted">외 ${o.items.length - 1}건</small>` : ''}</td><td class="money">${won(o.total)}</td><td>${qTag(o.status, 'statement')}</td></tr>`).join('')
        || '<tr><td colspan="5" class="empty">거래명세서를 찾지 못했습니다.</td></tr>'}
    </tbody></table></div>
    <div class="muted" style="font-size:12px;margin-top:6px">최근 것부터 (거래처당 최대 200건). 줄을 누르면 거래명세서가 열립니다.</div>
    <div class="actions"><span class="spacer"></span><button class="btn primary" data-close>닫기</button></div>`, (bg, close) => {
    bg.firstElementChild.classList.add('wide');
    $$('[data-open-doc]', bg).forEach(t => t.onclick = () => { close(); openQuoteView(+t.dataset.openDoc); });
  });
}

async function renderDecline(an) {
  const [d, exNote] = await Promise.all([api(`/api/analytics/decline?months=${an.months}&compare=${an.compare}&basis=${an.basis}`), excludeNote()]);
  const ql = an.q.toLowerCase(), f = r => !ql || r.name.toLowerCase().includes(ql);
  const rows = d.rows.filter(f), dormant = d.dormant.filter(f), patterns = (d.patterns || []).filter(f);
  const cycleTxt = i => i.cycle >= 300 ? `약 1년마다${i.month ? ` (보통 ${i.month}월쯤)` : ''}` : i.cycle >= 55 ? `약 ${Math.round(i.cycle / 30)}개월마다` : `약 ${i.cycle}일마다`;
  const patItem = i => `<div style="padding:3px 0"><b>${esc(i.item)}</b> <small class="muted">${cycleTxt(i)} · 보통 ${fmtQty(i.usual_qty)}${i.unit ? ' ' + esc(i.unit) : ''}씩</small><br>
      <small>마지막 구매 ${esc(i.last)} · <span class="down">예상 시기보다 ${i.late}일 늦음</span></small></div>`;
  const qty = (v, u) => `${fmtQty(v)}${u ? ' ' + esc(u) : ''}`;
  const itemLine = i => `${esc(i.name)} <span class="muted">${qty(i.before_qty, i.unit)} → </span><b>${qty(i.now_qty, i.unit)}</b>`;
  const cmpLabel = an.compare === 'previous' ? '직전 기간' : '작년 같은 기간';
  $('#main').innerHTML = `<div class="card viz">
    <div class="row" style="margin-bottom:10px"><h3 style="margin:0">📊 거래처별 납품금액</h3><span class="spacer"></span>
      <select id="dMonths" style="width:auto">${[12, 6].map(m => `<option value="${m}" ${an.months === m ? 'selected' : ''}>${m === 12 ? '최근 1년' : '최근 6개월'}</option>`).join('')}</select>
      <select id="dCmp" style="width:auto"><option value="last_year" ${an.compare === 'last_year' ? 'selected' : ''}>작년 같은 기간과 비교</option><option value="previous" ${an.compare === 'previous' ? 'selected' : ''}>직전 기간과 비교</option></select>
      <select id="anBasis" style="width:auto"><option value="supply" ${an.basis === 'supply' ? 'selected' : ''}>공급가액 기준</option><option value="total" ${an.basis === 'total' ? 'selected' : ''}>합계(VAT 포함) 기준</option></select>
      <input id="anQ" placeholder="거래처 검색" value="${esc(an.q)}" style="max-width:160px"></div>
    <div class="tabs"><button data-mode="month">월별 비교</button><button data-mode="year">연별 비교</button><button data-mode="decline">📉 감소·이탈 거래처</button><button data-mode="prod">📦 제품·거래처 판매기록</button></div>
    ${exNote}
    ${!d.ref ? '<div class="empty">거래명세서가 없습니다.</div>' : `
    <div class="muted" style="font-size:12px;margin-bottom:10px">기준일 ${esc(d.ref)} · 이번 기간 ${esc(d.cur[0])} ~ ${esc(d.cur[1])} vs ${cmpLabel} ${esc(d.cmp[0])} ~ ${esc(d.cmp[1])}</div>
    <div class="stats stats4">
      <div class="stat" style="cursor:default"><span class="muted">이번 기간 납품</span><b>${krw(d.cur_total)}원</b></div>
      <div class="stat" style="cursor:default"><span class="muted">${cmpLabel}</span><b>${krw(d.cmp_total)}원</b></div>
      <div class="stat red" data-dl="patterns" title="눌러서 거래처 보기"><span class="muted">구매 주기가 지난 거래처 ›</span><b>${(d.patterns || []).length}곳</b></div>
      <div class="stat red" data-dl="dormant" title="눌러서 거래처 보기"><span class="muted">주문이 끊긴 거래처 ›</span><b>${d.dormant.length}곳</b></div>
    </div>
    <h3 style="margin:18px 0 4px">🔔 구매 주기가 지난 품목</h3>
    <div class="muted" style="font-size:12px;margin-bottom:6px">거래처마다 품목별로 <b>평소 사가는 주기</b>(최근 5년 기록, 3번 이상 구매)를 계산해서, 그 주기가 지났는데 아직 주문이 없는 품목입니다.
      오래전에 끊긴 품목은 빼고 <b>최근에 늦어진 것</b>만 보여줍니다. 연간 거래 규모가 큰 거래처부터 나옵니다.</div>
    ${patterns.length ? `<div class="qscroll"><table class="an-table"><thead><tr><th>거래처</th><th class="num">늦어진 품목</th><th>품목 (주기 · 마지막 구매)</th><th class="num">이 품목들 연평균</th></tr></thead><tbody>
      ${patterns.map((r, k) => `<tr data-p="${k}" style="cursor:pointer;vertical-align:top"><td title="${esc(r.name)}"><b>${esc(r.name)}</b>${r.stopped ? '<br><span class="tag p-urgent">주문 끊김</span>' : ''}<br><a href="#" data-cdoc="${esc(r.name)}" style="font-size:12px">📄 명세서 보기</a></td>
        <td class="num">${r.items.length}개</td>
        <td style="white-space:normal;min-width:340px">${r.items.slice(0, 2).map(patItem).join('')}

        <td class="num">${man(r.value)}만</td></tr>`).join('')}
    </tbody></table></div>` : '<div class="empty">구매 주기가 지난 품목이 없습니다. 👍</div>'}
    <h3 style="margin:18px 0 4px">⏸ 주문이 끊긴 거래처</h3>
    <div class="muted" style="font-size:12px;margin-bottom:6px">최근 3년 주문 기록으로 계산한 <b>평소 주문 간격</b>보다 훨씬 오래(2.5배 이상, 최소 45일) 주문이 없는 거래처입니다.</div>
    ${dormant.length ? `<div class="qscroll"><table class="an-table"><thead><tr><th>거래처</th><th class="num">평소 주문 간격</th><th class="num">마지막 주문</th><th class="num">주문 없음</th><th class="num">최근 1년 납품</th><th class="num">그 전 1년</th><th class="num">변화</th></tr></thead><tbody>
      ${dormant.map(r => `<tr data-cust="${esc(r.name)}" style="cursor:pointer" title="눌러서 거래명세서 보기"><td title="${esc(r.name)}">${esc(r.name)}</td><td class="num">약 ${r.typical_gap}일마다</td><td class="num">${esc(r.last)}</td>
        <td class="num"><span class="down">${r.days}일째</span> <small class="muted">(평소의 ${r.ratio.toFixed(1)}배)</small></td>
        <td class="num">${man(r.year_amt)}만</td><td class="num">${man(r.prev_year_amt)}만</td><td class="num">${deltaHtml(r.year_amt, r.prev_year_amt)}</td></tr>`).join('')}
    </tbody></table></div>` : '<div class="empty">주문이 끊긴 거래처가 없습니다.</div>'}
    <h3 style="margin:22px 0 4px">📉 납품이 줄어든 거래처 (${an.months === 12 ? '1년' : '6개월'} 단위 비교)</h3>
    <div class="muted" style="font-size:12px;margin-bottom:6px">${cmpLabel}보다 납품금액이 줄어든 거래처를 감소액이 큰 순서로 보여줍니다. 줄을 누르면 품목별 변화를 모두 볼 수 있습니다. (단위: 만원)</div>
    ${rows.length ? `<div class="qscroll"><table class="an-table"><thead><tr><th>거래처</th><th class="num">${cmpLabel}</th><th class="num">이번 기간</th><th class="num">감소액</th><th class="num">증감률</th><th>많이 줄어든 품목</th></tr></thead><tbody>
      ${rows.map((r, k) => `<tr data-k="${k}" style="cursor:pointer"><td title="${esc(r.name)}">${esc(r.name)}</td><td class="num">${man(r.before)}</td><td class="num">${man(r.now)}</td>
        <td class="num"><b>${man(r.drop)}</b></td><td class="num">${deltaHtml(r.now, r.before)}</td>
        <td style="white-space:normal;min-width:260px;font-size:12px">${r.items.slice(0, 2).map(itemLine).join('<br>')}${r.items.length > 2 ? `<br><span class="muted">외 ${r.items.length - 2}개 품목 ▾</span>` : ''}</td></tr>
        <tr class="hidden" data-detail="${k}"><td colspan="6" style="background:#fafafa;white-space:normal">
          <table style="width:auto;min-width:60%"><thead><tr><th>품목</th><th class="num">${cmpLabel} 수량</th><th class="num">이번 수량</th><th class="num">${cmpLabel} 금액</th><th class="num">이번 금액</th></tr></thead><tbody>
          ${r.items.map(i => `<tr style="cursor:default"><td>${esc(i.name)}</td><td class="num">${qty(i.before_qty, i.unit)}</td><td class="num">${qty(i.now_qty, i.unit)}</td><td class="num">${man(i.before_amt)}</td><td class="num">${man(i.now_amt)}</td></tr>`).join('')}
          </tbody></table></td></tr>`).join('')}
    </tbody></table></div>` : '<div class="empty">납품이 줄어든 거래처가 없습니다. 👍</div>'}`}
  </div>`;
  $$('.tabs button').forEach(b => { b.classList.toggle('active', b.dataset.mode === an.mode); b.onclick = () => { an.mode = b.dataset.mode; renderAnalytics(); }; });
  $('#dMonths').onchange = e => { an.months = +e.target.value; renderAnalytics(); };
  $('#dCmp').onchange = e => { an.compare = e.target.value; renderAnalytics(); };
  $('#anBasis').onchange = e => { an.basis = e.target.value; renderAnalytics(); };
  let timer;
  $('#anQ').oninput = e => { clearTimeout(timer); timer = setTimeout(() => { an.q = e.target.value; renderAnalytics().then(() => { const i = $('#anQ'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }); }, 300); };
  bindExcludeEdit();
  $$('tr[data-k]').forEach(tr => tr.onclick = () => $(`tr[data-detail="${tr.dataset.k}"]`).classList.toggle('hidden'));
  $$('tr[data-cust]').forEach(tr => tr.onclick = () => openCustDocs(tr.dataset.cust));
  $$('[data-cdoc]').forEach(a => a.onclick = e => { e.preventDefault(); e.stopPropagation(); openCustDocs(a.dataset.cdoc); });
  // 위 숫자 칸을 누르면 그 거래처 목록 → 거래처를 누르면 거래명세서 목록 → 명세서를 누르면 열림

let ecCache = null;
async function ecMaster(reload) {

}

// 여러 단어 검색: "a4 500" → 코드/이름/규격에 모든 단어가 들어간 것
// 비교용 정규화: 대소문자·띄어쓰기·(주)/㈜/주식회사·괄호 무시
const normText = t => String(t || '').toLowerCase().replace(/\(주\)|㈜|주식회사|\(유\)|유한회사/g, '').replace(/[\s()\[\]\-_.,·]/g, '');

// 여러 단어 검색: "삼성 2공장" → 이름/코드 등에 모든 단어가 들어간 것 (띄어쓰기·(주) 무시)
function searchList(list, query, fields) {
  const words = query.split(/\s+/).map(normText).filter(Boolean);
  if (!words.length) return list.slice(0, 30);
  const out = [];
  for (const it of list) {
    const hay = normText(fields(it).join(' '));
    if (words.every(w => hay.includes(w))) { out.push(it); if (out.length >= 50) break; }
  }
  return out;
}

function attachSearch(input, search, render, pick) {
  let box = null, items = [], idx = -1;
  const close = () => { if (box) { box.remove(); box = null; } };
  const open = () => {
    items = search(input.value.trim());
    if (!box) { box = document.createElement('div'); box.className = 'sbox'; document.body.appendChild(box); }
    const r = input.getBoundingClientRect();
    box.style.left = Math.min(r.left, window.innerWidth - 330) + 'px';
    box.style.width = Math.max(r.width, 320) + 'px';
    const below = window.innerHeight - r.bottom;
    if (below < 220 && r.top > below) { box.style.top = ''; box.style.bottom = (window.innerHeight - r.top + 2) + 'px'; }
    else { box.style.bottom = ''; box.style.top = (r.bottom + 2) + 'px'; }
    idx = -1;
    box.innerHTML = items.length ? items.map((it, i) => `<div data-i="${i}">${render(it)}</div>`).join('')
      : '<div class="none">검색 결과가 없습니다. 다른 단어로 찾아보세요.</div>';
    $$('[data-i]', box).forEach(d => d.onmousedown = e => { e.preventDefault(); pick(items[+d.dataset.i]); close(); });
  };
  input.setAttribute('autocomplete', 'off');
  input.addEventListener('focus', open);
  input.addEventListener('input', open);
  input.addEventListener('blur', () => setTimeout(close, 150));
  input.addEventListener('keydown', e => {
    if (!box || !items.length) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      idx = (idx + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
      $$('[data-i]', box).forEach((d, i) => d.classList.toggle('on', i === idx));
      $$('[data-i]', box)[idx].scrollIntoView({block: 'nearest'});
    } else if (e.key === 'Enter' && idx >= 0) { e.preventDefault(); pick(items[idx]); close(); }
    else if (e.key === 'Escape') close();
  });
  const modal = input.closest('.modal-bg');
  if (modal) modal.addEventListener('scroll', close);
}
