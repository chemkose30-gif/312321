async function renderInventory() {
  const iv = state.inv ||= {tab: 'stock', q: ''};
  const d = await api('/api/inventory');
  const today = d.today, soon = l => l.expiry && /^\d{4}/.test(l.expiry) && (new Date(l.expiry) - new Date(today)) / 864e5 <= 180;
  const admin = state.me.role === 'admin';
  const tools = admin ? `<button class="btn" id="invSet">⚙ 자동 업로드</button><button class="btn primary" id="invUp">엑셀 올리기</button>` : '';
  if (!d.lots.length) {
    $('#main').innerHTML = `<div class="card"><div class="row"><h3 style="margin:0">📦 재고</h3><span class="spacer"></span>${tools}</div>
      <div class="empty">${admin ? '나스 창고관리 폴더의 재고 엑셀을 올려 주세요. ⚙ 자동 업로드를 설정하면 매일 자동으로 들어옵니다.' : '아직 재고 엑셀이 올라오지 않았습니다.'}</div></div>`;
    if (admin) { $('#invUp').onclick = () => openInvUpload(renderInventory); $('#invSet').onclick = openInvSettings; }
    return;
  }
  const has = l => (l.stock_qty || 0) > 0.001;
  const filt = {stock: l => has(l) && !isDead(l), soon: l => has(l) && soon(l), dead: l => has(l) && isDead(l), all: () => true}[iv.tab];
  const ql = iv.q.toLowerCase();
  const match = l => !ql || [l.item, l.cas, l.lot_no, l.origin, l.location, l.bat_no].some(v => (v || '').toLowerCase().includes(ql));
  const groups = {};
  d.lots.filter(l => filt(l) && match(l)).forEach(l => (groups[l.item] ||= []).push(l));
  const rows = Object.entries(groups).map(([item, lots]) => {
    const stockLots = lots.filter(has);
    const exps = stockLots.map(l => l.expiry).filter(e => /^\d{4}-/.test(e || '')).sort();
    return {item, lots, qty: sum(stockLots.map(l => l.stock_qty || 0)), amt: sum(stockLots.map(l => l.stock_amt || 0)),
            exp: exps[0] || '', last: lots.map(l => l.last_ship || '').sort().pop() || '',
            loc: [...new Set(stockLots.map(l => l.location).filter(Boolean))].join(', ')};
  }).sort((a, b) => a.item.localeCompare(b.item));
  const live = d.lots.filter(l => has(l) && !isDead(l));
  const cnt = {stock: live.length, soon: d.lots.filter(l => has(l) && soon(l)).length, dead: d.lots.filter(l => has(l) && isDead(l)).length, all: d.lots.length};
  $('#main').innerHTML = `<div class="card">
    <div class="row" style="margin-bottom:4px"><h3 style="margin:0">📦 재고</h3><span class="spacer"></span>${tools}</div>
    <div style="margin-bottom:10px">${invMetaLine(d.meta)}</div>
    <div class="stats stats4">
      <div class="stat" style="cursor:default"><span class="muted">재고 있는 품목</span><b>${new Set(live.map(l => l.item)).size}개</b></div>
      <div class="stat" style="cursor:default"><span class="muted">재고 로트</span><b>${live.length}개</b></div>
      ${d.can_cost ? `<div class="stat" style="cursor:default"><span class="muted">재고금액 (원가)</span><b>${krw(sum(live.map(l => l.stock_amt || 0)))}원</b></div>` : ''}
      <div class="stat" data-goto="soon"><span class="muted">소비기한 6개월 이내</span><b style="color:#b45309">${cnt.soon}개</b></div>
    </div>
    <div class="tabs"><button data-t="stock">재고 있음 (${cnt.stock})</button><button data-t="soon">소비기한 임박 (${cnt.soon})</button><button data-t="dead">불용·폐기 (${cnt.dead})</button><button data-t="all">전체 로트 (${cnt.all})</button></div>
    <div class="row" style="margin-bottom:10px"><input id="invQ" placeholder="품목 / CAS / 재고번호 / Origin / 위치" value="${esc(iv.q)}" style="max-width:300px"><span class="muted">${rows.length}품목</span></div>
    ${rows.length ? `<div class="mlist">${rows.map(r => `<div class="mrow" data-item="${esc(r.item)}">
        <div class="l1"><b>${esc(r.item)}</b><span class="amt">${kg(r.qty)} kg</span></div>
        <div class="l2"><span>로트 ${r.lots.length}</span>${r.loc ? `<span>${esc(r.loc)}</span>` : ''}${d.can_cost && r.amt ? `<span>${krw(r.amt)}원</span>` : ''}${r.exp ? expTag(r.exp, today) : ''}</div></div>`).join('')}</div>
      <div class="qscroll dtable"><table><thead><tr><th>품목</th><th style="text-align:right">재고량(kg)</th>${d.can_cost ? '<th style="text-align:right">재고금액</th>' : ''}<th style="white-space:nowrap">로트</th><th>위치</th><th style="white-space:nowrap">가장 빠른 소비기한</th><th style="white-space:nowrap">최근 출고</th></tr></thead><tbody>
      ${rows.map(r => `<tr data-item="${esc(r.item)}"><td class="title">${esc(r.item)}</td><td class="money">${kg(r.qty)}</td>${d.can_cost ? `<td class="money">${r.amt ? won(r.amt) : '-'}</td>` : ''}
        <td>${r.lots.length}</td><td><small>${esc(r.loc)}</small></td><td style="white-space:nowrap">${expTag(r.exp, today)}</td><td style="white-space:nowrap"><small>${esc(r.last)}</small></td></tr>`).join('')}
      </tbody></table></div>` : '<div class="empty">해당하는 재고가 없습니다.</div>'}
  </div>`;
  $$('.tabs button').forEach(b => { b.classList.toggle('active', b.dataset.t === iv.tab); b.onclick = () => { iv.tab = b.dataset.t; renderInventory(); }; });
  $$('[data-goto]').forEach(b => b.onclick = () => { iv.tab = b.dataset.goto; renderInventory(); });
  if (admin) { $('#invUp').onclick = () => openInvUpload(renderInventory); $('#invSet').onclick = openInvSettings; }
  let timer;
  $('#invQ').oninput = e => { clearTimeout(timer); timer = setTimeout(() => { iv.q = e.target.value; renderInventory().then(() => { const i = $('#invQ'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }); }, 300); };
  $$('[data-item]').forEach(el => el.onclick = () => openInvItem(groups[el.dataset.item], d.can_cost, today));
}

  openModal(`<h2>${esc(l0.item)}</h2>
    <div class="muted">${[l0.cas && 'CAS ' + l0.cas, l0.fema && 'FEMA ' + l0.fema].filter(Boolean).map(esc).join(' · ')}</div>
    ${lots.map(l => `<div class="ec-box">
      <div class="row"><b>${esc(l.lot_no || '(재고번호 없음)')}</b>${l.kind ? `<span class="tag p-low">${esc(l.kind)}</span>` : ''}<span class="spacer"></span><b>${kg(l.stock_qty)} kg</b></div>
      <div class="muted" style="font-size:12px;line-height:1.7">
        ${[l.location && '위치 ' + l.location, l.info, l.origin && 'Origin ' + l.origin, l.packing && 'Packing ' + l.packing, l.bat_no && 'Bat ' + l.bat_no,
           l.customs_date && '통관 ' + l.customs_date, l.import_qty != null && '수입 ' + kg(l.import_qty) + 'kg', l.transport].filter(Boolean).map(esc).join(' · ')}
        <br>소비기한 ${expTag(l.expiry, today) || '-'}
        ${canCost ? `<br>원가 <b>${l.cost_krw ? won(l.cost_krw) + '원/kg' : '-'}</b>${l.cost_est === 1 ? ' (외화×환율로 계산)' : l.cost_est === 2 ? ' <span class="tag p-high">원가 없음 → 같은 품목 최근 원가 참고</span>' : ''}${l.cost_fx ? ` · 외화 ${l.cost_fx}${l.rate ? ' × ' + l.rate : ''}` : ''}${l.stock_amt ? ` · 재고금액 ${won(l.stock_amt)}원` : ''}` : ''}
        ${l.order_note ? `<br>발주: ${esc(l.order_note)}` : ''}
      </div>
      ${l.ship_count ? `<a href="#" data-lot="${l.id}" style="font-size:13px">출고 기록 ${l.ship_count}건 보기</a><div class="lot-ships"></div>` : '<div class="muted" style="font-size:12px">출고 기록 없음</div>'}
    </div>`).join('')}
    <div class="actions"><button class="btn primary" data-close>닫기</button></div>`, bg => {
    bg.firstElementChild.classList.add('wide');
    $$('[data-lot]', bg).forEach(a => a.onclick = async e => {
      e.preventDefault();
      const box = a.nextElementSibling;
      if (box.innerHTML) { box.innerHTML = ''; return; }
      const r = await api(`/api/inventory/lot/${a.dataset.lot}`);
      box.innerHTML = `<div class="qscroll"><table class="an-table" style="margin-top:6px"><thead><tr><th>출고일</th><th>거래처</th><th class="num">출고량</th></tr></thead><tbody>
        ${r.ships.map(s => `<tr><td>${esc(s.ship_date)}</td><td>${esc(s.customer)}</td><td class="num">${kg(s.qty)}</td></tr>`).join('')}
      </tbody></table></div>`;
    });
  });
}

function openLedgerUpload(after) {
  const y0 = new Date().getFullYear();
  openModal(`<h2>💰 매입매출장 올리기</h2>
    <div class="muted" style="font-size:13px">일계장 엑셀(xls/xlsx)의 <b>매입매출장</b> 시트를 읽습니다. 같은 연도는 올릴 때마다 이 파일 내용으로 바뀝니다.</div>
    <label>엑셀 파일</label><input type="file" id="ldFile" accept=".xls,.xlsx,.xlsm">
    <label>연도 <small class="muted">(시트 제목의 "2026년도"를 자동으로 읽음)</small></label>
    <select id="ldYear"><option value="0">자동</option>${[0, 1, 2, 3, 4, 5].map(k => `<option>${y0 - k}</option>`).join('')}</select>
    <div id="ldPrev" class="muted" style="margin-top:8px"></div><div class="err"></div>
    <div class="actions"><button class="btn" data-close>닫기</button><button class="btn primary" id="ldGo" disabled>올리기</button></div>`, (bg, close) => {
    const send = async dry => {
      const fd = new FormData(); fd.append('file', $('#ldFile', bg).files[0]);
      const res = await fetch(`/api/ledger/upload?dry_run=${dry}&year=${$('#ldYear', bg).value}`, {method: 'POST', headers: {Authorization: 'Bearer ' + state.token}, body: fd});
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || '업로드 실패');
      return data;
    };
    $('#ldFile', bg).onchange = $('#ldYear', bg).onchange = async () => {
      if (!$('#ldFile', bg).files[0]) return;
      $('.err', bg).textContent = ''; $('#ldGo', bg).disabled = true; $('#ldPrev', bg).textContent = '읽는 중…';
      try {
        const r = await send(true);
        $('#ldPrev', bg).innerHTML = `시트 <b>${esc(r.sheet)}</b> · <b>${r.year}년</b> ${r.rows}줄 (마지막 ${esc(r.last)}) · 매출 ${krw(r.sales)}원 · 손익 ${krw(r.profit)}원`;
        $('#ldGo', bg).disabled = false;
      } catch (err) { $('#ldPrev', bg).textContent = ''; $('.err', bg).textContent = err.message; }
    };
    $('#ldGo', bg).onclick = async () => {
      try { const r = await send(false); close(); toast(`${r.year}년 ${r.rows}줄을 반영했습니다.`); after && after(); }
      catch (err) { $('.err', bg).textContent = err.message; }
    };
  });
}

async function renderProfit() {
  const pf = state.pf ||= {year: 0, tab: 'cust', low: 10, q: '', inc: false};
  const [d, exNote] = await Promise.all([api(`/api/inventory/profit?year=${pf.year}&low=${pf.low}&include_ex=${pf.inc}`), excludeNote()]);
  const admin = state.me.role === 'admin';
  const tools = admin ? '<button class="btn" id="pfSet" title="자동 업로드 설정">⚙</button><button class="btn primary" id="pfUp">매입매출장 올리기</button>' : '';
  if (!d.years.length) {
    $('#main').innerHTML = `<div class="card"><div class="row"><h3 style="margin:0">💰 이익분석</h3><span class="spacer"></span>${tools}</div><div class="empty">${admin ? '일계장 엑셀(매입매출장 시트)을 올려 주세요. ⚙ 에서 폴더를 정하면 매일 자동으로 올라옵니다.' : '아직 매입매출장이 올라오지 않았습니다.'}</div></div>`;

  const cm = d.monthly[Y], pm = d.monthly[P];

  const upto = Y === now.getFullYear() ? Math.max(lastM, 1) : (lastM || 12);
  const ytd = k => sum(cm[k].slice(0, upto)), pytd = k => sum(pm[k].slice(0, upto));
  const rate = (p, r) => r ? (p / r * 100).toFixed(1) + '%' : '-';

  let table;

      ${months.map((mn, i) => `<tr><td>${mn}</td><td class="num">${man(cm.rev[i])}</td><td class="num">${man(cm.cost[i])}</td><td class="num"><b>${man(cm.profit[i])}</b></td><td class="num">${rate(cm.profit[i], cm.rev[i])}</td><td class="num">${man(pm.profit[i])}</td><td class="num">${cm.rev[i] ? deltaHtml(cm.profit[i], pm.profit[i]) : '-'}</td></tr>`).join('')}
      <tr><td><b>합계</b></td><td class="num"><b>${man(sum(cm.rev))}</b></td><td class="num"><b>${man(sum(cm.cost))}</b></td><td class="num"><b>${man(sum(cm.profit))}</b></td><td class="num"><b>${rate(sum(cm.profit), sum(cm.rev))}</b></td><td class="num">${man(sum(pm.profit))}</td><td class="num">${deltaHtml(ytd('profit'), pytd('profit'))}</td></tr>
      </tbody></table></div><div class="muted" style="font-size:12px;margin-top:4px">금액 단위: 만원</div>`;
  else if (pf.tab === 'low') table = `<div class="row" style="margin-bottom:6px"><span class="muted">이익률</span><select id="pfLow" style="width:auto">${[0, 5, 10, 15, 20, 30].map(v => `<option value="${v}" ${v === pf.low ? 'selected' : ''}>${v}% 미만</option>`).join('')}</select><span class="muted" style="font-size:12px">${Y}년 · 0% 미만은 손해</span></div>
      <div class="qscroll" style="max-height:560px;overflow:auto"><table class="an-table"><thead><tr><th>품목</th><th>날짜</th><th>매출처</th><th>매입처</th><th class="num">수량</th><th class="num">매출단가</th><th class="num">매입단가</th><th class="num">이익</th><th class="num">이익률</th><th>비고</th></tr></thead><tbody>
      ${lows.map(e => `<tr><td title="${esc(e.item)}">${esc(e.item)}</td><td>${esc(e.date)}</td><td>${esc(e.customer)}</td><td>${esc(e.supplier)}</td><td class="num">${kg(e.qty)}</td><td class="num">${e.price != null ? won(e.price) : '-'}</td>
        <td class="num">${e.unit_cost != null ? won(e.unit_cost) : '-'}</td><td class="num ${e.profit < 0 ? 'down' : ''}">${won(e.profit)}</td><td class="num ${e.margin < 0 ? 'down' : ''}">${e.margin.toFixed(1)}%</td><td><small class="muted">${esc(e.note)}</small></td></tr>`).join('') || '<tr><td colspan="10" class="empty">없습니다.</td></tr>'}
      </tbody></table></div>`;
  else table = `<div class="qscroll" style="max-height:560px;overflow:auto"><table class="an-table"><thead><tr><th>${{cust: '매출처', item: '품목', sup: '매입처'}[pf.tab]}</th><th class="num">건수</th><th class="num">수량(kg)</th><th class="num">매출</th><th class="num">매입</th><th class="num">이익</th><th class="num">이익률</th></tr></thead><tbody>
      ${list.map(e => `<tr><td title="${esc(e.name)}">${esc(e.name)}</td><td class="num">${e.count}</td><td class="num">${kg(e.qty)}</td><td class="num">${man(e.rev)}</td><td class="num">${man(e.cost)}</td>

// ===================================================== 매출(납품) 분석
const krw = v => {  // 축/요약용 짧은 금액
  const a = Math.abs(v);
  if (a >= 1e8) return (v / 1e8).toFixed(a >= 1e10 ? 0 : 1).replace(/\.0$/, '') + '억';
  if (a >= 1e4) return Math.round(v / 1e4).toLocaleString('ko-KR') + '만';
  return Math.round(v).toLocaleString('ko-KR');
};
const man = v => v ? Math.round(v / 1e4).toLocaleString('ko-KR') : '-';   // 표: 만원 단위
const sum = a => a.reduce((x, y) => x + y, 0);
function deltaHtml(cur, prev) {
  if (!prev) return cur ? '<span class="muted">신규</span>' : '<span class="muted">-</span>';
  const r = (cur - prev) / prev * 100;
  return r >= 0 ? `<span class="up">▲ ${r.toFixed(1)}%</span>` : `<span class="down">▼ ${Math.abs(r).toFixed(1)}%</span>`;
}
function niceMax(v) {
  if (v <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v))), n = v / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
}

// 꺾은선 (최대 3계열) + 십자선 툴팁
function lineChart(box, labels, series) {
  const W = Math.max(box.clientWidth, 320), H = box.clientWidth < 600 ? 220 : 280, L = 56, R = 64, T = 14, B = 28, iw = W - L - R, ih = H - T - B;
  const max = niceMax(Math.max(1, ...series.flatMap(s => s.values.filter(v => v != null))));
  const x = i => L + (labels.length === 1 ? iw / 2 : i * iw / (labels.length - 1)), y = v => T + ih - v / max * ih;
  let g = '';
  for (let k = 0; k <= 4; k++) {
    const v = max * k / 4, yy = y(v);
    g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="var(--grid)"/><text x="${L - 8}" y="${yy + 4}" text-anchor="end" font-size="11" fill="var(--axis)">${krw(v)}</text>`;
  }
  const step = iw / labels.length < 34 ? 2 : 1;   // 좁은 화면에선 한 달 건너 표시
  labels.forEach((l, i) => { if (i % step === 0) g += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--axis)">${l}</text>`; });
  series.forEach(s => {
    const pts = s.values.map((v, i) => [i, v]).filter(([, v]) => v != null);   // 아직 오지 않은 달(null)은 그리지 않음
    g += `<path d="${pts.map(([i, v], k) => (k ? 'L' : 'M') + x(i) + ' ' + y(v)).join('')}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    pts.forEach(([i, v]) => g += `<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`);
    if (pts.length) {  // 끝 직접 라벨 (글자색은 본문색)
      const [li, lv] = pts[pts.length - 1];
      g += `<text x="${x(li) + 8}" y="${y(lv) + 4}" font-size="11" fill="var(--ink-2)">${esc(s.name)}</text>`;
    }
  });
  box.innerHTML = `<div class="viz-legend">${series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>
    <div class="viz-wrap"><svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="월별 납품금액">${g}
      <line class="xh" y1="${T}" y2="${T + ih}" stroke="var(--axis)" stroke-dasharray="3 3" visibility="hidden"/>
      <rect x="${L}" y="${T}" width="${iw}" height="${ih}" fill="transparent" class="hit"/></svg><div class="viz-tip" hidden></div></div>`;
  const svg = $('svg', box), tip = $('.viz-tip', box), xh = $('.xh', box);
  $('.hit', box).addEventListener('mousemove', e => {
    const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) * W / r.width;
    const i = Math.max(0, Math.min(labels.length - 1, Math.round((px - L) / (iw / Math.max(1, labels.length - 1)))));
    xh.setAttribute('x1', x(i)); xh.setAttribute('x2', x(i)); xh.setAttribute('visibility', 'visible');
    const [a, b] = series;
    tip.innerHTML = `<b>${labels[i]}${box.dataset.cum ? ' 누계' : ''}</b><br>` + series.map(s => `<span class="sw" style="background:${s.color}"></span>${esc(s.name)} ${s.values[i] == null ? '-' : won(s.values[i]) + '원'}${s.monthly && s.values[i] != null ? ` <span style="opacity:.7">(그 달 ${krw(s.monthly[i])})</span>` : ''}`).join('<br>')
      + (b && a.values[i] != null && b.values[i] != null ? `<br>${deltaHtml(a.values[i], b.values[i]).replace(/class="(up|down)"/, 'style="font-weight:700"')}` : '');
    tip.hidden = false;
    const tx = x(i) * r.width / W;
    tip.style.left = Math.min(tx + 12, r.width - tip.offsetWidth - 4) + 'px';
    tip.style.top = '30px';
  });
  $('.hit', box).addEventListener('mouseleave', () => { tip.hidden = true; xh.setAttribute('visibility', 'hidden'); });
}

// 막대 (1계열) + 막대별 툴팁
function barChart(box, labels, values, name) {
  const W = Math.max(box.clientWidth, 320), H = box.clientWidth < 600 ? 220 : 280, L = 56, R = 16, T = 14, B = 28, iw = W - L - R, ih = H - T - B;
  const max = niceMax(Math.max(1, ...values)), y = v => T + ih - v / max * ih;
  const slot = iw / labels.length, bw = Math.max(6, Math.min(56, slot - 2));
  let g = '';
  for (let k = 0; k <= 4; k++) {
    const v = max * k / 4, yy = y(v);
    g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="var(--grid)"/><text x="${L - 8}" y="${yy + 4}" text-anchor="end" font-size="11" fill="var(--axis)">${krw(v)}</text>`;
  }
  values.forEach((v, i) => {
    const cx = L + slot * i + slot / 2, x0 = cx - bw / 2, top = y(v), h = T + ih - top, rr = Math.min(4, h, bw / 2);
    if (h > 0) g += `<path d="M${x0} ${T + ih}V${top + rr}Q${x0} ${top} ${x0 + rr} ${top}H${x0 + bw - rr}Q${x0 + bw} ${top} ${x0 + bw} ${top + rr}V${T + ih}Z" fill="var(--series-1)"/>`;
    g += `<rect x="${L + slot * i}" y="${T}" width="${slot}" height="${ih}" fill="transparent" data-i="${i}"/>`;
    g += `<text x="${cx}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--axis)">${labels[i]}</text>`;
  });
  const li = values.length - 1;  // 마지막 막대만 값 라벨
  if (li >= 0) g += `<text x="${L + slot * li + slot / 2}" y="${y(values[li]) - 6}" text-anchor="middle" font-size="11" fill="var(--ink)">${krw(values[li])}</text>`;
  box.innerHTML = `<div class="viz-wrap"><svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(name)}">${g}</svg><div class="viz-tip" hidden></div></div>`;
  const svg = $('svg', box), tip = $('.viz-tip', box);
  $$('[data-i]', box).forEach(rc => {
    rc.addEventListener('mouseenter', () => {
      const i = +rc.dataset.i, r = svg.getBoundingClientRect();
      tip.innerHTML = `<b>${labels[i]}</b><br>${won(values[i])}원${i ? '<br>' + deltaHtml(values[i], values[i - 1]).replace(/class="(up|down)"/, 'style="font-weight:700"') + ' (전년 대비)' : ''}`;
      tip.hidden = false;
      tip.style.left = Math.min((L + slot * i + slot) * r.width / W, r.width - tip.offsetWidth - 4) + 'px';
      tip.style.top = '20px';
    });
    rc.addEventListener('mouseleave', () => tip.hidden = true);
  });
}

async function renderAnalytics() {

  }

  const now = new Date();
  // 같은 기간 비교: 올해는 이번 달까지, 자료가 연중에 끝난 마지막 연도는 자료가 있는 달까지
  const lastDataM = d.monthly[Y].reduce((acc, v, i) => v ? i + 1 : acc, 0);
  const upto = Y === now.getFullYear() ? now.getMonth() + 1 : (Y === d.years[d.years.length - 1] && lastDataM ? lastDataM : 12);
  const cust = an.cust && d.customers.find(c => c.name === an.cust);
  const curM = cust ? cust.cur : d.monthly[Y], prevM = cust ? cust.prev : (d.monthly[P] || Array(12).fill(0));
  const ytd = sum(curM.slice(0, upto)), pytd = sum(prevM.slice(0, upto));
  const years = d.years.filter(y => y <= Y).slice(-8);
  const custYearly = name => years.map(y => (d.yearly[name] || {})[y] || 0);
  const yearVals = an.cust ? custYearly(an.cust) : years.map(y => d.year_totals[y] || 0);
  const ql = an.q.toLowerCase();

  const yRows = Object.keys(d.yearly).filter(n => !ql || n.toLowerCase().includes(ql)).map(n => ({name: n, vals: custYearly(n)}))
    .filter(r => sum(r.vals)).sort((a, b) => b.vals[b.vals.length - 1] - a.vals[a.vals.length - 1]);
  $('#main').innerHTML = `<div class="card viz">
    <div class="row" style="margin-bottom:10px"><h3 style="margin:0">📊 거래처별 납품금액</h3><span class="spacer"></span>
      <select id="anYear" style="width:auto">${d.years.slice().reverse().map(y => `<option value="${y}" ${y === Y ? 'selected' : ''}>${y}년</option>`).join('')}</select>
      <select id="anBasis" style="width:auto"><option value="supply" ${an.basis === 'supply' ? 'selected' : ''}>공급가액 기준</option><option value="total" ${an.basis === 'total' ? 'selected' : ''}>합계(VAT 포함) 기준</option></select>
      <input id="anQ" placeholder="거래처 검색" value="${esc(an.q)}" style="max-width:180px"></div>
    <div class="tabs"><button data-mode="month">월별 비교 (${Y} vs ${P})</button><button data-mode="year">연별 비교</button><button data-mode="decline">📉 감소·이탈 거래처</button></div>
    ${exNote}
    <div class="stats stats4">
      <div class="stat" style="cursor:default"><span class="muted">${Y}년 ${upto < 12 ? `1~${upto}월` : '연간'} 납품</span><b>${krw(ytd)}원</b></div>
      <div class="stat" style="cursor:default"><span class="muted">${P}년 같은 기간</span><b>${krw(pytd)}원</b></div>
      <div class="stat" style="cursor:default"><span class="muted">전년 대비</span><b style="font-size:20px">${deltaHtml(ytd, pytd)}</b></div>
      <div class="stat" style="cursor:default"><span class="muted">${Y}년 거래처 수</span><b>${d.customers.filter(c => sum(c.cur)).length}곳</b></div>
    </div>
    <div class="row" style="margin-bottom:4px"><b>${an.cust ? esc(an.cust) : '전체 거래처'}${an.mode === 'month' ? ' · 1월부터 누계' : ''}</b>
      ${an.cust ? '<button class="btn sm" id="anAll">전체로 보기</button>' : '<span class="muted" style="font-size:12px">아래 표에서 거래처를 누르면 그 거래처만 그래프로 봅니다</span>'}</div>
    <div id="anChart"></div>
    <div class="row" style="margin:14px 0 6px"><b>${an.mode === 'month' ? `${Y}년 월별` : '연도별'} 거래처 납품금액</b><span class="muted" style="font-size:12px">(단위: 만원 · ${an.mode === 'month' ? `${rows.length}곳` : `${yRows.length}곳`})</span></div>

    : `<table class="an-table"><thead><tr><th>거래처</th>${years.map(y => `<th class="num">${y}</th>`).join('')}<th class="num">전년 대비</th></tr></thead><tbody>

  </div>`;
  if (an.mode === 'month') {

    $('#anChart').dataset.cum = '1';
    lineChart($('#anChart'), months, [
      {name: `${Y}년`, color: 'var(--series-1)', values: cum(curM, upto), monthly: curM},

  let timer;
  $('#anQ').oninput = e => { clearTimeout(timer); timer = setTimeout(() => { an.q = e.target.value; renderAnalytics().then(() => { const i = $('#anQ'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }); }, 300); };
  if ($('#anAll')) $('#anAll').onclick = () => { an.cust = ''; renderAnalytics(); };
  bindExcludeEdit();
  $$('tr[data-c]').forEach(tr => tr.onclick = () => { an.cust = an.cust === tr.dataset.c ? '' : tr.dataset.c; renderAnalytics().then(() => window.scrollTo({top: 0, behavior: 'smooth'})); });

// 여러 단어 검색: "a4 500" → 코드/이름/규격에 모든 단어가 들어간 것
// 비교용 정규화: 대소문자·띄어쓰기·(주)/㈜/주식회사·괄호 무시
const normText = t => String(t || '').toLowerCase().replace(/\(주\)|㈜|주식회사|\(유\)|유한회사/g, '').replace(/[\s()\[\]\-_.,·]/g, '');

// 여러 단어 검색: "삼성 2공장" → 이름/코드 등에 모든 단어가 들어간 것 (띄어쓰기·(주) 무시)
function searchList(list, query, fields) {
  const words = query.split(/\s+/).map(normText).filter(Boolean);
  if (!words.length) return list.slice(0, 30);
  const out = [];
  for (const it of list) {
    const hay = normText(fields(it).join(' '));
    if (words.every(w => hay.includes(w))) { out.push(it); if (out.length >= 50) break; }
  }
  return out;
}

function attachSearch(input, search, render, pick) {
  let box = null, items = [], idx = -1;
  const close = () => { if (box) { box.remove(); box = null; } };
  const open = () => {
    items = search(input.value.trim());
    if (!box) { box = document.createElement('div'); box.className = 'sbox'; document.body.appendChild(box); }
    const r = input.getBoundingClientRect();
    box.style.left = Math.min(r.left, window.innerWidth - 330) + 'px';
    box.style.width = Math.max(r.width, 320) + 'px';
    const below = window.innerHeight - r.bottom;
    if (below < 220 && r.top > below) { box.style.top = ''; box.style.bottom = (window.innerHeight - r.top + 2) + 'px'; }
    else { box.style.bottom = ''; box.style.top = (r.bottom + 2) + 'px'; }
    idx = -1;
    box.innerHTML = items.length ? items.map((it, i) => `<div data-i="${i}">${render(it)}</div>`).join('')
      : '<div class="none">검색 결과가 없습니다. 다른 단어로 찾아보세요.</div>';
    $$('[data-i]', box).forEach(d => d.onmousedown = e => { e.preventDefault(); pick(items[+d.dataset.i]); close(); });
  };
  input.setAttribute('autocomplete', 'off');
  input.addEventListener('focus', open);
  input.addEventListener('input', open);
  input.addEventListener('blur', () => setTimeout(close, 150));
  input.addEventListener('keydown', e => {
    if (!box || !items.length) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      idx = (idx + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
      $$('[data-i]', box).forEach((d, i) => d.classList.toggle('on', i === idx));
      $$('[data-i]', box)[idx].scrollIntoView({block: 'nearest'});
    } else if (e.key === 'Enter' && idx >= 0) { e.preventDefault(); pick(items[idx]); close(); }
    else if (e.key === 'Escape') close();
  });
  const modal = input.closest('.modal-bg');
  if (modal) modal.addEventListener('scroll', close);
}

// 이카운트에 이미 등록된 문서를 TeamHub 에서 수정한 뒤: 다시 등록할지 묻기
function promptResend(id, slips) {
  const kinds = [['quotation', '견적서', slips.quotation], ['sale', '판매(거래명세서)', slips.sale]].filter(k => k[2]);
  openModal(`<h2>이카운트에도 반영할까요?</h2>
    <div style="font-size:14px;line-height:1.6">이 문서는 이카운트에 이미 등록돼 있어요 (${kinds.map(k => `${k[1]} 전표 <b>${esc(k[2])}</b>`).join(', ')}).<br>
      이카운트는 외부에서 <b>수정·삭제가 안 되기 때문에</b>, 수정한 내용으로 <b>새 전표를 등록</b>하고<br>
      예전 전표는 <b>"이카운트에서 삭제" 할 일</b>로 만들어 드려요. 이카운트에서 예전 전표만 지우면 끝이에요.</div>
    <div class="actions"><button class="btn" data-close>나중에</button>
      ${kinds.map(k => `<button class="btn primary" data-kind="${k[0]}">${k[1]} 다시 등록</button>`).join('')}</div>`, (bg, close) => {
    $$('[data-kind]', bg).forEach(b => b.onclick = async () => {
      close();
      const [q, ec] = await Promise.all([api(`/api/quotes/${id}`), ecMaster()]);
      openEcSend(q, b.dataset.kind, ec);
    });
  });
}

function openEcSend(q, kind, ec) {
  const isSale = kind === 'sale';
  const label = isSale ? '거래명세서(판매)' : '견적서';
  const already = isSale ? q.ecount_sale_slip : q.ecount_quote_slip;
  openModal(`<h2>${already ? `수정본으로 이카운트 ${label} 다시 등록` : `이카운트 ${label}로 전송`}</h2>
    <div class="muted">${esc(q.quote_no)} · ${esc(q.customer_name)} · 합계 ${won(q.grand_total)}원</div>
    ${ec.mode === 'test' ? '<div class="tag s-hold" style="margin-top:8px">테스트 서버 모드 — 실제 장부에는 들어가지 않습니다</div>' : ''}
    ${already ? `<div class="desc" style="font-size:13px">지금 내용으로 <b>새 전표</b>를 등록합니다. 예전 전표 <b>${esc(already)}</b>는 이카운트에 그대로 남으니,
      등록 후 생기는 <b>"[이카운트] 예전 전표 삭제"</b> 업무를 보고 이카운트에서 지워 주세요.</div>` : ''}
    <form>
      <label>${isSale ? '판매일자' : '견적일자'}</label><input type="date" name="io_date" value="${isSale ? todayStr() : esc(q.quote_date)}" required>
      <label>${isSale ? '출고 창고 *' : '창고 (선택)'}</label>
      <select name="wh_cd" ${isSale ? 'required' : ''}><option value="">${ec.warehouses.length ? '선택하세요' : '등록된 창고가 없습니다 (관리자: 🔗 이카운트 설정)'}</option>
        ${ec.warehouses.map(w => `<option value="${esc(w.code)}" ${(q.ecount_wh || ec.default_wh) === w.code ? 'selected' : ''}>${esc(w.name)} (${esc(w.code)})${w.code === ec.default_wh ? ' ★기본' : ''}</option>`).join('')}</select>
      <div class="err" id="ecErr"></div>
      <div class="actions"><button type="button" class="btn" data-close>취소</button><button class="btn primary">${already ? '새 전표로 다시 등록' : '전송'}</button></div>
    </form>`, (bg, close) => {
    $('form', bg).onsubmit = async e => {
      e.preventDefault();
      const f = e.target, btn = $('button.primary', bg);
      btn.disabled = true; btn.textContent = '전송 중…'; $('#ecErr', bg).textContent = '';
      try {
        const r = await api(`/api/quotes/${q.id}/ecount`, {method: 'POST', body: {kind, wh_cd: f.wh_cd.value, io_date: f.io_date.value, force: !!already}});
        state.lastWh = f.wh_cd.value;
        close(); toast(`이카운트 ${label} 등록 완료 ${r.slip_nos.length ? '(전표 ' + r.slip_nos.join(', ') + ')' : ''}${r.replaced ? ' · 예전 전표 삭제 할 일을 만들었어요' : ''}`);
        openQuoteView(q.id); if (state.view === 'quotes') renderQuotes();
      } catch (err) { $('#ecErr', bg).textContent = err.message; btn.disabled = false; btn.textContent = '다시 시도'; }
    };
  });
}

async function openEcountSettings() {
  const [s, logs] = await Promise.all([api('/api/ecount/settings'), api('/api/ecount/logs')]);
  const ec = await ecMaster(true);
  const d = s.defaults;
  openModal(`<h2>🔗 이카운트 연동 설정</h2>
    <form id="ecForm">
      <div class="grid2">
        <div><label>회사코드</label><input name="com_code" value="${esc(s.com_code)}" placeholder="이카운트 로그인 회사코드"></div>
        <div><label>사용자 ID</label><input name="user_id" value="${esc(s.user_id)}" placeholder="API 인증키를 발급받은 ID"></div>
        <div><label>API 인증키 ${s.has_key ? '<span class="tag s-done">등록됨</span>' : ''}</label><input name="api_key" type="password" autocomplete="new-password" placeholder="${s.has_key ? '변경할 때만 입력' : '발급받은 인증키'}"></div>
        <div><label>서버</label><select name="is_test"><option value="1" ${s.is_test === '1' ? 'selected' : ''}>테스트 서버 (테스트 인증키)</option><option value="0" ${s.is_test === '0' ? 'selected' : ''}>실서비스 (정식 인증키)</option></select></div>
        <div><label>담당자 코드 (선택)</label><input name="emp_cd" value="${esc(s.emp_cd)}" placeholder="전표에 넣을 이카운트 담당자 코드"></div>
        <div><label>기본 출고 창고</label><select name="default_wh"><option value="">자동 (2번 창고 / 이알씨 창고)</option>
          ${ec.warehouses.map(w => `<option value="${esc(w.code)}" ${s.default_wh === w.code ? 'selected' : ''}>${esc(w.name)} (${esc(w.code)})</option>`).join('')}</select></div>
      </div>
      <details style="margin-top:10px"><summary class="muted" style="cursor:pointer">고급: API 경로 (이카운트 API 매뉴얼과 다를 때만 수정)</summary>
        <div class="grid2">
          <div><label>품목 조회</label><input name="path_products" value="${esc(s.path_products)}" placeholder="${esc(d.products)}"></div>
          <div></div>
          <div><label>견적서 입력</label><input name="path_quotation" value="${esc(s.path_quotation)}" placeholder="${esc(d.quotation)}"></div>
          <div><label>견적서 목록 키</label><input name="path_quotation_list_key" value="${esc(s.path_quotation_list_key)}" placeholder="${esc(d.quotation_list_key)}"></div>
          <div><label>판매 입력</label><input name="path_sale" value="${esc(s.path_sale)}" placeholder="${esc(d.sale)}"></div>
          <div><label>판매 목록 키</label><input name="path_sale_list_key" value="${esc(s.path_sale_list_key)}" placeholder="${esc(d.sale_list_key)}"></div>
        </div></details>
      <div class="err" id="ecSetErr"></div>
      <div class="row" style="margin-top:10px"><button class="btn primary">저장</button><button type="button" class="btn" id="ecTest">연결 테스트</button><span class="muted" id="ecTestRes"></span></div>
    </form>

    <div class="ec-box"><div class="row"><b>📦 품목</b><span class="muted">${s.counts.products}개${s.last_sync ? ' · 마지막 불러오기 ' + esc(s.last_sync.slice(0, 16)) : ''}</span><span class="spacer"></span>
      <button class="btn sm primary" id="ecSync">이카운트에서 불러오기</button><label class="btn sm" style="margin:0">엑셀 업로드<input type="file" accept=".xlsx,.csv" data-up="products" hidden></label></div>
      <small class="muted">품목이 바뀌면 다시 불러오세요. 견적서에서 이름·코드·규격 일부만 입력해도 검색됩니다.</small></div>

    <div class="ec-box"><div class="row"><b>🏢 거래처</b><span class="muted">${s.counts.customers}개</span><span class="spacer"></span>
      <label class="btn sm" style="margin:0">엑셀 업로드<input type="file" accept=".xlsx,.csv" data-up="customers" hidden></label></div>
      <small class="muted">이카운트 거래처등록 목록 화면에서 [Excel] 로 내려받은 파일을 그대로 올리세요. (거래처 조회 API는 이카운트에서 제공하지 않습니다)</small></div>

    <div class="ec-box"><div class="row"><b>🏭 창고</b><span class="muted">${s.counts.warehouses}개</span><span class="spacer"></span>
      <label class="btn sm" style="margin:0">엑셀 업로드<input type="file" accept=".xlsx,.csv" data-up="warehouses" hidden></label></div>
      <label style="font-weight:400">한 줄에 하나씩 <b>창고코드 창고이름</b> (예: <code>100 본사창고</code>)</label>
      <textarea id="whText" style="min-height:80px">${ec.warehouses.map(w => w.code + ' ' + w.name).join('\n')}</textarea>
      <button type="button" class="btn sm" id="whSave" style="margin-top:6px">창고 저장</button></div>

    ${logs.length ? `<label>최근 전송 기록</label><div class="qscroll"><table><thead><tr><th>시간</th><th>견적번호</th><th>종류</th><th>결과</th><th>내용</th></tr></thead><tbody>
      ${logs.map(l => `<tr style="cursor:default"><td>${esc(l.created_at.slice(5, 16))}</td><td>${esc(l.quote_no || '-')}</td><td>${l.kind === 'sale' ? '판매' : '견적서'}</td>
        <td>${l.ok ? '<span class="tag s-done">성공</span>' : '<span class="tag p-urgent">실패</span>'}</td><td style="font-size:12px">${esc(l.slip_nos || l.message)}</td></tr>`).join('')}</tbody></table></div>` : ''}
    <div class="actions"><button class="btn" data-close>닫기</button></div>`, (bg, close) => {
    bg.firstElementChild.classList.add('wide');
    const f = $('#ecForm', bg);
    const values = () => Object.fromEntries($$('input[name], select[name]', f).map(i => [i.name, i.value]));
    const saveSettings = async () => { await api('/api/ecount/settings', {method: 'PUT', body: values()}); };
    f.onsubmit = async e => {
      e.preventDefault();
      try { await saveSettings(); toast('저장되었습니다.'); close(); openEcountSettings(); }
      catch (err) { $('#ecSetErr', bg).textContent = err.message; }
    };
    $('#ecTest', bg).onclick = async () => {
      $('#ecTestRes', bg).textContent = '확인 중…'; $('#ecSetErr', bg).textContent = '';
      try { await saveSettings(); const r = await api('/api/ecount/test', {method: 'POST'}); $('#ecTestRes', bg).innerHTML = `<span class="tag s-done">연결 성공</span> ${esc(r.mode)} · Zone ${esc(r.zone)}`; }
      catch (err) { $('#ecTestRes', bg).textContent = ''; $('#ecSetErr', bg).textContent = err.message; }
    };
    $('#ecSync', bg).onclick = async e => {
      e.target.disabled = true; e.target.textContent = '불러오는 중…';
      try { const r = await api('/api/ecount/sync-products', {method: 'POST'}); toast(`품목 ${r.count}개를 불러왔습니다.`); close(); openEcountSettings(); }
      catch (err) { $('#ecSetErr', bg).textContent = err.message; e.target.disabled = false; e.target.textContent = '이카운트에서 불러오기'; }
    };
    $$('[data-up]', bg).forEach(inp => inp.onchange = async () => {
      const file = inp.files[0]; if (!file) return;
      const fd = new FormData(); fd.append('file', file);
      try {
        const res = await fetch(`/api/ecount/upload/${inp.dataset.up}`, {method: 'POST', headers: {Authorization: 'Bearer ' + state.token}, body: fd});
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || '업로드 실패');
        toast(`${data.count}건을 등록했습니다.`); close(); openEcountSettings();
      } catch (err) { $('#ecSetErr', bg).textContent = err.message; }
    });
    $('#whSave', bg).onclick = async () => {
      const rows = $('#whText', bg).value.split('\n').map(l => l.trim()).filter(Boolean).map(l => { const m = l.match(/^(\S+)\s*(.*)$/); return {code: m[1], name: m[2]}; });
      try { const r = await api('/api/ecount/warehouses', {method: 'PUT', body: rows}); toast(`창고 ${r.count}개 저장`); ecMaster(true); }
      catch (err) { $('#ecSetErr', bg).textContent = err.message; }
    };
  });
}

boot();
</script>
</body>
</html>
