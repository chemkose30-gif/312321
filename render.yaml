# Render(render.com)에 그대로 올릴 수 있는 설정.
# 리포지토리를 연결하고 Blueprint로 이 파일을 선택하면 됩니다.
services:
  - type: web
    name: allone-uploader
    runtime: docker
    dockerfilePath: ./uploader/Dockerfile
    dockerContext: ./uploader
    # 대시보드에서 고른 인스턴스 등급과 반드시 같아야 한다.
    # 다르면 Blueprint 를 동기화할 때 여기 적힌 값으로 되돌아간다.
    # starter 0.5 CPU / standard 1 CPU / pro 4 CPU (무료 플랜은 디스크를 붙일 수 없다)
    plan: pro
    healthCheckPath: /healthz
    disk:
      name: uploader-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: APP_PASSWORD   # 로그인 비밀번호 — 배포 시 직접 입력
        sync: false
      - key: APP_SECRET     # 토큰 암호화 키
        generateValue: true
      # PUBLIC_BASE_URL 은 Render 가 주는 RENDER_EXTERNAL_URL 로 자동 설정됩니다.
      # 직접 도메인을 붙였다면 그때만 아래를 채우세요.
      - key: PUBLIC_BASE_URL
        sync: false
      - key: YOUTUBE_CLIENT_ID
        sync: false
      - key: YOUTUBE_CLIENT_SECRET
        sync: false
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
