<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영상 변환기</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --line:#2a2f3a; --text:#e8eaf0; --muted:#8b93a7; --accent:#ff4d4d; --ok:#3ecf8e; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
  main { max-width:560px; margin:0 auto; padding:40px 16px; }
  h1 { font-size:24px; margin:0 0 24px; }
  .tabs { display:flex; gap:8px; margin-bottom:16px; }
  .tab { flex:1; padding:12px; border:1px solid var(--line); background:transparent; color:var(--muted); border-radius:10px; font-size:15px; cursor:pointer; }
  .tab.active { background:var(--card); color:var(--text); border-color:var(--accent); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; }
  .panel { display:none; } .panel.active { display:block; }
  label { display:block; font-size:13px; color:var(--muted); margin:14px 0 6px; }
  input[type=text], select { width:100%; padding:12px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--text); font-size:15px; }
  .row { display:flex; gap:10px; } .row > div { flex:1; }
  button.go { width:100%; margin-top:18px; padding:14px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-size:16px; font-weight:600; cursor:pointer; }
  button.go:disabled { opacity:.5; cursor:not-allowed; }
  .drop { border:2px dashed var(--line); border-radius:12px; padding:32px 16px; text-align:center; color:var(--muted); cursor:pointer; }
  .drop.over { border-color:var(--accent); color:var(--text); }
  .drop strong { color:var(--text); word-break:break-all; }
  .status { margin-top:18px; display:none; }
  .bar { height:8px; background:var(--bg); border-radius:4px; overflow:hidden; }
  .bar > div { height:100%; width:0; background:var(--accent); transition:width .3s; }
  .msg { font-size:14px; color:var(--muted); margin-top:8px; word-break:break-all; }
  .msg.err { color:#ff8080; } .msg.ok { color:var(--ok); }
  .urlrow { display:flex; gap:8px; } .urlrow input { flex:1; }
  .urlrow button { padding:0 16px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); font-size:14px; cursor:pointer; white-space:nowrap; }
  .urlrow button:disabled { opacity:.5; cursor:not-allowed; }
  .video { display:flex; gap:12px; margin-top:16px; align-items:center; }
  .video img { width:120px; aspect-ratio:16/9; object-fit:cover; border-radius:8px; background:var(--bg); flex-shrink:0; }
  .video .t { font-size:15px; font-weight:600; line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .video .s { font-size:13px; color:var(--muted); margin-top:4px; }
  .opts { display:flex; flex-direction:column; gap:6px; margin-top:4px; }
  .opt { display:flex; align-items:center; gap:10px; padding:11px 12px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); font-size:15px; cursor:pointer; text-align:left; }
  .opt.sel { border-color:var(--accent); background:rgba(255,77,77,.08); }
  .opt b { min-width:72px; } .opt .n { color:var(--muted); font-size:13px; flex:1; }
  .opt .sz { color:var(--muted); font-size:13px; }
  .opt .warn { color:#f0b45a; font-size:12px; }
  .note { font-size:12px; color:var(--muted); margin-top:20px; line-height:1.6; }
</style>
</head>
<body>
<main>
  <h1>🎬 영상 변환기</h1>
  <div class="tabs">
    <button class="tab active" data-tab="yt">유튜브 다운로드</button>
    <button class="tab" data-tab="conv">파일 → MP4 변환</button>
  </div>

  <div class="card">
    <section class="panel active" id="yt">
      <label for="url">유튜브 링크</label>
      <div class="urlrow">
        <input type="text" id="url" placeholder="https://www.youtube.com/watch?v=...">
        <button id="infoGo">화질 보기</button>
      </div>
      <div id="ytInfo" hidden>
        <div class="video"><img id="thumb" alt=""><div><div class="t" id="vTitle"></div><div class="s" id="vSub"></div></div></div>
        <label>화질 선택</label>
        <div class="opts" id="opts"></div>
      </div>
      <button class="go" id="ytGo" disabled>다운로드</button>
    </section>

    <section class="panel" id="conv">
      <input type="file" id="file" accept="video/*,.mkv,.avi,.mov,.wmv,.flv,.webm,.ts,.m4v,.3gp,.mpg,.mpeg" hidden>
      <div class="drop" id="drop">파일을 여기로 끌어다 놓거나 클릭해서 선택하세요<br><small>MKV, AVI, MOV, WMV, FLV, WEBM, TS 등</small></div>
      <label for="preset">속도 / 화질</label>
      <select id="preset">
        <option value="fast">빠르게 (파일이 조금 커짐)</option>
        <option value="balanced" selected>균형 (추천)</option>
        <option value="quality">고화질 (느림)</option>
      </select>
      <div class="msg" id="serverInfo"></div>
      <button class="go" id="convGo" disabled>MP4로 변환</button>
    </section>

    <div class="status" id="status">
      <div class="bar"><div id="barFill"></div></div>
      <div class="msg" id="msg"></div>
    </div>
  </div>

  <p class="note">※ 본인 영상이나 저작권 문제가 없는 콘텐츠에만 사용하세요. 변환된 파일은 다운로드 후 서버에서 자동 삭제됩니다.</p>
</main>

<script>
const $ = id => document.getElementById(id);
let busy = false, selectedFile = null, maxUploadMb = Infinity;

fetch('/api/config').then(r => r.json()).then(c => {
  maxUploadMb = c.max_upload_mb;
  $('serverInfo').textContent = `최대 ${c.max_upload_mb >= 1024 ? (c.max_upload_mb / 1024).toFixed(1) + ' GB' : c.max_upload_mb + ' MB'}`
    + ` · ${c.gpu ? 'GPU 가속 사용 중' : 'CPU 인코딩'} · 동시 ${c.max_concurrent}개 처리`
    + ' · H.264 영상은 재인코딩 없이 즉시 변환';
}).catch(() => {});

document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  if (busy) return;
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === t));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === t.dataset.tab));
  $('status').style.display = 'none';
});
let ytChoice = null, ytInfoUrl = '';

const fmtSize = b => !b ? '' : b >= 1073741824 ? `약 ${(b / 1073741824).toFixed(1)} GB` : `약 ${Math.max(1, Math.round(b / 1048576))} MB`;
const fmtTime = s => { s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = String(s % 60).padStart(2, '0');
  return h ? `${h}:${String(m).padStart(2, '0')}:${x}` : `${m}:${x}`; };

function renderOpts(info) {
  const opts = info.qualities.map(q => ({format: 'mp4', quality: String(q.height), main: q.label,
    sub: q.name, size: q.size,
    warn: q.compatible ? '' : '일부 기기 재생 불가'}));
  opts.push({format: 'mp3', quality: 'best', main: 'MP3', sub: '음원만 (192kbps)', size: info.mp3_size, warn: ''});
  $('opts').innerHTML = '';
  opts.forEach((o, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = `<b></b><span class="n"></span><span class="warn"></span><span class="sz"></span>`;
    b.children[0].textContent = o.main;
    b.children[1].textContent = o.sub;
    b.children[2].textContent = o.warn;
    b.children[3].textContent = fmtSize(o.size);
    b.onclick = () => {
      if (busy) return;
      document.querySelectorAll('.opt').forEach(x => x.classList.toggle('sel', x === b));
      ytChoice = o; setBusy(busy);
    };
    $('opts').appendChild(b);
    // 기본 선택: 어디서나 재생되는 화질 중 가장 높은 것
    if (!ytChoice && o.format === 'mp4' && !o.warn) b.click();
  });
  if (!ytChoice) $('opts').firstChild.click();
}

async function loadInfo() {
  const url = $('url').value.trim();
  if (!url || busy) return;
  if (url === ytInfoUrl && ytChoice) return;
  ytChoice = null; ytInfoUrl = url; $('ytInfo').hidden = true; setBusy(busy);
  $('infoGo').disabled = true;
  setStatus(0, '영상 정보를 불러오는 중...');
  try {
    const res = await fetch('/api/youtube/info?url=' + encodeURIComponent(url));
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || '영상 정보를 불러오지 못했습니다');
    if ($('url').value.trim() !== url) return;  // 그 사이 링크가 바뀜
    $('thumb').src = data.thumbnail || ''; $('thumb').hidden = !data.thumbnail;
    $('vTitle').textContent = data.title;
    $('vSub').textContent = [data.uploader, data.duration ? fmtTime(data.duration) : ''].filter(Boolean).join(' · ');
    renderOpts(data);
    $('ytInfo').hidden = false;
    $('status').style.display = 'none';
  } catch (e) {
    ytInfoUrl = '';
    setStatus(0, e.message, 'err');
  } finally { $('infoGo').disabled = false; }
}
$('infoGo').onclick = loadInfo;
$('url').addEventListener('paste', () => setTimeout(loadInfo, 0));
$('url').onkeydown = e => { if (e.key === 'Enter') loadInfo(); };
$('url').oninput = () => { if ($('url').value.trim() !== ytInfoUrl) { ytChoice = null; $('ytInfo').hidden = true; setBusy(busy); } };

function setStatus(pct, text, cls = '') {
  $('status').style.display = 'block';
  $('barFill').style.width = pct + '%';
  $('msg').className = 'msg ' + cls;
  $('msg').textContent = text;
}
function setBusy(b) {
  busy = b;
  $('ytGo').disabled = b || !ytChoice;
  $('convGo').disabled = b || !selectedFile;
}

async function poll(jobId) {
  while (true) {
    await new Promise(r => setTimeout(r, 800));
    const res = await fetch(`/api/jobs/${jobId}`);
    if (!res.ok) throw new Error('작업 상태를 가져올 수 없습니다');
    const j = await res.json();
    if (j.status === 'error') throw new Error(j.message);
    if (j.status === 'done') {
      setStatus(100, `완료! ${j.filename} 다운로드를 시작합니다.`, 'ok');
      const a = document.createElement('a');
      a.href = `/api/jobs/${jobId}/download`;
      document.body.appendChild(a); a.click(); a.remove();
      return;
    }
    setStatus(j.progress, `${j.message} ${j.progress ? j.progress + '%' : ''}`);
  }
}

async function run(startFn) {
  setBusy(true);
  try { await poll(await startFn()); }
  catch (e) { setStatus(100, e.message, 'err'); }
  finally { setBusy(false); }
}

async function jsonOrThrow(res) {
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || '요청 실패');
  return data.job_id;
}

$('ytGo').onclick = () => {
  if (!ytChoice) return;
  run(async () => {
    setStatus(0, '요청 중...');
    return jsonOrThrow(await fetch('/api/youtube', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({url: ytInfoUrl, format: ytChoice.format, quality: ytChoice.quality}),
    }));
  });
};

function pickFile(f) {
  if (!f) return;
  if (f.size > maxUploadMb * 1048576) {
    setStatus(0, `파일이 너무 큽니다 (최대 ${maxUploadMb} MB)`, 'err');
    return;
  }
  selectedFile = f;
  $('drop').innerHTML = `<strong>${f.name.replace(/</g,'&lt;')}</strong><br><small>${(f.size/1048576).toFixed(1)} MB · 다른 파일을 선택하려면 클릭</small>`;
  setBusy(busy);
}
$('drop').onclick = () => !busy && $('file').click();
$('file').onchange = e => pickFile(e.target.files[0]);
['dragover','dragenter'].forEach(ev => $('drop').addEventListener(ev, e => { e.preventDefault(); $('drop').classList.add('over'); }));
['dragleave','drop'].forEach(ev => $('drop').addEventListener(ev, e => { e.preventDefault(); $('drop').classList.remove('over'); }));
$('drop').addEventListener('drop', e => !busy && pickFile(e.dataTransfer.files[0]));

$('convGo').onclick = () => run(() => new Promise((resolve, reject) => {
  // 업로드 진행률 표시를 위해 XHR 사용
  const fd = new FormData(); fd.append('file', selectedFile); fd.append('preset', $('preset').value);
  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/convert');
  xhr.upload.onprogress = e => e.lengthComputable && setStatus(e.loaded / e.total * 100, `업로드 중 ${Math.round(e.loaded / e.total * 100)}%`);
  xhr.onload = () => {
    let data = {}; try { data = JSON.parse(xhr.responseText); } catch {}
    xhr.status === 200 ? (setStatus(0, '변환 준비 중...'), resolve(data.job_id)) : reject(new Error(data.detail || '업로드 실패'));
  };
  xhr.onerror = () => reject(new Error('업로드 실패'));
  xhr.send(fd);
}));
</script>
</body>
</html>
